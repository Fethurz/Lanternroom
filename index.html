<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#16131d">
<title>Lanternroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a one-screen phone app. Home = cast list; Chat = scene background, portrait header, bubbles, composer. Dark by design (night reading). */
:root{
  --bg:#16131d; --surface:#211d2b; --surface-2:#2c2739; --line:#3a3449;
  --fg:#efeaf6; --muted:#a39bb6; --accent:#e8a95b; --accent-ink:#2a1a06;
  --user:#3a3150; --danger:#e2766f; --ok:#8fcf9f;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 12px;font-size:13px}
.icon{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg);flex:none}
.icon:active{background:var(--surface-2)}
.icon svg{width:22px;height:22px}

#app{height:100%;padding-top:env(safe-area-inset-top,0px)}
section.screen{height:100%;display:flex;flex-direction:column;position:relative}

/* Home */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.topbar h1{font:400 28px/1.1 var(--f-display);margin:0;letter-spacing:.01em}
.topbar h1 span{color:var(--accent)}
.home-scroll{flex:1;overflow-y:auto;padding:8px 16px 24px}
.tagline{color:var(--muted);margin:0 0 16px;font-size:14px}
#charList{display:grid;gap:12px}
.char-card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.char-card img,.char-card .ph{width:72px;height:90px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.char-card .name{font:400 19px/1.2 var(--f-display)}
.char-card .snip{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.char-card > div{min-width:0}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.home-actions .btn{flex:1}
.ph{display:grid;place-items:center;font:400 28px var(--f-display);color:var(--accent)}

/* Chat */
#chat{background:var(--bg)}
#scene{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
#scene.on{opacity:.38}
#chat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,19,29,.55),rgba(22,19,29,.2) 30%,rgba(22,19,29,.85));pointer-events:none;z-index:0}
.chatbar,#msgs,#composer,#status{position:relative;z-index:1}
.chatbar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;background:rgba(22,19,29,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chatbar .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:2px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:2px solid var(--accent);flex:none;transition:opacity .4s}
.who .t{min-width:0}
.who .n{font:400 18px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood-chip{display:inline-block;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--accent);margin-right:4px;text-transform:capitalize}
#msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.assistant{align-self:flex-start;background:rgba(33,29,43,.92);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:6px}
.msg em.act{color:#c9bfdc;font-style:italic}
.msg .q{color:#fff3e2}
.msg.typing{color:var(--muted)}
.msg.img{padding:6px;background:var(--surface);border:1px solid var(--line);align-self:center;max-width:94%}
.msg.img img{display:block;border-radius:12px;width:100%;min-height:120px;background:var(--surface-2)}
.msg.img .cap{font-size:12px;color:var(--muted);padding:6px 6px 2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.swipe{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.swipe button{padding:4px 10px;border-radius:999px;color:var(--accent);font-weight:700}
.swipe button:disabled{opacity:.3}
#status{font-size:12px;color:var(--muted);padding:0 16px 4px;min-height:0}
#status.err{color:var(--danger)}
#composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(22,19,29,.9);border-top:1px solid var(--line)}
#input{flex:1;min-width:0;resize:none;max-height:140px;min-height:44px;padding:10px 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);line-height:1.4}
#send{background:var(--accent);color:var(--accent-ink)}
#send:disabled{opacity:.5}

/* Sheets */
#sheet{position:fixed;inset:0;z-index:10;background:rgba(8,6,12,.6);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 20px}
.panel-head h2{margin:0;font:400 22px var(--f-display)}
#sheetBody{overflow-y:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.field textarea{min-height:90px;resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.group{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.group h3{margin:0;font:400 18px var(--f-display)}
.fact{display:flex;align-items:flex-start;gap:6px;padding:8px 6px 8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.fact.pinned{border-color:var(--accent)}
.fact span{flex:1;min-width:0;padding-top:3px}
.fact button{width:32px;height:32px;border-radius:8px;color:var(--muted);flex:none}
.fact.pinned .pin{color:var(--accent)}
.lore{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.lore input,.lore textarea{background:var(--surface)}
.big-portrait{width:100%;border-radius:16px;background:var(--surface-2);aspect-ratio:4/5;object-fit:cover}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;border-radius:12px;padding:14px 16px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood-grid figure{margin:0;text-align:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.mood-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.pick button{display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:12px;border:2px solid transparent;color:var(--muted);font-size:12px;align-items:center}
.pick button.sel{border-color:var(--accent);color:var(--accent)}
.pick{grid-template-columns:repeat(2,1fr)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.badge{display:inline-block;font:700 10px/1.6 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:middle}
.persona-bar{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;margin-bottom:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:14px;color:var(--muted)}
.persona-bar b{color:var(--fg)}
.persona-bar .chg{margin-left:auto;color:var(--accent);font-weight:700}
.msg-set{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:88%}
.msg-set .msg{max-width:100%}
.spk{display:flex;align-items:center;gap:8px;margin-bottom:4px;font:400 15px/1.2 var(--f-display);color:var(--accent)}
.spk img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.xrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.xbtn{font-size:13px;font-weight:700;color:var(--accent);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.xbtn:disabled{opacity:.6}
#speakers{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;padding:6px 10px 2px}
.chip{flex:none;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.checkrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.checkrow img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none}
.checkrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:8px}
.listrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%}
.listrow .grow{flex:1;min-width:0}
.listrow .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow.on{border-color:var(--accent)}
.kind-opt{display:flex!important;flex-direction:column;align-items:flex-start!important;gap:2px;text-align:left}
.kind-opt small{font-weight:400;color:var(--muted);font-size:13px}
.cast{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cast .row input,.cast select,.cast textarea{background:var(--surface)}
.range-row{display:flex;flex-direction:column;gap:4px}
.range-row .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.range-row .top b{font-size:15px}
.range-row .val{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.range-row .desc{font-size:13px;color:var(--muted)}
.range-row input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:6px}
.warn{font-size:13px;color:#f1c56b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details.adv summary{cursor:pointer;font-weight:700;color:var(--accent);padding:10px 0;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] .advbody{display:flex}
.advbody{flex-direction:column;gap:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <header class="topbar">
      <h1>Lantern<span>room</span></h1>
      <button class="icon" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div class="home-scroll">
      <button class="persona-bar" id="personaBar"></button>
      <p class="tagline" id="tagline">Your characters, with memory that holds.</p>
      <div id="charList"></div>
    </div>
    <div class="home-actions">
      <button class="btn primary" id="btnNewChar">New</button>
      <label class="btn" for="importCard">Import card</label>
      <button class="btn" id="btnBooks">Lorebooks</button>
      <input type="file" id="importCard" accept=".json,.png,application/json,image/png" hidden>
    </div>
  </section>

  <section id="chat" class="screen" hidden>
    <div id="scene"></div>
    <header class="chatbar">
      <button class="icon" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="who" id="btnWho" aria-label="Show portrait">
        <img class="avatar" id="avatar" alt="">
        <div class="t"><div class="n" id="chatName"></div><div class="p" id="chatPlace"></div></div>
      </button>
      <button class="icon" id="btnMemory" aria-label="Memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3 3 3 0 0 0 3-2V5a3 3 0 0 0-3-2zM15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3 3 3 0 0 1-3-2"/></svg></button>
      <button class="icon" id="btnMore" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </header>
    <div id="msgs" aria-live="polite"></div>
    <div id="status"></div>
    <div id="speakers" hidden></div>
    <form id="composer" autocomplete="off">
      <button type="button" class="icon" id="btnIllustrate" aria-label="Illustrate this moment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
      <textarea id="input" rows="1" placeholder="Write your reply…"></textarea>
      <button type="button" class="icon" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>
</div>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="panel-head"><h2 id="sheetTitle"></h2><button class="icon" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
"use strict";
/* ---------- Storage (IndexedDB, falls back to localStorage) ---------- */
const Store = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("lanternroom", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  async get(k) {
    if (this.db) return new Promise(res => { const t = this.db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); });
    try { const v = localStorage.getItem("lr:" + k); return v ? JSON.parse(v) : undefined; } catch { return undefined; }
  },
  async set(k, v) {
    if (this.db) return new Promise(res => { const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").put(JSON.parse(JSON.stringify(v)), k); tx.oncomplete = res; tx.onerror = res; });
    try { localStorage.setItem("lr:" + k, JSON.stringify(v)); } catch {}
  },
  async del(k) {
    if (this.db) return new Promise(res => { const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = res; tx.onerror = res; });
    try { localStorage.removeItem("lr:" + k); } catch {}
  },
  async keys() {
    if (this.db) return new Promise(res => { const t = this.db.transaction("kv").objectStore("kv").getAllKeys(); t.onsuccess = () => res(t.result.map(String)); t.onerror = () => res([]); });
    try { return Object.keys(localStorage).filter(k => k.startsWith("lr:")).map(k => k.slice(3)); } catch { return []; }
  }
};

/* ---------- Constants & state ---------- */
const MOODS = ["neutral","happy","sad","angry","surprised","flirty","scared","thoughtful","embarrassed"];
const KINDS = {
  character: { label: "Character", blurb: "One character you talk to." },
  world: { label: "World", blurb: "A whole setting. The AI narrates and plays everyone you meet." },
  group: { label: "Group", blurb: "Several characters together in one scene." }
};
const DEFAULTS = {
  v: 4, provider: "deepseek",
  apiKey: "", model: "deepseek-flash", thinking: false,
  customUrl: "https://openrouter.ai/api/v1", customKey: "", customModel: "deepseek/deepseek-chat",
  temperature: 1.65, maxTokens: 1000, contextTokens: 100600,
  topK: 6, topP: 0.79, repPenalty: 0, freqPenalty: 0.21,
  keepRecent: 16, summarizeAt: 12000, factsEvery: 4,
  imgStyle: "detailed anime illustration, painterly, soft cinematic lighting",
  imgUrl: "https://image.pollinations.ai/prompt/{prompt}?width={w}&height={h}&seed={seed}&nologo=true&model=flux&safe=true&enhance=false",
  portraits: true, backgrounds: true
};
const S = { settings: { ...DEFAULTS }, chars: [], personas: [], books: [], personaId: null, charId: null, chat: null, busy: false, openActs: null, nextSpeaker: "" };
const $ = id => document.getElementById(id);
const byId = id => S.chars.find(c => c.id === id);
const char = () => byId(S.charId);
const members = c => (c?.members || []).map(byId).filter(Boolean);
const persona = () => S.personas.find(p => p.id === S.personaId) || S.personas[0] || { id: "default", name: "User", description: "" };
const uname = () => (persona().name || "").trim() || "User";
const chatKey = (cid, pid = S.personaId) => `chat:${cid}:${pid}`;
const speakerLabel = c => c.kind === "world" ? "Narrator" : c.name;
const isDS = () => S.settings.provider !== "custom";
const hasKey = () => !!(isDS() ? S.settings.apiKey : S.settings.customKey);

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h) % 1000000; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fill = (s, c) => String(s || "").replace(/\{\{char\}\}/gi, c?.name || "").replace(/\{\{user\}\}/gi, uname());
const within = (p, ms = 1500) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);

function fmt(text) {
  let h = String(text).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  h = h.replace(/("[^"\n]+"|“[^”\n]+”)/g, "<span class=q>$1</span>")
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/\*([^*\n]+)\*/g, "<em class=act>$1</em>")
       .replace(/\n/g, "<br>");
  return h;
}

function imgURL(prompt, w, h, seed) {

  return S.settings.imgUrl.replace("{prompt}", encodeURIComponent(p)).replace("{w}", w).replace("{h}", h).replace("{seed}", seed);
}
const ART = {

const artOf = c => (c.artType && c.artType !== "auto" ? c.artType : c.artDetected) || "human";

const cardSig = c => hash([c.kind, c.name, c.appearance, c.description, c.artType || "auto"].join("|"));
async function ensureVisual(c, force) {
  if (!hasKey() || c.customPortrait || c.kind === "group") return false;
  if (!force && (c.visualManual || (c.visual && c.visualSrc === cardSig(c)))) return false;
  let sys;
  if (c.kind === "world") {
    sys = `You turn a world description into a visual description of its most iconic landscape for an image generator. Output 30-60 words of comma-separated details: terrain, architecture, sky, weather, lighting, colors, mood. No people, no text. Safe for work. Respond as JSON: {"form": "world", "description": "..."}`;
  } else {
    const want = c.artType && c.artType !== "auto" ? c.artType : null;
    sys = `You turn a character card into a visual description for an image generator.
First decide the character's form: "human", "anthro" (an anthropomorphic animal person: furry, scalie, etc.), or "feral" (an animal or creature with natural, non-humanoid anatomy).${want ? ` The user says the form is "${want}".` : ""}
Then write 25-50 words of comma-separated visual details for that form:
- human: apparent age (always an adult), gender presentation, skin tone, hair, eyes, face, build, clothing, accessories.
- anthro: species, fur/scale/feather colors and markings, eyes, muzzle or beak, ears, tail, build, clothing, accessories. Always an adult.
- feral: species or creature type, size, coat/scale/feather colors and markings, eyes, distinctive features such as horns, wings or tail.
End with the overall color palette. Only physical appearance, no personality or story. Tasteful and safe for work: no nudity, no sexual content, no gore, no wounds, no exaggerated anatomy. If the card is vague, invent a coherent, appealing design that fits.
Respond as JSON: {"form": "human|anthro|feral", "description": "..."}`;
  }
  const raw = await ds([
    { role: "system", content: sys },
    { role: "user", content: `Name: ${c.name}\nAppearance notes: ${c.appearance || "(none given)"}\nCard:\n${fill(c.description, c).slice(0, 2500)}` }
  ], { temperature: 0.4, maxTokens: 260, json: true, plain: true });
  let j; try { j = JSON.parse(raw); } catch { return false; }
  const out = String(j.description || "").trim();
  if (!out) return false;
  if (c.kind !== "world") c.artDetected = ART[j.form] ? j.form : "human";
  c.visual = out; c.visualSrc = cardSig(c); c.visualManual = false;

}

/* ---------- Model API ---------- */
async function ds(messages, o = {}) {
  const st = S.settings, deep = isDS();
  const key = (deep ? st.apiKey : st.customKey).trim();
  if (!key) throw new Error("Add your API key in Settings first.");
  const think = deep && !!o.thinking;
  const body = { model: o.model || (deep ? st.model : st.customModel), messages, max_tokens: (o.maxTokens || st.maxTokens) + (think ? 4000 : 0), stream: !!o.onDelta };
  const temp = o.temperature ?? st.temperature;
  if (deep) {
    body.thinking = { type: think ? "enabled" : "disabled" };
    if (!think) {
      body.temperature = temp;
      if (!o.plain && st.freqPenalty) body.frequency_penalty = st.freqPenalty;
    } else if (!o.plain && st.topP) body.top_p = st.topP;
  } else {
    body.temperature = temp;
    if (!o.plain) {
      if (st.topP) body.top_p = st.topP;
      if (st.topK) body.top_k = st.topK;
      if (st.repPenalty) body.repetition_penalty = st.repPenalty;
      if (st.freqPenalty) body.frequency_penalty = st.freqPenalty;
    }
  }
  if (o.json) body.response_format = { type: "json_object" };
  const url = deep ? "https://api.deepseek.com/chat/completions" : st.customUrl.replace(/\/+$/, "") + "/chat/completions";
  let r;
  try {
    r = await fetch(url, { method: "POST", signal: o.signal, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key }, body: JSON.stringify(body) });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    throw new Error(`Couldn't reach ${deep ? "DeepSeek" : "the API"}. Check your internet connection and try again.`);
  }
  if (!r.ok) {
    let msg = ""; try { msg = (await r.json()).error?.message || ""; } catch {}
    const known = { 401: "The API key was rejected. Check it in Settings.", 402: "Your API balance is empty. Top up your account.", 429: "You're being rate-limited. Wait a moment and try again.", 503: "The model is overloaded right now. Try again shortly." };
    throw new Error(known[r.status] || `API error ${r.status}${msg ? ": " + msg : ""}`);
  }
  if (!o.onDelta) { const j = await r.json(); return j.choices?.[0]?.message?.content || ""; }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", full = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      const l = line.trim();
      if (!l.startsWith("data:")) continue;
      const d = l.slice(5).trim();
      if (d === "[DONE]") continue;
      try {
        const dl = JSON.parse(d).choices?.[0]?.delta || {};
        if ((dl.reasoning_content || dl.reasoning) && !full) o.onThinking?.();
        if (dl.content) { full += dl.content; o.onDelta(full); }
      } catch {}
    }
  }
  return full;
}

const FOREIGN = /[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Hangul}\p{Script=Cyrillic}\p{Script=Arabic}\p{Script=Thai}\p{Script=Devanagari}]/u;
function garbled(text, c) {
  const words = text.split(/\s+/).filter(Boolean);
  if (words.length < 12) return false;
  const latinChat = !FOREIGN.test((c.description || "") + (c.firstMessage || ""));
  let bad = 0;
  for (const w of words) {
    const core = w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
    if (!core) continue;
    if (core.length > 24) bad++;
    else if (/\p{L}\p{N}\p{L}|\p{N}\p{L}\p{N}/u.test(core)) bad++;
    else if (latinChat && FOREIGN.test(core)) bad++;
    else if (/[^\p{L}\p{N}'’\-.,!?…;:"“”*()—–]/u.test(core)) bad++;
  }
  return bad / words.length > 0.1;
}
function parseTag(raw) {
  const m = raw.match(/\[\[\s*mood\s*:\s*([a-z]+)\s*(?:\|\s*place\s*:\s*([^\]|]*?))?\s*(?:\|\s*focus\s*:\s*([^\]|]*?))?\s*\]\]\s*$/i);
  if (!m) return { text: raw.split("[[")[0].trim(), mood: null, place: null, focus: null };
  const mood = MOODS.includes(m[1].toLowerCase()) ? m[1].toLowerCase() : "neutral";
  return { text: raw.slice(0, m.index).trim(), mood, place: (m[2] || "").trim() || null, focus: (m[3] || "").trim() || null };
}

/* ---------- Prompt building ---------- */
function loreSources(c) {
  const out = [...(c.lore || [])];
  const ids = new Set(c.bookIds || []);
  if (c.kind === "group") for (const m of members(c)) { out.push(...(m.lore || [])); (m.bookIds || []).forEach(b => ids.add(b)); }
  for (const b of S.books) if (ids.has(b.id)) out.push(...(b.entries || []));
  return out;
}
const splitKeys = s => String(s || "").split(",").map(k => k.trim()).filter(Boolean);
function keyHit(text, key, whole, cs) {
  const t = cs ? text : text.toLowerCase(), k = cs ? key : key.toLowerCase();
  if (!whole) return t.includes(k);
  const re = new RegExp(`(^|[^\\p{L}\\p{N}_])${k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?=$|[^\\p{L}\\p{N}_])`, "u");
  return re.test(t);
}
function loreActive(l, recent) {
  if (!l.text || l.enabled === false) return false;
  if (l.constant) return true;
  const hit = k => keyHit(recent, k, !!l.whole, !!l.cs);
  if (!splitKeys(l.keys).some(hit)) return false;
  const sec = splitKeys(l.secondary);
  if (!sec.length) return true;
  const n = sec.filter(hit).length;
  switch (l.logic || 0) {
    case 1: return n < sec.length;   // not all
    case 2: return n === 0;          // none
    case 3: return n === sec.length; // all
    default: return n > 0;           // any
  }
}
function activeLore(c, msgs) {
  const recent = msgs.filter(m => m.role !== "image").slice(-4).map(m => m.content).join("\n");
  return loreSources(c).filter(l => loreActive(l, recent)).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}
// Accepts Janitor / SillyTavern world-info JSON, Tavern character_book, or Lanternroom books
function parseLorebook(raw) {
  let d = typeof raw === "string" ? JSON.parse(raw) : raw;
  if (d && d.app === "lanternroom" && d.book) d = d.book;
  if (d && d.data) d = d.data;
  if (d && d.character_book) d = d.character_book;
  let list = Array.isArray(d) ? d : d && d.entries ? (Array.isArray(d.entries) ? d.entries : Object.values(d.entries)) : null;
  if (!list) throw new Error("No lorebook entries found in that text.");
  const arr = v => Array.isArray(v) ? v.join(", ") : String(v || "");
  const entries = list.map((e, i) => ({
    name: e.name || e.comment || "",
    keys: arr(e.key ?? e.keys ?? e.keysRaw ?? e.keywordsRaw),
    secondary: arr(e.keysecondary ?? e.secondary_keys),
    logic: +(e.selectiveLogic ?? 0) || 0,
    text: String(e.content ?? e.text ?? ""),
    constant: !!e.constant,
    whole: e.matchWholeWords ?? e.match_whole_words ?? e.extensions?.match_whole_words ?? true,
    cs: !!(e.case_sensitive ?? e.caseSensitive ?? e.extensions?.case_sensitive),
    enabled: e.enabled !== false && !e.disable,
    order: +(e.insertion_order ?? e.order ?? (i + 1) * 100)
  })).filter(e => e.text.trim());
  entries.sort((a, b) => a.order - b.order);
  return { name: (d && d.name) || "", entries };
}
function buildPrompt(c, chat, upto) {
  const st = S.settings, u = uname(), p = persona();
  const rules = `Write actions in *asterisks* and speech in quotes. Never write ${u}'s words, thoughts or actions. Keep replies vivid and focused, usually 1-4 paragraphs. Stay consistent with everything established below.`;
  let sys;
  if (c.kind === "world") {
    sys = `You are the narrator and game master of an interactive story set in the world described below. ${u} is the protagonist. Describe what ${u} sees and hears, play every other character they meet (give them names, personalities and distinct voices), and let the world react to ${u}'s choices. ${rules}\n\n# The world: ${c.name}\n${fill(c.description, c)}`;
    if ((c.cast || []).length) sys += `\n\n# Notable characters and groups in this world\n` + c.cast.map(x => `## ${x.name} (${x.type === "group" ? "group or faction" : "character"})\n${fill(x.details, c)}`).join("\n\n");
  } else if (c.kind === "group") {
    const ms = members(c);
    sys = `You voice several characters in a shared scene with ${u}: ${ms.map(m => m.name).join(", ")}. Each turn, write the responses of the characters who would naturally react, usually one to three of them, and let them talk to each other as well as to ${u}. Start each character's part on a new line with their name in bold followed by a colon, like **${ms[0]?.name || "Name"}:** and keep every character true to their own personality and voice. Brief narration without a name is fine. ${rules}`;
    if (c.description) sys += `\n\n# About this group\n${fill(c.description, c)}`;
    sys += ms.map(m => `\n\n# ${m.name} (${ART[artOf(m)].label})\n${fill(m.description, m)}`).join("");
  } else {
    sys = `You are ${c.name} in an ongoing interactive story with ${u}. Stay fully in character. ${rules}\n\n# ${c.name}\n${fill(c.description, c)}`;
  }
  if (c.scenario) sys += `\n\n# Scenario\n${fill(c.scenario, c)}`;
  if (p.description) sys += `\n\n# About ${u} (the user's character)\n${fill(p.description, c)}`;
  if (chat.summary) sys += `\n\n# Story so far\n${chat.summary}`;
  if (chat.facts.length) sys += `\n\n# Established facts (never contradict these)\n` + chat.facts.map(f => "- " + f.t).join("\n");
  const lore = activeLore(c, chat.messages.slice(0, upto));
  if (lore.length) sys += `\n\n# World notes\n` + lore.map(l => fill(l.text, c)).join("\n");
  const focusPart = c.kind === "group" ? " | focus: name of the character who spoke most" : "";
  sys += `\n\nAfter every reply, add one final line in exactly this format, which the app reads and hides:\n[[mood: one of ${MOODS.join("/")} | place: short name of the current location${focusPart}]]`;
  if (c.kind === "group" && S.nextSpeaker) sys += `\n\nThis turn, only ${S.nextSpeaker} responds.`;

  const hist = chat.messages.slice(chat.summarizedUpTo || 0, upto).filter(m => m.role !== "image");
  let budget = st.contextTokens * 3.5 - sys.length;
  const out = [];
  for (let i = hist.length - 1; i >= 0; i--) {
    const m = hist[i];
    let content = m.content;
    if (m.role === "assistant" && m.mood) content += `\n[[mood: ${m.mood} | place: ${m.place || chat.place || "unknown"}${c.kind === "group" && m.focus ? ` | focus: ${m.focus}` : ""}]]`;
    if (budget - content.length < 0 && out.length >= 2) break;
    budget -= content.length;
    out.unshift({ role: m.role, content });
  }
  if (!out.length || out[0].role !== "user") out.unshift({ role: "user", content: "(The scene begins.)" });
  return [{ role: "system", content: sys }, ...out];
}

  const first = fill(c.firstMessage, c).trim();
  const focus = c.kind === "group" ? (members(c)[0]?.name || "") : "";

}

async function openChat(id) {
  S.charId = id; S.nextSpeaker = "";
  const c = char();
  S.chat = (await Store.get(chatKey(id))) || newChat(c);
  S.chat.facts = (S.chat.facts || []).map(f => typeof f === "string" ? { t: f, pin: false } : f);
  await saveChat();
  $("home").hidden = true; $("chat").hidden = false;
  $("chatName").textContent = c.name;
  updateStage(); renderMsgs(); renderSpeakers(); setStatus("");
  const need = c.kind === "group" ? members(c) : [c];
  (async () => {
    let changed = false;
    for (const m of need) { try { if (await ensureVisual(m)) changed = true; } catch {} }
    if (changed) { await saveChars(); if (S.charId === c.id) { updateStage(); renderMsgs(true); } }
  })();
}
function updateStage() {
  const c = char(), ch = S.chat;
  setImg($("avatar"), avatarFor(c, ch), c);
  const chip = c.kind === "world" ? "world" : c.kind === "group" ? `${ch.focus || members(c)[0]?.name || ""} · ${ch.mood || "neutral"}` : (ch.mood || "neutral");
  $("chatPlace").innerHTML = `<span class="mood-chip">${esc(chip)}</span>${esc(ch.place || "")}`;
  const sc = $("scene");
  if (S.settings.backgrounds && ch.place) {
    const url = sceneURL(c, ch.place);
    if (sc.dataset.url !== url) {
      sc.dataset.url = url; sc.classList.remove("on");
      const im = new Image();
      im.onload = () => { if (sc.dataset.url === url) { sc.style.backgroundImage = `url("${url}")`; sc.classList.add("on"); } };
      im.src = url;
    }
  } else { sc.classList.remove("on"); sc.dataset.url = ""; }
}
function renderSpeakers() {
  const c = char(), box = $("speakers");
  if (!c || c.kind !== "group" || !members(c).length) { box.hidden = true; return; }
  box.hidden = false;
  const opts = ["", ...members(c).map(m => m.name)];
  box.innerHTML = opts.map(n => `<button type="button" class="chip ${S.nextSpeaker === n ? "on" : ""}" data-n="${esc(n)}">${n ? esc(n) : "Anyone replies"}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => { S.nextSpeaker = b.dataset.n; renderSpeakers(); });
}
function setStatus(t, err) { const s = $("status"); s.textContent = t || ""; s.className = err ? "err" : ""; s.style.padding = t ? "" : "0"; }

function splitSpeakers(text) {
  const re = /(^|\n)[ \t]*\*\*([^*\n]{1,40}?)(?::\*\*|\*\*:)[ \t]*/g;
  const segs = []; let last = 0, cur = null, m;
  while ((m = re.exec(text))) {
    const before = text.slice(last, m.index).trim();
    if (before) segs.push({ who: cur, text: before });
    cur = m[2].trim(); last = re.lastIndex;
  }
  const rest = text.slice(last).trim();
  if (rest) segs.push({ who: cur, text: rest });
  return segs.length ? segs : [{ who: null, text }];
}

function renderMsgs(keepScroll) {
  const box = $("msgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const c = char();
  box.innerHTML = "";
  const msgs = S.chat.messages;
  const lastAsst = msgs.map(m => m.role).lastIndexOf("assistant");
  msgs.forEach((m, i) => {
    let d = document.createElement("div");
    d.dataset.i = i;
    let tail = d;
    if (m.role === "image") {
      d.className = "msg img";
      d.innerHTML = `<img alt="Illustration: ${esc(m.prompt || "")}" loading="lazy"><div class="cap">Illustration · tap for options</div>`;
      const im = d.querySelector("img"); im.src = m.url;
      im.onerror = () => { d.querySelector(".cap").textContent = "The image failed to load. Tap and choose Redraw."; };
    } else if (m.role === "assistant" && c.kind === "group") {
      d.className = "msg-set";
      for (const seg of splitSpeakers(m.content)) {
        const b = document.createElement("div"); b.className = "msg assistant";
        if (seg.who) {
          const mm = memberByName(c, seg.who);
          b.innerHTML = `<div class="spk"><img alt=""><span>${esc(mm?.name || seg.who)}</span></div>`;
          setImg(b.querySelector("img"), mm ? portraitURL(mm, m.focus && mm.name === m.focus ? m.mood : "neutral") : "", mm || { name: seg.who });
        }
        b.insertAdjacentHTML("beforeend", fmt(seg.text));
        d.appendChild(b); tail = b;
      }
    } else {
      d.className = "msg " + m.role;
      d.innerHTML = fmt(m.content);
    }
    if (m.role === "assistant" && i === lastAsst && (m.alts?.length > 1 || i === msgs.length - 1)) {
      const sw = document.createElement("div"); sw.className = "swipe";
      const n = m.alts?.length || 1, a = (m.alt || 0) + 1;
      sw.innerHTML = `<button data-act="prev" ${a <= 1 ? "disabled" : ""} aria-label="Previous version">‹</button><span>${a}/${n}</span><button data-act="next" aria-label="${a < n ? "Next version" : "New version"}">${a < n ? "›" : "↻"}</button>`;
      tail.appendChild(sw);
    }
    if (S.openActs === m.id) {
      const acts = document.createElement("div"); acts.className = "acts";
      const btns = [];
      if (m.role !== "image") btns.push(["edit", "Edit"]);
      if (m.role === "image") btns.push(["redraw", "Redraw"]);
      btns.push(["del", "Delete"]);
      if (m.role === "assistant" && i === lastAsst) btns.push(["reroll", "New version"]);
      acts.innerHTML = btns.map(([a, l]) => `<button type="button" class="btn small ${a === "del" ? "danger" : ""}" data-act="${a}">${l}</button>`).join("");
      tail.appendChild(acts);
    }
    box.appendChild(d);
  });
  if (!keepScroll || atBottom) box.scrollTop = box.scrollHeight;
}

$("msgs").addEventListener("click", async e => {
  const d = e.target.closest("[data-i]"); if (!d) return;
  const i = +d.dataset.i, m = S.chat.messages[i];
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) { S.openActs = S.openActs === m.id ? null : m.id; renderMsgs(true); return; }
  if (S.busy) return;
  if (act === "prev") { m.alt = Math.max(0, m.alt - 1); applyAlt(m); }
  else if (act === "next") { if (m.alt < m.alts.length - 1) { m.alt++; applyAlt(m); } else reroll(i); }
  else if (act === "reroll") reroll(i);
  else if (act === "del") {
    S.chat.messages.splice(i, 1);
    if (i < S.chat.summarizedUpTo) S.chat.summarizedUpTo--;
    S.openActs = null; await saveChat(); renderMsgs(true);
  }
  else if (act === "edit") editMessage(i);
  else if (act === "redraw") { m.url = imgURL(m.full || m.prompt, 768, 512, Math.floor(Math.random() * 1e6)); await saveChat(); renderMsgs(true); }
});
async function applyAlt(m) { m.content = m.alts[m.alt]; if (m.altMeta?.[m.alt]) Object.assign(m, m.altMeta[m.alt]); await saveChat(); renderMsgs(true); }

$("composer").addEventListener("submit", e => { e.preventDefault(); send(); });
$("send").addEventListener("click", e => { e.preventDefault(); send(); });
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); send(); } });
function autoGrow() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
function setBusy(b) { S.busy = b; $("send").disabled = b; $("btnIllustrate").disabled = b; }

async function send() {
  try { await sendInner(); } catch (e) { setBusy(false); setStatus("Something went wrong: " + e.message, true); }
}
async function sendInner() {
  if (S.busy) return;
  const t = $("input").value.trim();
  if (t) { S.chat.messages.push({ id: uid(), role: "user", content: t }); $("input").value = ""; autoGrow(); }
  else if (!S.chat.messages.length || S.chat.messages.at(-1).role === "assistant") return;
  S.openActs = null;
  await saveChat(); renderMsgs();
  await generate(S.chat.messages.length, null);
}
async function reroll(i) { S.openActs = null; await generate(i, S.chat.messages[i]); }
async function generate(upto, existing) {
  const c = char(), chat = S.chat;
  setBusy(true); setStatus("");
  let bubble;
  if (existing) bubble = $("msgs").querySelector(`[data-i="${upto}"]`);
  else { bubble = document.createElement("div"); bubble.className = "msg assistant typing"; $("msgs").appendChild(bubble); }
  if (bubble.classList.contains("msg-set")) { bubble.className = "msg assistant"; }
  const who = c.kind === "world" ? "The narrator" : c.kind === "group" ? (S.nextSpeaker || "The group") : c.name;
  bubble.innerHTML = `${esc(who)} is writing…`; bubble.classList.add("typing");
  const box = $("msgs"); box.scrollTop = box.scrollHeight;
  try {
    let p;
    for (let attempt = 0; attempt < 2; attempt++) {
      const raw = await ds(buildPrompt(c, chat, upto), {
        thinking: S.settings.thinking,
        temperature: attempt ? Math.min(S.settings.temperature, 0.7) : undefined,
        onThinking: () => { bubble.innerHTML = `${esc(who)} is thinking…`; },
        onDelta: full => { bubble.classList.remove("typing"); bubble.innerHTML = fmt(full.split("[[")[0]); if (box.scrollHeight - box.scrollTop - box.clientHeight < 140) box.scrollTop = box.scrollHeight; }
      });
      p = parseTag(raw);
      if (!garbled(p.text, c)) break;
      if (attempt === 0) { bubble.classList.add("typing"); bubble.innerHTML = "That reply came out garbled. Trying again more carefully…"; }
      else setStatus("This reply may still be garbled. Tap ↻ for a new version, or lower Temperature in Settings.", true);
    }
    if (!p.text) throw new Error("The model sent an empty reply. Tap ↻ to try again.");
    const meta = { mood: p.mood || chat.mood || "neutral", place: p.place || chat.place, focus: c.kind === "group" ? (memberByName(c, p.focus)?.name || chat.focus || "") : "" };
    if (existing) {
      existing.alts = existing.alts || [existing.content];
      existing.altMeta = existing.altMeta || [];
      existing.alts.push(p.text); existing.alt = existing.alts.length - 1;
      existing.altMeta[existing.alt] = meta;
      existing.content = p.text; Object.assign(existing, meta);
    } else {
      chat.messages.push({ id: uid(), role: "assistant", content: p.text, alts: [p.text], alt: 0, altMeta: [meta], ...meta });
    }
    chat.mood = meta.mood; if (p.place) chat.place = p.place; if (meta.focus) chat.focus = meta.focus;
    S.nextSpeaker = ""; renderSpeakers();
    await saveChat();
    renderMsgs(); updateStage();
    if (!existing) maintainMemory(c, chat).catch(e => setStatus("Memory update skipped: " + e.message, true));
  } catch (e) {
    if (!existing) bubble.remove(); else renderMsgs(true);
    setStatus(e.message, true);
  } finally { setBusy(false); }
}

/* ---------- Memory ---------- */
async function maintainMemory(c, chat) {
  const st = S.settings;
  const start = chat.summarizedUpTo || 0, end = chat.messages.length - st.keepRecent;
  if (end > start) {
    const chunk = chat.messages.slice(start, end).filter(m => m.role !== "image");
    const size = chunk.reduce((a, m) => a + m.content.length, 0);
    if (size > st.summarizeAt) { setStatus("Saving older events to memory…"); await summarize(c, chat, chunk, end); }
  }
  chat.turnsSinceFacts = (chat.turnsSinceFacts || 0) + 1;
  if (chat.turnsSinceFacts >= st.factsEvery) { setStatus("Updating remembered facts…"); await updateFacts(c, chat); }
  if (S.chat === chat) setStatus("");
}
async function summarize(c, chat, chunk, end) {
  const u = uname();
  const txt = chunk.map(m => `${m.role === "user" ? u : speakerLabel(c)}: ${m.content}`).join("\n\n");
  const sum = await ds([
    { role: "system", content: "You keep the running summary of a long roleplay story. Merge the existing summary and the new events into ONE updated summary in past tense, third person. Preserve names, relationships and how they changed, promises, secrets, injuries, items, decisions, and unresolved threads. Drop filler. Up to 450 words. Output only the summary." },
    { role: "user", content: `Story: ${c.name}. Protagonist: ${u}.\n\nExisting summary:\n${chat.summary || "(none yet)"}\n\nNew events:\n${txt}` }
  ], { temperature: 0.3, maxTokens: 1000, plain: true });
  if (sum.trim()) { chat.summary = sum.trim(); chat.summarizedUpTo = end; await saveChat(); }
}
async function updateFacts(c, chat) {
  const u = uname();
  chat.turnsSinceFacts = 0;
  const recent = chat.messages.filter(m => m.role !== "image").slice(-14).map(m => `${m.role === "user" ? u : speakerLabel(c)}: ${m.content}`).join("\n\n");
  const pinned = chat.facts.filter(f => f.pin), loose = chat.facts.filter(f => !f.pin);
  const out = await ds([
    { role: "system", content: `You maintain a list of durable facts for continuity in a roleplay (${c.name}) with ${u}. Update the list using the recent conversation: add new important facts, correct facts that changed, merge duplicates, remove facts no longer true. Keep only what matters later: names, relationships and feelings, decisions, promises, secrets revealed, possessions, injuries, appearance changes, places, time of day/date. Each fact under 20 words. At most 30 facts. Do not repeat the pinned facts. Respond as JSON: {"facts": ["...", "..."]}` },
    { role: "user", content: `Pinned facts (keep, don't repeat):\n${pinned.map(f => "- " + f.t).join("\n") || "(none)"}\n\nCurrent facts:\n${loose.map(f => "- " + f.t).join("\n") || "(none)"}\n\nRecent conversation:\n${recent}` }
  ], { temperature: 0.2, maxTokens: 1200, json: true, plain: true });
  let list; try { list = JSON.parse(out).facts; } catch { return; }
  if (Array.isArray(list)) {
    chat.facts = [...pinned, ...list.filter(x => typeof x === "string" && x.trim()).slice(0, 30).map(t => ({ t: t.trim(), pin: false }))];
    await saveChat();
  }
}

/* ---------- Illustrate ---------- */
async function illustrate() {
  if (S.busy) return;
  const c = char(), chat = S.chat, u = uname();
  setBusy(true); setStatus("Picturing the scene…");
  try {
    const recent = chat.messages.filter(m => m.role !== "image").slice(-6).map(m => `${m.role === "user" ? u : speakerLabel(c)}: ${m.content}`).join("\n\n");
    const who = c.kind === "group" ? members(c).map(m => `${m.name} is ${ART[artOf(m)].word} and looks like: ${looks(m)}`).join("\n")
      : c.kind === "world" ? `Setting: ${looks(c)}`
      : `${c.name} is ${ART[artOf(c)].word} and looks like: ${looks(c)}`;
    const p = persona();
    const prompt = (await ds([
      { role: "system", content: "Write ONE prompt for an image generator showing the current moment of this story. Keep it safe for work: no nudity, no sexual content, no gore. Draw each character in their stated form (human, anthro, or feral). 40-70 words of comma-separated visual details: who is in frame and what they look like, pose, expression, action, setting, lighting, camera framing. No names, no dialogue, no quotation marks. Output only the prompt." },
      { role: "user", content: `${who}\n${p.description ? u + ": " + p.description.slice(0, 300) + "\n" : ""}Current location: ${chat.place || "unknown"}\n\nRecent story:\n${recent}` }
    ], { temperature: 0.7, maxTokens: 200, plain: true })).trim().replace(/^["']|["']$/g, "");
    const full = `${S.settings.imgStyle}, ${prompt}`;
    chat.messages.push({ id: uid(), role: "image", prompt, full, url: imgURL(full, 768, 512, Math.floor(Math.random() * 1e6)) });
    await saveChat(); renderMsgs(); setStatus("Drawing… images can take 10-30 seconds.");
    setTimeout(() => { if ($("status").textContent.startsWith("Drawing")) setStatus(""); }, 12000);
  } catch (e) { setStatus(e.message, true); }
  finally { setBusy(false); }
}
$("btnIllustrate").onclick = illustrate;

/* ---------- Expand & Split helpers ---------- */
const EXPAND = {
  appearance: ["the character's physical appearance: build, face, coloring, hair or fur, clothing, distinctive features", "60-120"],
  personality: ["the character's personality and background: temperament, history, motivations, fears, quirks, speech style, relationships", "180-350"],
  scenario: ["the opening scenario: where and when the story starts, the situation, and what is at stake", "90-200"],
  first: ["the opening message of the roleplay, written in the story's voice with *actions* in asterisks and dialogue in quotes, setting the scene and ending on a hook the user can respond to", "120-250"],
  world: ["the world or setting: geography, history, cultures, factions, technology or magic, daily life, tone and themes", "250-450"],
  groupdesc: ["how this group of characters fits together: how they know each other, their dynamics, shared history and tensions", "120-250"],
  lore: ["a lorebook entry: a self-contained reference note the AI consults when its keywords come up", "60-150"],
  cast: ["one notable character or faction in this world: who they are, appearance, personality, role and goals", "80-180"],
  persona: ["the user's own character (persona): name-appropriate appearance, personality and background", "100-220"]
};
async function expandText(kind, draft, ctx) {
  const [what, len] = EXPAND[kind] || ["this text", "100-250"];
  const out = await ds([
    { role: "system", content: `You help write cards for an interactive fiction app. Expand the user's draft of ${what}. Keep every detail and the intent of what they wrote and never contradict it. Add specific, vivid, consistent detail that fills the gaps, matching their tone and point of view. Aim for about ${len} words. If the draft is empty, write it from scratch using the context. Output only the finished text: no headings, no commentary, no quotation marks around it.` },
    { role: "user", content: `Context:\n${ctx || "(none)"}\n\nDraft:\n${draft || "(empty)"}` }
  ], { temperature: 0.9, maxTokens: 900, plain: true });
  return out.trim();
}
function wireExpand(root, ctxFn) {
  root.querySelectorAll("textarea[data-x]:not([data-wired])").forEach(ta => {
    ta.dataset.wired = "1";
    let row = ta.nextElementSibling;
    if (!row || !row.classList.contains("xrow")) { row = document.createElement("div"); row.className = "xrow"; ta.after(row); }
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "xbtn"; btn.textContent = "✦ Expand";
    row.appendChild(btn);
    let undo = null;
    ta.addEventListener("input", () => { if (undo !== null) { undo = null; btn.textContent = "✦ Expand"; } });
    btn.onclick = async () => {
      if (undo !== null) { const u = undo; ta.value = u; ta.dispatchEvent(new Event("input")); return; }
      if (!hasKey()) { btn.textContent = "Add your API key in Settings first"; return; }
      btn.disabled = true; btn.textContent = "Expanding…";
      try {
        const prev = ta.value;
        const out = await expandText(ta.dataset.x, prev, ctxFn ? ctxFn() : "");
        if (out) { ta.value = out; ta.dispatchEvent(new Event("input")); undo = prev; btn.textContent = "↶ Undo expand"; }
        else btn.textContent = "✦ Expand";
      } catch (e) { btn.textContent = e.message; setTimeout(() => { btn.textContent = "✦ Expand"; }, 4000); }
      finally { btn.disabled = false; }
    };
  });
}
function cardContext(w) {
  const parts = [`Type: ${KINDS[w.kind || "character"].label}`, `Name: ${w.name || "(unnamed)"}`];
  if (w.kind === "character") parts.push(`Form: ${ART[artOf(w)].label}`);
  if (w.appearance) parts.push(`Appearance: ${w.appearance.slice(0, 800)}`);
  if (w.description) parts.push(`Description: ${w.description.slice(0, 1500)}`);
  if (w.scenario) parts.push(`Scenario: ${w.scenario.slice(0, 800)}`);
  if (w.kind === "group") parts.push("Members:\n" + (w.members || []).map(byId).filter(Boolean).map(m => `- ${m.name}: ${(m.description || "").slice(0, 300)}`).join("\n"));
  if (w.kind === "world" && (w.cast || []).length) parts.push("Cast: " + w.cast.map(x => x.name).join(", "));
  parts.push(`User's persona: ${uname()}${persona().description ? " — " + persona().description.slice(0, 300) : ""}`);
  return parts.join("\n");
}
async function splitListings(text, kind, w) {
  const forGroup = kind === "group";
  const out = await ds([
    { role: "system", content: `You organize text for an interactive fiction app. The user pasted text for a ${forGroup ? "group of characters" : "world/setting"} that mixes several ${forGroup ? "characters" : "characters and groups/factions"} together. Pull each distinct ${forGroup ? "character" : "named character or group/faction"} out into its own listing. Keep all of the user's details, moved into the right listing, with no invented facts. Put whatever is not about one specific ${forGroup ? "character" : "character or group"} (the shared setup, relationships, setting) into "remaining".
Respond as JSON: {"remaining": "...", "entries": [{"name": "...", ${forGroup ? '"appearance": "physical description only, if given", "details": "personality, background and everything else about them"' : '"type": "character" or "group", "details": "everything about them"'}}]}
If there is only one or zero ${forGroup ? "characters" : "characters or groups"}, still return the JSON with what you found.` },
    { role: "user", content: `${forGroup ? "Group" : "World"} name: ${w.name || "(unnamed)"}\n\nText:\n${text}` }
  ], { temperature: 0.2, maxTokens: 4000, json: true, plain: true });
  const j = JSON.parse(out);
  return { remaining: String(j.remaining || "").trim(), entries: (Array.isArray(j.entries) ? j.entries : []).filter(e => e && e.name) };
}

/* ---------- Lore editor (shared by characters and lorebooks) ---------- */
function loreEditor(box, arr, ctxFn) {
  const draw = () => {
    box.innerHTML = arr.length ? "" : '<p class="note">No entries yet.</p>';
    arr.forEach((l, i) => {
      const d = document.createElement("div"); d.className = "lore";
      d.innerHTML = `${l.name ? `<div class="lbl">${esc(l.name)}</div>` : ""}<input placeholder="Keywords, comma separated" value="${esc(l.keys)}" data-k="keys"><input placeholder="Only if one of these is also mentioned (optional)" value="${esc(l.secondary || "")}" data-k="secondary"><textarea data-x="lore" placeholder="What the AI should know when these come up" data-k="text">${esc(l.text)}</textarea><label class="check" style="font-size:14px"><input type="checkbox" data-c="constant" ${l.constant ? "checked" : ""}> Always on (ignore keywords)</label><label class="check" style="font-size:14px"><input type="checkbox" data-c="enabled" ${l.enabled !== false ? "checked" : ""}> Enabled</label><div class="xrow"><button class="btn small danger" type="button" data-rm>Remove</button></div>`;
      d.querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => { l[el.dataset.k] = el.value; }));
      d.querySelectorAll("[data-c]").forEach(el => el.addEventListener("change", () => { l[el.dataset.c] = el.checked; }));
      d.querySelector("[data-rm]").onclick = () => { arr.splice(i, 1); draw(); };
      box.appendChild(d);
      wireExpand(d, () => (ctxFn ? ctxFn() : "") + `\nKeywords for this entry: ${l.keys}`);
    });
  };
  draw();
  return draw;
}

/* ---------- Settings ---------- */
function rangeRow(id, label, desc, min, max, step, val, fmtv, tag) {
  return `<div class="range-row"><div class="top"><b>${label}${tag ? `<span class="tag">${tag}</span>` : ""}</b><span class="val" id="${id}V">${fmtv(val)}</span></div><div class="desc">${desc}</div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
const fmtK = v => v >= 1000 ? (Math.round(v / 100) / 10) + "k" : String(v);
$("btnSettings").onclick = () => openSheet("Settings", b => {
  const st = S.settings;
  const drawn = () => {
    const deep = $("sProv").value !== "custom";
    const think = deep && $("sThink").checked;
    const tags = {
      sTemp: think ? "ignored while thinking" : "",
      sTopK: deep ? "not used by DeepSeek" : "",
      sTopP: deep ? (think ? "" : "DeepSeek uses it only while thinking") : "",
      sRep: deep ? "not used by DeepSeek" : "",

        ${rangeRow("sRep", "Repetition Penalty", "Prevents saying the same thing twice. Higher = less repeating.", 0, 2, 0.01, st.repPenalty, v => (+v).toFixed(2))}

      ${field("Image service URL", `<input id="sImg" value="${esc(st.imgUrl)}">`, "Uses Pollinations (free, no key). Advanced: any service that takes {prompt}, {w}, {h}, {seed} in the URL.")}
    </div>
    <div class="group"><h3>Memory</h3>
      <div class="row">
        ${field("Recent messages kept word-for-word", `<input id="sKeep" type="number" min="4" max="80" value="${st.keepRecent}">`)}
        ${field("Update facts every N replies", `<input id="sFacts" type="number" min="1" max="20" value="${st.factsEvery}">`)}
      </div>
      ${field("Summarize when older text exceeds (characters)", `<input id="sSum" type="number" min="2000" step="1000" value="${st.summarizeAt}">`)}
    </div>
    <button class="btn primary" id="sSave">Save settings</button>
    <button class="btn" id="sReset">Reset model settings to defaults</button>

      <div id="sMsg" class="hint"></div>
    </div>`;
  const fmts = { sTemp: v => (+v).toFixed(2), sMax: fmtK, sCtx: fmtK, sTopK: v => String(+v), sTopP: v => (+v).toFixed(2), sRep: v => (+v).toFixed(2), sFreq: v => (+v).toFixed(2) };
  for (const id of Object.keys(fmts)) $(id).addEventListener("input", () => { $(id + "V").textContent = fmts[id]($(id).value); drawn(); });
  $("sProv").onchange = drawn; $("sThink").onchange = drawn;
  drawn();
  $("sPersonas").onclick = () => openPersonas();
  $("sReset").onclick = () => {
    const d = DEFAULTS, map = { sTemp: d.temperature, sMax: d.maxTokens, sCtx: d.contextTokens, sTopK: d.topK, sTopP: d.topP, sRep: d.repPenalty, sFreq: d.freqPenalty };
    for (const [id, v] of Object.entries(map)) { $(id).value = v; $(id + "V").textContent = fmts[id](v); }
    drawn(); $("sReset").textContent = "Defaults loaded. Tap Save settings to keep them.";
  };
  $("sSave").onclick = async () => {
    const n = (id, d) => { const v = parseFloat($(id).value); return isFinite(v) ? v : d; };
    Object.assign(st, {
      provider: $("sProv").value,
      apiKey: $("sKey").value.trim(), model: $("sModel").value.trim() || DEFAULTS.model, thinking: $("sThink").checked,
      customUrl: $("sCUrl").value.trim() || DEFAULTS.customUrl, customKey: $("sCKey").value.trim(), customModel: $("sCModel").value.trim() || DEFAULTS.customModel,
      temperature: n("sTemp", DEFAULTS.temperature), maxTokens: n("sMax", DEFAULTS.maxTokens), contextTokens: n("sCtx", DEFAULTS.contextTokens),
      topK: n("sTopK", 0), topP: n("sTopP", 0), repPenalty: n("sRep", 0), freqPenalty: n("sFreq", 0),
      portraits: $("sPort").checked, backgrounds: $("sBg").checked,
      imgStyle: $("sStyle").value.trim() || DEFAULTS.imgStyle, imgUrl: $("sImg").value.trim() || DEFAULTS.imgUrl,
      keepRecent: n("sKeep", 16), factsEvery: n("sFacts", 4), summarizeAt: n("sSum", 12000)
    });
    await saveSettings(); closeSheet();
    if (!$("chat").hidden) updateStage(); else renderHome();
  };
  $("sExport").onclick = async () => {
    const data = { app: "lanternroom", v: 2, settings: { ...st, apiKey: "", customKey: "" }, chars: S.chars, personas: S.personas, books: S.books, chats: {} };
    for (const k of await Store.keys()) if (k.startsWith("chat:")) data.chats[k] = await Store.get(k);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    a.download = `lanternroom-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    $("sMsg").textContent = "Backup saved (your API keys are left out).";
  };
  $("sImport").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== "lanternroom") throw new Error();
      const merge = (list, incoming) => { for (const x of incoming || []) { const i = list.findIndex(y => y.id === x.id); if (i < 0) list.push(x); else list[i] = x; } };
      merge(S.chars, d.chars); merge(S.personas, d.personas); merge(S.books, d.books);
      for (const [k, v] of Object.entries(d.chats || {})) {
        if (!v) continue;
        await Store.set(k.startsWith("chat:") ? k : `chat:${k}:${S.personas[0].id}`, v);
      }
      await saveChars(); await savePersonas(); await saveBooks();
      $("sMsg").textContent = `Restored ${(d.chars || []).length} character(s).`; renderHome();
    } catch { $("sMsg").textContent = "That file isn't a Lanternroom backup."; }
  };
});

/* ---------- Personas ---------- */
function openPersonas() {
  openSheet("Personas", b => {
    b.innerHTML = `<p class="note">A persona is who you play. Every character, world and group keeps a separate chat for each persona.</p><div class="stack" id="pList"></div><button class="btn primary" id="pNew">New persona</button>`;
    for (const p of S.personas) {
      const row = document.createElement("div"); row.className = "listrow" + (p.id === S.personaId ? " on" : "");
      row.innerHTML = `<div class="grow"><div><b>${esc(p.name || "Unnamed")}</b>${p.id === S.personaId ? '<span class="badge">Active</span>' : ""}</div><div class="sub">${esc((p.description || "No description").slice(0, 90))}</div></div>${p.id === S.personaId ? "" : '<button class="btn small" data-use>Use</button>'}<button class="btn small" data-edit>Edit</button>`;
      row.querySelector("[data-use]")?.addEventListener("click", () => usePersona(p.id));
      row.querySelector("[data-edit]").onclick = () => editPersona(p, false);
      $("pList").appendChild(row);
    }
    $("pNew").onclick = () => editPersona({ id: uid(), name: "", description: "" }, true);
  });
}
async function usePersona(id) {
  S.personaId = id; await savePersonas(); closeSheet();
  if (!$("chat").hidden && S.charId) await openChat(S.charId); else renderHome();
}
function editPersona(p, isNew) {
  const work = { ...p };
  openSheet(isNew ? "New persona" : "Edit persona", b => {
    b.innerHTML = `
      ${field("Name", `<input id="peName" value="${esc(work.name)}" placeholder="Who you play">`)}
      ${field("Description", `<textarea id="peDesc" data-x="persona" style="min-height:140px" placeholder="Appearance, personality, background">${esc(work.description)}</textarea>`, "Characters see this, and it's used when illustrating scenes.")}
      <button class="btn primary" id="peSave">${isNew ? "Create and use" : "Save"}</button>
      ${!isNew && S.personas.length > 1 ? '<button class="btn danger" id="peDel">Delete persona</button>' : ""}`;
    wireExpand(b, () => `Persona name: ${$("peName").value}`);
    $("peSave").onclick = async () => {
      work.name = $("peName").value.trim(); work.description = $("peDesc").value.trim();
      if (!work.name) { $("peName").focus(); $("peName").placeholder = "A name is required"; return; }
      const i = S.personas.findIndex(x => x.id === work.id);
      if (i < 0) S.personas.push(work); else S.personas[i] = work;
      if (isNew) S.personaId = work.id;
      await savePersonas();
      if (isNew && !$("chat").hidden && S.charId) { closeSheet(); await openChat(S.charId); } else { renderHome(); openPersonas(); }
    };
    if ($("peDel")) confirmBtn($("peDel"), "Tap again: deletes this persona and its chats", async () => {
      S.personas = S.personas.filter(x => x.id !== work.id);
      for (const k of await Store.keys()) if (k.startsWith("chat:") && k.endsWith(":" + work.id)) await Store.del(k);
      if (S.personaId === work.id) S.personaId = S.personas[0].id;
      await savePersonas();
      if (!$("chat").hidden && S.charId) { closeSheet(); await openChat(S.charId); } else { renderHome(); openPersonas(); }
    });
  });
}

/* ---------- Lorebooks ---------- */
function openBooks() {
  openSheet("Lorebooks", b => {
    b.innerHTML = `<p class="note">A lorebook is a set of entries you can attach to as many characters, worlds and groups as you like. Entries load only when their keywords come up.</p><div class="stack" id="bList"></div><button class="btn primary" id="bNew">New lorebook</button><button class="btn" id="bImport">Import lorebook (Janitor / SillyTavern)</button>`;
    if (!S.books.length) $("bList").innerHTML = '<p class="note">No lorebooks yet.</p>';
    for (const bk of S.books) {
      const used = S.chars.filter(c => (c.bookIds || []).includes(bk.id)).length;
      const row = document.createElement("button"); row.className = "listrow";
      row.innerHTML = `<div class="grow"><b>${esc(bk.name)}</b><div class="sub">${bk.entries.length} entr${bk.entries.length === 1 ? "y" : "ies"} · used by ${used}</div></div><span class="badge">Edit</span>`;
      row.onclick = () => editBook(bk, false);
      $("bList").appendChild(row);
    }
    $("bNew").onclick = () => editBook({ id: uid(), name: "", entries: [] }, true);
    $("bImport").onclick = importBook;
  });
}
function importBook() {
  openSheet("Import lorebook", b => {
    b.innerHTML = `
      <p class="note">Paste a lorebook exported from Janitor AI or SillyTavern (the text starting with [ or {), or choose the file. Always-on entries, secondary keywords, whole-word matching and entry order carry over.</p>
      ${field("Name", `<input id="ibName" placeholder="e.g. Vore">`)}
      ${field("Lorebook JSON", `<textarea id="ibText" style="min-height:200px;font-family:ui-monospace,monospace;font-size:13px" placeholder="[ { &quot;key&quot;: [...], &quot;content&quot;: &quot;...&quot; } ]"></textarea>`)}
      <div class="row"><label class="btn" for="ibFile">Choose file instead</label></div>
      <input type="file" id="ibFile" accept=".json,application/json,text/plain" hidden>
      <div id="ibMsg" class="hint"></div>
      <button class="btn primary" id="ibGo">Import</button>`;
    $("ibFile").onchange = async e => { const f = e.target.files[0]; if (f) { $("ibText").value = await f.text(); if (!$("ibName").value) $("ibName").value = f.name.replace(/\.json$/i, ""); } };
    $("ibGo").onclick = () => {
      try {
        const r = parseLorebook($("ibText").value.trim());
        if (!r.entries.length) throw new Error("That lorebook has no entries with text.");
        const bk = { id: uid(), name: $("ibName").value.trim() || r.name || "Imported lorebook", entries: r.entries };
        editBook(bk, true);
        $("sheetBody").insertAdjacentHTML("afterbegin", `<p class="note">Read ${r.entries.length} entries (${r.entries.filter(e => e.constant).length} always on). Tick who should use it, then tap Create lorebook.</p>`);
      } catch (e) { $("ibMsg").textContent = e instanceof SyntaxError ? "That isn't valid JSON. Make sure you copied all of it, from the first [ to the last ]." : e.message; }
    };
  });
}
function editBook(bk, isNew, preset) {
  const work = JSON.parse(JSON.stringify(bk));
  const chosen = new Set(preset || S.chars.filter(c => (c.bookIds || []).includes(bk.id)).map(c => c.id));
  openSheet(isNew ? "New lorebook" : "Edit lorebook", b => {
    b.innerHTML = `
      ${field("Name", `<input id="bkName" value="${esc(work.name)}" placeholder="e.g. The Sallow Coast">`)}
      <div class="group"><h3>Entries</h3><div id="bkLore" class="stack"></div><button class="btn" id="bkAdd">Add entry</button></div>
      <div class="group"><h3>Use with</h3>
        <div class="row"><button class="btn small" id="bkAll">Select all</button><button class="btn small" id="bkNone">Select none</button></div>
        <div class="stack" id="bkUse"></div>
      </div>
      <button class="btn primary" id="bkSave">${isNew ? "Create lorebook" : "Save lorebook"}</button>
      ${isNew ? "" : '<button class="btn danger" id="bkDel">Delete lorebook</button>'}`;
    const redraw = loreEditor($("bkLore"), work.entries, () => `Lorebook: ${$("bkName").value}`);
    $("bkAdd").onclick = () => { work.entries.push({ keys: "", text: "" }); redraw(); };
    const drawUse = () => {
      const box = $("bkUse"); box.innerHTML = S.chars.length ? "" : '<p class="note">Create a character first.</p>';
      for (const c of S.chars) {
        const l = document.createElement("label"); l.className = "checkrow";
        l.innerHTML = `<input type="checkbox" ${chosen.has(c.id) ? "checked" : ""}><img alt=""><span>${esc(c.name)}${c.kind !== "character" ? ` <span class="badge">${KINDS[c.kind].label}</span>` : ""}</span>`;
        setImg(l.querySelector("img"), thumbURL(c), c);
        l.querySelector("input").onchange = e => { e.target.checked ? chosen.add(c.id) : chosen.delete(c.id); };
        box.appendChild(l);
      }
    };
    drawUse();
    $("bkAll").onclick = () => { S.chars.forEach(c => chosen.add(c.id)); drawUse(); };
    $("bkNone").onclick = () => { chosen.clear(); drawUse(); };
    $("bkSave").onclick = async () => {
      work.name = $("bkName").value.trim();
      if (!work.name) { $("bkName").focus(); $("bkName").placeholder = "A name is required"; return; }
      work.entries = work.entries.filter(e => e.text.trim());
      const i = S.books.findIndex(x => x.id === work.id);
      if (i < 0) S.books.push(work); else S.books[i] = work;
      for (const c of S.chars) {
        c.bookIds = (c.bookIds || []).filter(id => id !== work.id);
        if (chosen.has(c.id)) c.bookIds.push(work.id);
      }
      await saveBooks(); await saveChars();
      openBooks();
    };
    if ($("bkDel")) confirmBtn($("bkDel"), "Tap again to delete this lorebook", async () => {
      S.books = S.books.filter(x => x.id !== work.id);
      for (const c of S.chars) c.bookIds = (c.bookIds || []).filter(id => id !== work.id);
      await saveBooks(); await saveChars(); openBooks();
    });
  });
}

      ${field("Scenario", `<textarea id="cScen" data-x="scenario">${esc(work.scenario)}</textarea>${splitRow}`)}
      ${field("First message", `<textarea id="cFirst" data-x="first" style="min-height:120px" placeholder="Optional. Use **Name:** at the start of each character's part.">${esc(work.firstMessage)}</textarea>`)}`;
