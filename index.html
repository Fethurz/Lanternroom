    const redrawLore = loreEditor($("cLore"), work.lore, ctx);
    $("cAddLore").onclick = () => { work.lore.push({ keys: "", text: "" }); redrawLore(); };
    const drawBooks = () => {
      const box = $("cBooks");
      box.innerHTML = S.books.length ? "" : '<p class="note">No shared lorebooks yet. Create them from Lorebooks on the home screen.</p>';
      for (const bk of S.books) {
        const l = document.createElement("label"); l.className = "checkrow";
        l.innerHTML = `<input type="checkbox" ${work.bookIds.includes(bk.id) ? "checked" : ""}><span>${esc(bk.name)} · ${bk.entries.length} entr${bk.entries.length === 1 ? "y" : "ies"}</span>`;
        l.querySelector("input").onchange = e => { work.bookIds = work.bookIds.filter(x => x !== bk.id); if (e.target.checked) work.bookIds.push(bk.id); };
        box.appendChild(l);
      }
    };
    drawBooks();

    // World cast
    let drawCast = () => {};
    if (K === "world") {
      drawCast = () => {
        const box = $("cCast");
        box.innerHTML = work.cast.length ? "" : '<p class="note">No listings yet. Add them here, or paste them into the description and tap Split into listings.</p>';
        work.cast.forEach((x, i) => {
          const d = document.createElement("div"); d.className = "cast";
          d.innerHTML = `<div class="row"><input data-k="name" placeholder="Name" value="${esc(x.name)}" style="flex:2;padding:10px 12px;border-radius:10px;border:1px solid var(--line)"><select data-k="type" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line)"><option value="character" ${x.type !== "group" ? "selected" : ""}>Character</option><option value="group" ${x.type === "group" ? "selected" : ""}>Group / faction</option></select></div><textarea data-k="details" data-x="cast" style="min-height:90px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)" placeholder="Who they are, what they look like, what they want">${esc(x.details)}</textarea><div class="xrow"><button type="button" class="btn small danger" data-rm>Remove</button></div>`;
          d.querySelectorAll("[data-k]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => { x[el.dataset.k] = el.value; }));
          d.querySelector("[data-rm]").onclick = () => { work.cast.splice(i, 1); drawCast(); };
          box.appendChild(d);
          wireExpand(d, () => ctx() + `\nThis listing: ${x.name} (${x.type})`);
        });
      };
      drawCast();
      $("cAddCast").onclick = () => { work.cast.push({ name: "", type: "character", details: "" }); drawCast(); };
    }

    // Group members
    let drawMembers = () => {};
    if (K === "group") {
      drawMembers = () => {
        const box = $("cMembers");
        const pool = S.chars.filter(x => x.kind === "character");
        box.innerHTML = pool.length ? "" : '<p class="note">No characters yet. Paste their descriptions below and tap Split into listings, or create characters first.</p>';
        for (const m of pool) {
          const l = document.createElement("label"); l.className = "checkrow";
          l.innerHTML = `<input type="checkbox" ${work.members.includes(m.id) ? "checked" : ""}><img alt=""><span>${esc(m.name)}</span>`;
          setImg(l.querySelector("img"), portraitURL(m), m);
          l.querySelector("input").onchange = e => { work.members = work.members.filter(x => x !== m.id); if (e.target.checked) work.members.push(m.id); };
          box.appendChild(l);
        }
      };
      drawMembers();
    }

    // Split into listings
    b.querySelectorAll("[data-split]").forEach(btn => {
      const ta = btn.closest(".field").querySelector("textarea");
      let undo = null;
      ta.addEventListener("input", () => { if (undo) { undo = null; btn.textContent = "⇆ Split into listings"; } });
      btn.onclick = async () => {
        if (undo) {
          ta.value = undo.text; ta.dispatchEvent(new Event("input"));
          if (K === "world") { work.cast.splice(work.cast.length - undo.added, undo.added); drawCast(); }
          else { work.members = work.members.filter(id => !undo.created.includes(id)); S.chars = S.chars.filter(x => !undo.created.includes(x.id)); await saveChars(); drawMembers(); }
          undo = null; btn.textContent = "⇆ Split into listings"; $("cMsg").textContent = "Split undone."; return;
        }
        if (!ta.value.trim()) { $("cMsg").textContent = "Paste or write some text in that box first."; return; }
        if (!hasKey()) { $("cMsg").textContent = "Add your API key in Settings first."; return; }
        grab();
        btn.disabled = true; btn.textContent = "Sorting…";
        try {
          const prev = ta.value;
          const r = await splitListings(prev, K, work);
          if (!r.entries.length) { $("cMsg").textContent = "No separate characters or factions found in that text."; btn.textContent = "⇆ Split into listings"; return; }
          ta.value = r.remaining; ta.dispatchEvent(new Event("input"));
          if (K === "world") {
            for (const e of r.entries) work.cast.push({ name: String(e.name).trim(), type: e.type === "group" ? "group" : "character", details: String(e.details || "").trim() });
            drawCast();
            undo = { text: prev, added: r.entries.length };
            $("cMsg").textContent = `Moved ${r.entries.length} listing${r.entries.length === 1 ? "" : "s"} into People & factions.`;
          } else {
            const created = [];
            for (const e of r.entries) {
              const nc = { ...blankChar("character"), name: String(e.name).trim(), appearance: String(e.appearance || "").trim(), description: String(e.details || "").trim() };
              S.chars.push(nc); created.push(nc.id); work.members.push(nc.id);
            }
            await saveChars(); drawMembers();
            undo = { text: prev, created };
            $("cMsg").textContent = `Created ${created.length} character${created.length === 1 ? "" : "s"} and added them to the group. You can edit each from the home screen.`;
          }
          btn.textContent = "↶ Undo split";
        } catch (e) { $("cMsg").textContent = e.message.startsWith("Unexpected") ? "The model's answer couldn't be read. Try again." : e.message; btn.textContent = "⇆ Split into listings"; }
        finally { btn.disabled = false; }
      };
    });

    // Pictures
    if ($("cPick")) seedPicker($("cPick"), work);
    if ($("cArt")) $("cArt").onchange = () => { if ($("cVisGen")) $("cVisGen").click(); };
    if ($("cVisGen")) $("cVisGen").onclick = async () => {
      const b2 = $("cVisGen"); grab();
      if (!hasKey()) { b2.textContent = "Add your API key in Settings first"; return; }
      b2.disabled = true; b2.textContent = "Writing…";
      try { await ensureVisual(work, true); $("cVis").value = work.visual || ""; seedPicker($("cPick"), work); b2.textContent = "Rewritten. Pick a look below."; }
      catch (e) { b2.textContent = e.message; }
      finally { b2.disabled = false; }
    };
    if ($("cPic")) $("cPic").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      grab(); work.customPortrait = await shrinkImage(f); editChar(work, isNew);
    };
    if ($("cPicClear")) $("cPicClear").onclick = () => { grab(); work.customPortrait = ""; editChar(work, isNew); };

    $("cSave").onclick = async () => {
      grab();
      if (!work.name) { $("cName").focus(); $("cName").placeholder = "A name is required"; return; }
      if (K === "group" && !work.members.length) { $("cMsg").textContent = "Pick at least one member, or split characters out of the description."; return; }
      work.lore = work.lore.filter(l => l.text.trim());
      work.cast = work.cast.filter(x => x.name.trim() || x.details.trim());
      if (K !== "group" && !work.customPortrait && !work.visualManual && work.visualSrc !== cardSig(work)) {
        $("cSave").disabled = true; $("cSave").textContent = K === "world" ? "Picturing the world…" : "Designing their look…";
        try { await ensureVisual(work); } catch {}
      }
      const i = S.chars.findIndex(x => x.id === work.id);
      if (i < 0) S.chars.unshift(work); else S.chars[i] = work;
      await saveChars(); closeSheet();
      if (isNew) openChat(work.id);
      else if (!$("chat").hidden && S.charId === work.id) { $("chatName").textContent = work.name; updateStage(); renderMsgs(true); renderSpeakers(); }
      else renderHome();
    };
    if ($("cDel")) confirmBtn($("cDel"), "Tap again to delete forever", async () => {
      S.chars = S.chars.filter(x => x.id !== work.id);
      for (const g of S.chars) if (g.members) g.members = g.members.filter(id => id !== work.id);
      await saveChars();
      for (const k of await Store.keys()) if (k.startsWith(`chat:${work.id}:`)) await Store.del(k);
      closeSheet(); S.charId = null; $("chat").hidden = true; $("home").hidden = false; renderHome();
    });
  });
}
async function shrinkImage(file, max = 768) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return cv.toDataURL("image/jpeg", 0.85);
}

/* ---------- Import character cards (Tavern-style JSON or PNG) ---------- */
function readPngCard(buf) {
  const dv = new DataView(buf); let p = 8, found = {};
  while (p + 8 <= dv.byteLength) {
    const len = dv.getUint32(p), type = String.fromCharCode(...new Uint8Array(buf, p + 4, 4));
    if (type === "tEXt") {
      const data = new Uint8Array(buf, p + 8, len), z = data.indexOf(0);
      const key = new TextDecoder("latin1").decode(data.slice(0, z));
      if (key === "chara" || key === "ccv3") {
        const bin = atob(new TextDecoder("latin1").decode(data.slice(z + 1)));
        found[key] = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
      }
    }
    if (type === "IEND") break;
    p += 12 + len;
  }
  return found.ccv3 || found.chara || null;
}
$("importCard").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    let card, pic = "";
    if (/png$/i.test(f.type) || /\.png$/i.test(f.name)) { card = readPngCard(await f.arrayBuffer()); pic = await shrinkImage(f); }
    else card = JSON.parse(await f.text());
    if (!card) throw new Error();
    if (card.app === "lanternroom" && card.char) {
      const c = { ...blankChar("character"), ...card.char, id: uid() };
      S.chars.unshift(c); await saveChars(); renderHome(); editChar(c, false); return;
    }
    const d = card.data || card;
    const desc = [d.description, d.personality ? "Personality: " + d.personality : "", d.mes_example ? "Example dialogue:\n" + d.mes_example : ""].filter(Boolean).join("\n\n");
    let lore = []; try { if (d.character_book) lore = parseLorebook(d.character_book).entries; } catch {}
    const c = { ...blankChar("character"), name: d.name || "Imported", description: desc, scenario: d.scenario || "", firstMessage: d.first_mes || "", lore, customPortrait: pic };
    S.chars.unshift(c); await saveChars(); renderHome(); editChar(c, false);
  } catch { $("tagline").textContent = "That file doesn't look like a character card (PNG or JSON)."; }
};

/* ---------- Memory sheet ---------- */
$("btnMemory").onclick = () => openMemory();
function openMemory() {
  const c = char(), ch = S.chat;
  openSheet("Memory", b => {
    const lore = activeLore(c, ch.messages);
    const kept = ch.messages.length - (ch.summarizedUpTo || 0);
    b.innerHTML = `
      <p class="note">The AI always sees: this summary, the facts below, matching lorebook entries, and the latest ${kept} message${kept === 1 ? "" : "s"} word-for-word. This memory belongs to your chat as ${esc(uname())}. Edit anything it got wrong.</p>
      ${field("Story so far", `<textarea id="mSum" style="min-height:160px" placeholder="Nothing summarized yet. This fills in automatically as the chat grows.">${esc(ch.summary)}</textarea>`)}
      <button class="btn" id="mSumSave">Save summary</button>
      <div class="group"><h3>Facts</h3>
        <p class="hint" style="margin:0;color:var(--muted);font-size:13px">Pinned facts (★) are never changed by the AI.</p>
        <div id="mFacts" class="stack"></div>
        <div class="row" style="align-items:center"><input id="mNew" style="flex:3;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)" placeholder="Add a fact…"><button class="btn" id="mAdd" style="flex:1">Add</button></div>
        <button class="btn" id="mRefresh">Update facts from recent chat</button>
      </div>
      <div class="group"><h3>Lore active right now</h3>
        <p class="note">${lore.length ? lore.map(l => esc(l.name || l.keys || "(always on)") + (l.constant ? " · always on" : "")).join("<br>") : "None. Lore loads when its keywords appear in the last few messages."}</p>
      </div>`;
    const draw = () => {
      const box = $("mFacts"); box.innerHTML = ch.facts.length ? "" : '<p class="note">No facts yet. They build up automatically every few replies.</p>';
      ch.facts.forEach((f, i) => {
        const d = document.createElement("div"); d.className = "fact" + (f.pin ? " pinned" : "");
        d.innerHTML = `<span>${esc(f.t)}</span><button class="pin" aria-label="${f.pin ? "Unpin" : "Pin"}">${f.pin ? "★" : "☆"}</button><button aria-label="Remove">✕</button>`;
        const [pin, rm] = d.querySelectorAll("button");
        pin.onclick = async () => { f.pin = !f.pin; await saveChat(); draw(); };
        rm.onclick = async () => { ch.facts.splice(i, 1); await saveChat(); draw(); };
        box.appendChild(d);
      });
    };
    draw();
    $("mSumSave").onclick = async () => { ch.summary = $("mSum").value.trim(); await saveChat(); $("mSumSave").textContent = "Saved"; };
    $("mAdd").onclick = async () => { const t = $("mNew").value.trim(); if (!t) return; ch.facts.push({ t, pin: true }); $("mNew").value = ""; await saveChat(); draw(); };
    $("mRefresh").onclick = async () => {
      const btn = $("mRefresh"); btn.disabled = true; btn.textContent = "Reading the chat…";
      try { await updateFacts(c, ch); draw(); btn.textContent = "Facts updated"; }
      catch (e) { btn.textContent = e.message; }
      finally { btn.disabled = false; }
    };
  });
}

/* ---------- Portrait sheet ---------- */
$("btnWho").onclick = () => openPortrait(char());
function openPortrait(c) {
  const ch = S.chat;
  const host = char();
  openSheet(c.name, b => {
    if (c.kind === "group") {
      b.innerHTML = `<p class="note">Tap a member to see their portrait and pick a different look.</p><div class="mood-grid">${members(c).map(m => `<button type="button" data-id="${m.id}" style="display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--muted);font-size:12px"><img alt="" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--surface-2)"><span>${esc(m.name)}</span></button>`).join("")}</div>`;
      b.querySelectorAll("[data-id]").forEach(x => { const m = byId(x.dataset.id); setImg(x.querySelector("img"), portraitURL(m), m); x.onclick = () => openPortrait(m); });
      return;
    }
    const mood = host && host.id === c.id ? ch?.mood || "neutral" : (host?.kind === "group" && ch?.focus === c.name ? ch.mood : "neutral");
    const big = c.kind === "world" ? coverURL(c) : portraitURL(c, mood);
    b.innerHTML = `<img class="big-portrait" id="pBig" alt="${esc(c.name)}">
      ${c.customPortrait ? "" : `<p class="note">${esc(looks(c))}</p><div class="lbl">Not right? Pick a different look</div><div id="pPick"></div>
      ${c.kind === "world" ? "" : `<div class="lbl">Expressions</div><div class="mood-grid">${MOODS.map(m => `<figure><img data-m="${m}" alt="" loading="lazy"><figcaption>${m}</figcaption></figure>`).join("")}</div><p class="note">Expressions are drawn the first time they're needed, then cached by your browser.</p>`}`}
      ${host && host.id !== c.id ? '<button class="btn" id="pBack">Back to the group</button>' : ""}`;
    setImg($("pBig"), big, c);
    b.querySelectorAll("[data-m]").forEach(im => setImg(im, portraitURL(c, im.dataset.m), c));
    if ($("pBack")) $("pBack").onclick = () => openPortrait(host);
    if ($("pPick")) seedPicker($("pPick"), c, async () => {
      await saveChars();
      setImg($("pBig"), c.kind === "world" ? coverURL(c) : portraitURL(c, mood), c);
      b.querySelectorAll("[data-m]").forEach(im => setImg(im, portraitURL(c, im.dataset.m), c));
      updateStage(); renderMsgs(true);
    });
  });
}

/* ---------- More menu ---------- */
$("btnMore").onclick = () => openSheet("Options", b => {
  const c = char();
  b.innerHTML = `<div class="menu">
    <button class="btn" id="oIll">Illustrate this moment</button>
    <button class="btn" id="oEdit">Edit ${KINDS[c.kind || "character"].label.toLowerCase()} & lorebook</button>
    <button class="btn" id="oMem">View memory</button>
    <button class="btn" id="oPer">Playing as ${esc(uname())} · switch persona</button>
    <button class="btn danger" id="oReset">Start a new chat</button></div>
    <p class="note">Starting a new chat erases this conversation (as ${esc(uname())}) and its memory. Export a backup in Settings first if you want to keep it.</p>`;
  $("oIll").onclick = () => { closeSheet(); illustrate(); };
  $("oEdit").onclick = () => editChar(char(), false);
  $("oMem").onclick = openMemory;
  $("oPer").onclick = () => openPersonas();
  confirmBtn($("oReset"), "Tap again to erase this chat", async () => { S.chat = newChat(char()); await saveChat(); closeSheet(); updateStage(); renderMsgs(); });

function editMessage(i) {
  const m = S.chat.messages[i];
  openSheet("Edit message", b => {
    b.innerHTML = `${field("Text", `<textarea id="eTxt" style="min-height:220px">${esc(m.content)}</textarea>`)}<button class="btn primary" id="eSave">Save</button>`;
    $("eSave").onclick = async () => {
      m.content = $("eTxt").value; if (m.alts) m.alts[m.alt || 0] = m.content;
      S.openActs = null; await saveChat(); closeSheet(); renderMsgs(true);
    };
  });
}

$("btnBack").onclick = () => { if (S.busy) return; $("chat").hidden = true; $("home").hidden = false; S.charId = null; S.chat = null; renderHome(); };

/* ---------- Boot & migrations ---------- */
(async () => {
  await Store.open();
  const saved = (await Store.get("settings")) || {};
  S.settings = { ...DEFAULTS, ...saved };
  const fresh = saved.apiKey === undefined;
  if (!fresh && (saved.v || 1) < 4) {
    if (/^deepseek-(chat|reasoner)$/.test(S.settings.model)) S.settings.model = DEFAULTS.model;
    if (S.settings.imgUrl === "https://image.pollinations.ai/prompt/{prompt}?width={w}&height={h}&seed={seed}&nologo=true") S.settings.imgUrl = DEFAULTS.imgUrl;
    Object.assign(S.settings, { temperature: DEFAULTS.temperature, maxTokens: DEFAULTS.maxTokens, contextTokens: DEFAULTS.contextTokens, topK: DEFAULTS.topK, topP: DEFAULTS.topP, repPenalty: DEFAULTS.repPenalty, freqPenalty: DEFAULTS.freqPenalty });
  }
  S.settings.v = 4;
  S.chars = (await Store.get("chars")) || [];
  S.books = (await Store.get("books")) || [];
  S.personas = (await Store.get("personas")) || [];
  if (!S.personas.length) S.personas = [{ id: "default", name: (saved.userName || "").trim() || "Traveler", description: (saved.persona || "").trim() }];
  delete S.settings.userName; delete S.settings.persona; delete S.settings.contextChars;
  S.personaId = (await Store.get("activePersona")) || S.personas[0].id;
  if (!S.personas.some(p => p.id === S.personaId)) S.personaId = S.personas[0].id;
  for (const c of S.chars) {
    c.kind = c.kind || "character"; c.bookIds = c.bookIds || []; c.lore = c.lore || [];
    const old = await Store.get("chat:" + c.id);
    if (old) { if (!(await Store.get(chatKey(c.id, "default")))) await Store.set(chatKey(c.id, "default"), old); await Store.del("chat:" + c.id); }
  }
  if (!S.chars.length && !(await Store.get("seeded"))) { S.chars = [sampleChar()]; await Store.set("seeded", true); }
  await saveSettings(); await saveChars(); await savePersonas();
  renderHome();
})();
