<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#16131d">
<title>Lanternroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a one-screen phone app. Home = cast list; Chat = scene background, portrait header, bubbles, composer. Dark by design (night reading). */
:root{
  --bg:#16131d; --surface:#211d2b; --surface-2:#2c2739; --line:#3a3449;
  --fg:#efeaf6; --muted:#a39bb6; --accent:#e8a95b; --accent-ink:#2a1a06;
  --user:#3a3150; --danger:#e2766f; --ok:#8fcf9f;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 12px;font-size:13px}
.icon{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg);flex:none}
.icon:active{background:var(--surface-2)}
.icon svg{width:22px;height:22px}

#app{height:100%;padding-top:env(safe-area-inset-top,0px)}
section.screen{height:100%;display:flex;flex-direction:column;position:relative}

/* Home */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.topbar h1{font:400 28px/1.1 var(--f-display);margin:0;letter-spacing:.01em}
.topbar h1 span{color:var(--accent)}
.home-scroll{flex:1;overflow-y:auto;padding:8px 16px 24px}
.tagline{color:var(--muted);margin:0 0 16px;font-size:14px}
#charList{display:grid;gap:12px}
.char-card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.char-card img,.char-card .ph{width:72px;height:90px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.char-card .name{font:400 19px/1.2 var(--f-display)}
.char-card .snip{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.char-card > div{min-width:0}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.home-actions .btn{flex:1}
.ph{display:grid;place-items:center;font:400 28px var(--f-display);color:var(--accent)}

/* Chat */
#chat{background:var(--bg)}
#scene{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
#scene.on{opacity:.38}
#chat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,19,29,.55),rgba(22,19,29,.2) 30%,rgba(22,19,29,.85));pointer-events:none;z-index:0}
.chatbar,#msgs,#composer,#status{position:relative;z-index:1}
.chatbar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;background:rgba(22,19,29,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chatbar .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:2px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:2px solid var(--accent);flex:none;transition:opacity .4s}
.who .t{min-width:0}
.who .n{font:400 18px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood-chip{display:inline-block;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--accent);margin-right:4px;text-transform:capitalize}
#msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.assistant{align-self:flex-start;background:rgba(33,29,43,.92);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:6px}
.msg em.act{color:#c9bfdc;font-style:italic}
.msg .q{color:#fff3e2}
.msg.typing{color:var(--muted)}
.msg.img{padding:6px;background:var(--surface);border:1px solid var(--line);align-self:center;max-width:94%}
.msg.img img{display:block;border-radius:12px;width:100%;min-height:120px;background:var(--surface-2)}
.msg.img .cap{font-size:12px;color:var(--muted);padding:6px 6px 2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.swipe{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.swipe button{padding:4px 10px;border-radius:999px;color:var(--accent);font-weight:700}
.swipe button:disabled{opacity:.3}
#status{font-size:12px;color:var(--muted);padding:0 16px 4px;min-height:0}
#status.err{color:var(--danger)}
#composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(22,19,29,.9);border-top:1px solid var(--line)}
#input{flex:1;min-width:0;resize:none;max-height:140px;min-height:44px;padding:10px 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);line-height:1.4}
#send{background:var(--accent);color:var(--accent-ink)}
#send:disabled{opacity:.5}

/* Sheets */
#sheet{position:fixed;inset:0;z-index:10;background:rgba(8,6,12,.6);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 20px}
.panel-head h2{margin:0;font:400 22px var(--f-display)}
#sheetBody{overflow-y:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.field textarea{min-height:90px;resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.group{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.group h3{margin:0;font:400 18px var(--f-display)}
.fact{display:flex;align-items:flex-start;gap:6px;padding:8px 6px 8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.fact.pinned{border-color:var(--accent)}
.fact span{flex:1;min-width:0;padding-top:3px}
.fact button{width:32px;height:32px;border-radius:8px;color:var(--muted);flex:none}
.fact.pinned .pin{color:var(--accent)}
.lore{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.lore input,.lore textarea{background:var(--surface)}
.big-portrait{width:100%;border-radius:16px;background:var(--surface-2);aspect-ratio:4/5;object-fit:cover}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;border-radius:12px;padding:14px 16px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood-grid figure{margin:0;text-align:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.mood-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <header class="topbar">
      <h1>Lantern<span>room</span></h1>
      <button class="icon" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div class="home-scroll">
      <p class="tagline" id="tagline">Your characters, with memory that holds.</p>
      <div id="charList"></div>
    </div>
    <div class="home-actions">
      <button class="btn primary" id="btnNewChar">New character</button>
      <label class="btn" for="importCard">Import card</label>
      <input type="file" id="importCard" accept=".json,.png,application/json,image/png" hidden>
    </div>
  </section>

  <section id="chat" class="screen" hidden>
    <div id="scene"></div>
    <header class="chatbar">
      <button class="icon" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="who" id="btnWho" aria-label="Show portrait">
        <img class="avatar" id="avatar" alt="">
        <div class="t"><div class="n" id="chatName"></div><div class="p" id="chatPlace"></div></div>
      </button>
      <button class="icon" id="btnMemory" aria-label="Memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3 3 3 0 0 0 3-2V5a3 3 0 0 0-3-2zM15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3 3 3 0 0 1-3-2"/></svg></button>
      <button class="icon" id="btnMore" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </header>
    <div id="msgs" aria-live="polite"></div>
    <div id="status"></div>
    <form id="composer" autocomplete="off">
      <button type="button" class="icon" id="btnIllustrate" aria-label="Illustrate this moment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
      <textarea id="input" rows="1" placeholder="Write your reply…"></textarea>
      <button type="button" class="icon" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>
</div>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="panel-head"><h2 id="sheetTitle"></h2><button class="icon" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
"use strict";
/* ---------- Storage (IndexedDB, falls back to localStorage) ---------- */
const Store = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("lanternroom", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  async get(k) {
    if (this.db) return new Promise(res => { const t = this.db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); });
    try { const v = localStorage.getItem("lr:" + k); return v ? JSON.parse(v) : undefined; } catch { return undefined; }
  },
  async set(k, v) {
    if (this.db) return new Promise(res => { const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").put(JSON.parse(JSON.stringify(v)), k); tx.oncomplete = res; tx.onerror = res; });
    try { localStorage.setItem("lr:" + k, JSON.stringify(v)); } catch {}
  },
  async del(k) {
    if (this.db) return new Promise(res => { const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = res; tx.onerror = res; });
    try { localStorage.removeItem("lr:" + k); } catch {}
  }
};

/* ---------- Constants & state ---------- */
const MOODS = ["neutral","happy","sad","angry","surprised","flirty","scared","thoughtful","embarrassed"];
const DEFAULTS = {
  apiKey: "", model: "deepseek-chat", temperature: 1.3, maxTokens: 700,
  userName: "", persona: "",
  contextChars: 40000, keepRecent: 16, summarizeAt: 12000, factsEvery: 4,
  imgStyle: "detailed anime illustration, painterly, soft cinematic lighting",
  imgUrl: "https://image.pollinations.ai/prompt/{prompt}?width={w}&height={h}&seed={seed}&nologo=true",
  portraits: true, backgrounds: true
};
const S = { settings: {...DEFAULTS}, chars: [], charId: null, chat: null, busy: false, openActs: null, abort: null };
const $ = id => document.getElementById(id);
const char = () => S.chars.find(c => c.id === S.charId);
const uname = () => S.settings.userName.trim() || "User";

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h) % 1000000; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fill = (s, c) => String(s || "").replace(/\{\{char\}\}/gi, c?.name || "").replace(/\{\{user\}\}/gi, uname());

function fmt(text) {
  let h = String(text).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  h = h.replace(/("[^"\n]+"|“[^”\n]+”)/g, "<span class=q>$1</span>")
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/\*([^*\n]+)\*/g, "<em class=act>$1</em>")
       .replace(/\n/g, "<br>");
  return h;
}

/* ---------- Images ---------- */
function imgURL(prompt, w, h, seed) {
  const p = prompt.replace(/\s+/g, " ").trim().slice(0, 900);
  return S.settings.imgUrl.replace("{prompt}", encodeURIComponent(p)).replace("{w}", w).replace("{h}", h).replace("{seed}", seed);
}
function looks(c) { return (c.appearance || "").trim() || (c.name + ", " + (c.description || "").slice(0, 160)); }
function portraitURL(c, mood = "neutral") {
  if (c.customPortrait) return c.customPortrait;
  if (!S.settings.portraits) return "";
  return imgURL(`${S.settings.imgStyle}, character portrait of ${looks(c)}, ${mood} facial expression, upper body, looking at viewer, simple soft background`, 512, 640, c.seed);
}
function sceneURL(c, place) {
  return imgURL(`${S.settings.imgStyle}, ${place}, environment art, wide scenery, atmospheric, no people`, 720, 1280, hash(c.id + place.toLowerCase()));
}
function initialSVG(c) {
  const l = esc((c?.name || "?")[0].toUpperCase());
  return "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100"><rect width="80" height="100" fill="#2c2739"/><text x="40" y="62" font-family="Georgia,serif" font-size="40" fill="#e8a95b" text-anchor="middle">${l}</text></svg>`);
}
function setImg(img, url, c) {
  if (!url) { img.src = initialSVG(c); return; }
  img.onerror = () => { img.onerror = null; img.src = initialSVG(c); };
  if (img.getAttribute("src") !== url) img.src = url;
}

/* ---------- DeepSeek ---------- */
async function ds(messages, o = {}) {
  const st = S.settings;
  if (!st.apiKey) throw new Error("Add your DeepSeek API key in Settings first.");
  const body = { model: o.model || st.model, messages, max_tokens: o.maxTokens || st.maxTokens, stream: !!o.onDelta };
  if (!/reasoner/.test(body.model)) body.temperature = o.temperature ?? st.temperature;
  if (o.json) body.response_format = { type: "json_object" };
  let r;
  try {
    r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST", signal: o.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + st.apiKey.trim() },
      body: JSON.stringify(body)
    });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    throw new Error("Couldn't reach DeepSeek. Check your internet connection and try again.");
  }
  if (!r.ok) {
    let msg = ""; try { msg = (await r.json()).error?.message || ""; } catch {}
    const known = { 401: "DeepSeek rejected the API key. Check it in Settings.", 402: "Your DeepSeek balance is empty. Top up at platform.deepseek.com.", 429: "DeepSeek is rate-limiting you. Wait a moment and try again.", 503: "DeepSeek is overloaded right now. Try again shortly." };
    throw new Error(known[r.status] || `DeepSeek error ${r.status}${msg ? ": " + msg : ""}`);
  }
  if (!o.onDelta) { const j = await r.json(); return j.choices?.[0]?.message?.content || ""; }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", full = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      const l = line.trim();
      if (!l.startsWith("data:")) continue;
      const d = l.slice(5).trim();
      if (d === "[DONE]") continue;
      try { const c = JSON.parse(d).choices?.[0]?.delta?.content; if (c) { full += c; o.onDelta(full); } } catch {}
    }
  }
  return full;
}
const AUX = "deepseek-chat";

function parseTag(raw) {
  const m = raw.match(/\[\[\s*mood\s*:\s*([a-z]+)\s*(?:\|\s*place\s*:\s*([^\]]*?))?\s*\]\]\s*$/i);
  if (!m) return { text: raw.split("[[")[0].trim(), mood: null, place: null };
  const mood = MOODS.includes(m[1].toLowerCase()) ? m[1].toLowerCase() : "neutral";
  return { text: raw.slice(0, m.index).trim(), mood, place: (m[2] || "").trim() || null };
}

/* ---------- Prompt building ---------- */
function activeLore(c, msgs) {
  const recent = msgs.filter(m => m.role !== "image").slice(-4).map(m => m.content).join(" ").toLowerCase();
  return (c.lore || []).filter(l => l.text && l.keys && l.keys.split(",").map(k => k.trim().toLowerCase()).filter(Boolean).some(k => recent.includes(k)));
}
function buildPrompt(c, chat, upto) {
  const st = S.settings, u = uname();
  let sys = `You are ${c.name} in an ongoing interactive story with ${u}. Stay fully in character. Write actions in *asterisks* and speech in quotes. Never write ${u}'s words, thoughts or actions. Keep replies vivid and focused, usually 1-4 paragraphs. Stay consistent with everything established below.\n\n# ${c.name}\n${fill(c.description, c)}`;
  if (c.scenario) sys += `\n\n# Scenario\n${fill(c.scenario, c)}`;
  if (st.persona) sys += `\n\n# About ${u}\n${fill(st.persona, c)}`;
  if (chat.summary) sys += `\n\n# Story so far\n${chat.summary}`;
  if (chat.facts.length) sys += `\n\n# Established facts (never contradict these)\n` + chat.facts.map(f => "- " + f.t).join("\n");
  const lore = activeLore(c, chat.messages.slice(0, upto));
  if (lore.length) sys += `\n\n# World notes\n` + lore.map(l => fill(l.text, c)).join("\n\n");
  sys += `\n\nAfter every reply, add one final line in exactly this format, which the app reads and hides:\n[[mood: one of ${MOODS.join("/")} | place: short name of the current location]]`;

  const hist = chat.messages.slice(chat.summarizedUpTo || 0, upto).filter(m => m.role !== "image");
  let budget = st.contextChars - sys.length;
  const out = [];
  for (let i = hist.length - 1; i >= 0; i--) {
    const m = hist[i];
    let content = m.content;
    if (m.role === "assistant" && m.mood) content += `\n[[mood: ${m.mood} | place: ${m.place || chat.place || "unknown"}]]`;
    if (budget - content.length < 0 && out.length >= 2) break;
    budget -= content.length;
    out.unshift({ role: m.role, content });
  }
  if (!out.length || out[0].role !== "user") out.unshift({ role: "user", content: "(The scene begins.)" });
  return [{ role: "system", content: sys }, ...out];
}

/* ---------- Data ---------- */
function newChat(c) {
  const first = fill(c.firstMessage, c).trim();
  return { messages: first ? [{ id: uid(), role: "assistant", content: first, alts: [first], alt: 0, mood: "neutral" }] : [],
           summary: "", summarizedUpTo: 0, facts: [], turnsSinceFacts: 0, mood: "neutral", place: c.startPlace || "" };
}

const within = (p, ms = 1500) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);

function setStatus(t, err) { const s = $("status"); s.textContent = t || ""; s.className = err ? "err" : ""; s.style.padding = t ? "" : "0"; }

function renderMsgs(keepScroll) {
  const box = $("msgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = "";
  const msgs = S.chat.messages;
  const lastAsst = msgs.map(m => m.role).lastIndexOf("assistant");
  msgs.forEach((m, i) => {
    const d = document.createElement("div");
    d.dataset.i = i;
    if (m.role === "image") {
      d.className = "msg img";
      d.innerHTML = `<img alt="Illustration: ${esc(m.prompt || "")}" loading="lazy"><div class="cap">Illustration · tap for options</div>`;
      const im = d.querySelector("img"); im.src = m.url;
      im.onerror = () => { d.querySelector(".cap").textContent = "The image failed to load. Tap and choose Redraw."; };
    } else {
      d.className = "msg " + m.role;
      d.innerHTML = fmt(m.content);
      if (m.role === "assistant" && i === lastAsst && (m.alts?.length > 1 || i === msgs.length - 1)) {
        const sw = document.createElement("div"); sw.className = "swipe";
        const n = m.alts?.length || 1, a = (m.alt || 0) + 1;
        sw.innerHTML = `<button data-act="prev" ${a <= 1 ? "disabled" : ""} aria-label="Previous version">‹</button><span>${a}/${n}</span><button data-act="next" aria-label="${a < n ? "Next version" : "New version"}">${a < n ? "›" : "↻"}</button>`;
        d.appendChild(sw);
      }
    }
    if (S.openActs === m.id) {
      const acts = document.createElement("div"); acts.className = "acts";
      const btns = [];
      if (m.role !== "image") btns.push(["edit", "Edit"]);
      if (m.role === "image") btns.push(["redraw", "Redraw"]);
      btns.push(["del", "Delete"]);
      if (m.role === "assistant" && i === lastAsst) btns.push(["reroll", "New version"]);
      acts.innerHTML = btns.map(([a, l]) => `<button type="button" class="btn small ${a === "del" ? "danger" : ""}" data-act="${a}">${l}</button>`).join("");
      d.appendChild(acts);
    }
    box.appendChild(d);
  });
  if (!keepScroll || atBottom) box.scrollTop = box.scrollHeight;
}

$("msgs").addEventListener("click", async e => {
  const d = e.target.closest(".msg"); if (!d) return;
  const i = +d.dataset.i, m = S.chat.messages[i];
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) { S.openActs = S.openActs === m.id ? null : m.id; renderMsgs(true); return; }
  if (S.busy) return;
  if (act === "prev") { m.alt = Math.max(0, m.alt - 1); applyAlt(m); }
  else if (act === "next") { if (m.alt < m.alts.length - 1) { m.alt++; applyAlt(m); } else reroll(i); }
  else if (act === "reroll") reroll(i);
  else if (act === "del") {
    S.chat.messages.splice(i, 1);
    if (i < S.chat.summarizedUpTo) S.chat.summarizedUpTo--;
    S.openActs = null; await saveChat(); renderMsgs(true);
  }
  else if (act === "edit") editMessage(i);
  else if (act === "redraw") { m.url = imgURL(m.full || m.prompt, 768, 512, Math.floor(Math.random() * 1e6)); await saveChat(); renderMsgs(true); }
});
async function applyAlt(m) { m.content = m.alts[m.alt]; if (m.altMeta?.[m.alt]) Object.assign(m, m.altMeta[m.alt]); await saveChat(); renderMsgs(true); }

$("composer").addEventListener("submit", e => { e.preventDefault(); send(); });
$("send").addEventListener("click", e => { e.preventDefault(); send(); });
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); send(); } });
function autoGrow() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }

function setBusy(b) { S.busy = b; $("send").disabled = b; $("btnIllustrate").disabled = b; }

async function send() {
  try { await sendInner(); } catch (e) { setBusy(false); setStatus("Something went wrong: " + e.message, true); }
}
async function sendInner() {
  if (S.busy) return;
  const t = $("input").value.trim();
  if (t) { S.chat.messages.push({ id: uid(), role: "user", content: t }); $("input").value = ""; autoGrow(); }
  else if (!S.chat.messages.length || S.chat.messages.at(-1).role === "assistant") return;
  S.openActs = null;
  await saveChat(); renderMsgs();
  await generate(S.chat.messages.length, null);
}
async function reroll(i) {
  S.openActs = null;
  await generate(i, S.chat.messages[i]);
}
async function generate(upto, existing) {
  const c = char(), chat = S.chat;
  setBusy(true); setStatus("");
  let bubble;
  if (existing) { bubble = $("msgs").querySelector(`[data-i="${upto}"]`); }
  else { bubble = document.createElement("div"); bubble.className = "msg assistant typing"; $("msgs").appendChild(bubble); }
  bubble.innerHTML = `${esc(c.name)} is writing…`; bubble.classList.add("typing");
  const box = $("msgs"); box.scrollTop = box.scrollHeight;
  try {
    const raw = await ds(buildPrompt(c, chat, upto), {
      onDelta: full => { bubble.classList.remove("typing"); bubble.innerHTML = fmt(full.split("[[")[0]); if (box.scrollHeight - box.scrollTop - box.clientHeight < 140) box.scrollTop = box.scrollHeight; }
    });
    const p = parseTag(raw);
    if (!p.text) throw new Error("DeepSeek sent an empty reply. Tap ↻ to try again.");
    const meta = { mood: p.mood || chat.mood || "neutral", place: p.place || chat.place };
    if (existing) {
      existing.alts = existing.alts || [existing.content];
      existing.altMeta = existing.altMeta || [];
      existing.alts.push(p.text); existing.alt = existing.alts.length - 1;
      existing.altMeta[existing.alt] = meta;
      existing.content = p.text; Object.assign(existing, meta);
    } else {
      chat.messages.push({ id: uid(), role: "assistant", content: p.text, alts: [p.text], alt: 0, altMeta: [meta], ...meta });
    }
    chat.mood = meta.mood; if (p.place) chat.place = p.place;
    await saveChat();
    renderMsgs(); updateStage();
    if (!existing) maintainMemory(c, chat).catch(e => setStatus("Memory update skipped: " + e.message, true));
  } catch (e) {
    if (!existing) bubble.remove(); else renderMsgs(true);
    setStatus(e.message, true);
  } finally { setBusy(false); }
}

/* ---------- Memory ---------- */
async function maintainMemory(c, chat) {
  const st = S.settings, u = uname();
  const start = chat.summarizedUpTo || 0, end = chat.messages.length - st.keepRecent;
  if (end > start) {
    const chunk = chat.messages.slice(start, end).filter(m => m.role !== "image");
    const size = chunk.reduce((a, m) => a + m.content.length, 0);
    if (size > st.summarizeAt) {
      setStatus("Saving older events to memory…");
      await summarize(c, chat, chunk, end);
    }
  }
  chat.turnsSinceFacts = (chat.turnsSinceFacts || 0) + 1;
  if (chat.turnsSinceFacts >= st.factsEvery) { setStatus("Updating remembered facts…"); await updateFacts(c, chat); }
  if (S.chat === chat) setStatus("");
}
async function summarize(c, chat, chunk, end) {
  const u = uname();
  const txt = chunk.map(m => `${m.role === "user" ? u : c.name}: ${m.content}`).join("\n\n");
  const sum = await ds([
    { role: "system", content: "You keep the running summary of a long roleplay story. Merge the existing summary and the new events into ONE updated summary in past tense, third person. Preserve names, relationships and how they changed, promises, secrets, injuries, items, decisions, and unresolved threads. Drop filler. Up to 450 words. Output only the summary." },
    { role: "user", content: `Characters: ${c.name} and ${u}.\n\nExisting summary:\n${chat.summary || "(none yet)"}\n\nNew events:\n${txt}` }
  ], { model: AUX, temperature: 0.3, maxTokens: 1000 });
  if (sum.trim()) { chat.summary = sum.trim(); chat.summarizedUpTo = end; await saveChat(); }
}
async function updateFacts(c, chat) {
  const u = uname();
  chat.turnsSinceFacts = 0;
  const recent = chat.messages.filter(m => m.role !== "image").slice(-14).map(m => `${m.role === "user" ? u : c.name}: ${m.content}`).join("\n\n");
  const pinned = chat.facts.filter(f => f.pin), loose = chat.facts.filter(f => !f.pin);
  const out = await ds([
    { role: "system", content: `You maintain a list of durable facts for continuity in a roleplay between ${c.name} and ${u}. Update the list using the recent conversation: add new important facts, correct facts that changed, merge duplicates, remove facts no longer true. Keep only what matters later: names, relationships and feelings, decisions, promises, secrets revealed, possessions, injuries, appearance changes, places, time of day/date. Each fact under 20 words. At most 30 facts. Do not repeat the pinned facts. Respond as JSON: {"facts": ["...", "..."]}` },
    { role: "user", content: `Pinned facts (keep, don't repeat):\n${pinned.map(f => "- " + f.t).join("\n") || "(none)"}\n\nCurrent facts:\n${loose.map(f => "- " + f.t).join("\n") || "(none)"}\n\nRecent conversation:\n${recent}` }
  ], { model: AUX, temperature: 0.2, maxTokens: 1200, json: true });
  let list; try { list = JSON.parse(out).facts; } catch { return; }
  if (Array.isArray(list)) {
    chat.facts = [...pinned, ...list.filter(x => typeof x === "string" && x.trim()).slice(0, 30).map(t => ({ t: t.trim(), pin: false }))];
    await saveChat();
  }
}

/* ---------- Illustrate ---------- */
async function illustrate() {
  if (S.busy) return;
  const c = char(), chat = S.chat, u = uname();
  setBusy(true); setStatus("Picturing the scene…");
  try {
    const recent = chat.messages.filter(m => m.role !== "image").slice(-6).map(m => `${m.role === "user" ? u : c.name}: ${m.content}`).join("\n\n");
    const prompt = (await ds([
      { role: "system", content: "Write ONE prompt for an image generator showing the current moment of this story. 40-70 words of comma-separated visual details: who is in frame and what they look like, pose, expression, action, setting, lighting, camera framing. No names, no dialogue, no quotation marks. Output only the prompt." },
      { role: "user", content: `${c.name} looks like: ${looks(c)}\n${S.settings.persona ? u + ": " + S.settings.persona.slice(0, 300) + "\n" : ""}Current location: ${chat.place || "unknown"}\n\nRecent story:\n${recent}` }
    ], { model: AUX, temperature: 0.7, maxTokens: 200 })).trim().replace(/^["']|["']$/g, "");
    const full = `${S.settings.imgStyle}, ${prompt}`;
    chat.messages.push({ id: uid(), role: "image", prompt, full, url: imgURL(full, 768, 512, Math.floor(Math.random() * 1e6)) });
    await saveChat(); renderMsgs(); setStatus("Drawing… images can take 10-30 seconds.");
    setTimeout(() => { if ($("status").textContent.startsWith("Drawing")) setStatus(""); }, 12000);
  } catch (e) { setStatus(e.message, true); }
  finally { setBusy(false); }
}

      </div>
      <div class="group"><h3>Portrait</h3>
        <div class="row"><label class="btn" for="cPic">${work.customPortrait ? "Replace uploaded image" : "Upload my own image"}</label>${work.customPortrait ? '<button class="btn" id="cPicClear">Use generated portraits</button>' : ""}</div>
        <input type="file" id="cPic" accept="image/*" hidden>
        ${work.customPortrait ? "" : '<button class="btn" id="cReseed">Generate a different look</button>'}
      </div>
      <button class="btn primary" id="cSave">${isNew ? "Create character" : "Save changes"}</button>
      ${isNew ? "" : '<button class="btn danger" id="cDel">Delete character</button>'}`;
    const loreBox = $("cLore");
    const drawLore = () => {
      loreBox.innerHTML = "";
      work.lore.forEach((l, i) => {
        const d = document.createElement("div"); d.className = "lore";
        d.innerHTML = `<input placeholder="Keywords, comma separated" value="${esc(l.keys)}" data-k="keys"><textarea placeholder="What the AI should know when these come up" data-k="text">${esc(l.text)}</textarea><button class="btn small danger" type="button">Remove</button>`;
        d.querySelectorAll("[data-k]").forEach(el => el.oninput = () => { l[el.dataset.k] = el.value; });
        d.querySelector("button").onclick = () => { work.lore.splice(i, 1); drawLore(); };
        loreBox.appendChild(d);
      });
    };
    drawLore();
    $("cAddLore").onclick = () => { work.lore.push({ keys: "", text: "" }); drawLore(); };
    const grab = () => Object.assign(work, { name: $("cName").value.trim(), appearance: $("cLook").value.trim(), description: $("cDesc").value.trim(), scenario: $("cScen").value.trim(), firstMessage: $("cFirst").value.trim(), startPlace: $("cPlace").value.trim() });
    $("cPic").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      grab(); work.customPortrait = await shrinkImage(f); editCharKeep(work, isNew);
    };
    if ($("cPicClear")) $("cPicClear").onclick = () => { grab(); work.customPortrait = ""; editCharKeep(work, isNew); };
    if ($("cReseed")) $("cReseed").onclick = () => { grab(); work.seed = Math.floor(Math.random() * 1e6); editCharKeep(work, isNew); $("cReseed").textContent = "New look picked. Save to keep it."; };
    $("cSave").onclick = async () => {
      grab();
      if (!work.name) { $("cName").focus(); $("cName").placeholder = "A name is required"; return; }
      work.lore = work.lore.filter(l => l.text.trim());
      if (isNew) S.chars.unshift(work); else Object.assign(char() && char().id === work.id ? char() : S.chars.find(x => x.id === work.id), work);
      await saveChars(); closeSheet();
      if (isNew) openChat(work.id); else if (!$("chat").hidden) { $("chatName").textContent = work.name; updateStage(); } else renderHome();
    };
    if ($("cDel")) confirmBtn($("cDel"), "Tap again to delete forever", async () => {
      S.chars = S.chars.filter(x => x.id !== work.id); await saveChars(); await Store.del("chat:" + work.id);
      closeSheet(); S.charId = null; $("chat").hidden = true; $("home").hidden = false; renderHome();
    });
  });
}
function editCharKeep(work, isNew) { editChar(work, isNew); }
async function shrinkImage(file, max = 768) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return cv.toDataURL("image/jpeg", 0.85);
}
$("btnNewChar").onclick = () => editChar({ id: uid(), seed: Math.floor(Math.random() * 1e6), name: "", appearance: "", description: "", scenario: "", firstMessage: "", startPlace: "", lore: [], customPortrait: "" }, true);

/* Import character cards (TavernAI / Janitor-style JSON or PNG) */
function readPngCard(buf) {
  const dv = new DataView(buf); let p = 8, found = {};
  while (p + 8 <= dv.byteLength) {
    const len = dv.getUint32(p), type = String.fromCharCode(...new Uint8Array(buf, p + 4, 4));
    if (type === "tEXt") {
      const data = new Uint8Array(buf, p + 8, len), z = data.indexOf(0);
      const key = new TextDecoder("latin1").decode(data.slice(0, z));
      if (key === "chara" || key === "ccv3") {
        const bin = atob(new TextDecoder("latin1").decode(data.slice(z + 1)));
        found[key] = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
      }
    }
    if (type === "IEND") break;
    p += 12 + len;
  }
  return found.ccv3 || found.chara || null;
}
$("importCard").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    let card, pic = "";
    if (/png$/i.test(f.type) || /\.png$/i.test(f.name)) { card = readPngCard(await f.arrayBuffer()); pic = await shrinkImage(f); }
    else card = JSON.parse(await f.text());
    if (!card) throw new Error();
    const d = card.data || card;
    const desc = [d.description, d.personality ? "Personality: " + d.personality : "", d.mes_example ? "Example dialogue:\n" + d.mes_example : ""].filter(Boolean).join("\n\n");
    const lore = (d.character_book?.entries || []).map(x => ({ keys: (x.keys || []).join(", "), text: x.content || "" })).filter(l => l.text);
    const c = { id: uid(), seed: Math.floor(Math.random() * 1e6), name: d.name || "Imported", appearance: "", description: desc, scenario: d.scenario || "", firstMessage: d.first_mes || "", startPlace: "", lore, customPortrait: pic };
    S.chars.unshift(c); await saveChars(); renderHome(); editChar(c, false);
  } catch { $("tagline").textContent = "That file doesn't look like a character card (PNG or JSON)."; }
};

/* Memory sheet */
$("btnMemory").onclick = () => openMemory();
function openMemory() {
  const c = char(), ch = S.chat;
  openSheet("Memory", b => {
    const lore = activeLore(c, ch.messages);
    const kept = ch.messages.length - (ch.summarizedUpTo || 0);
    b.innerHTML = `
      <p class="note">The AI always sees: this summary, the facts below, matching lorebook entries, and the latest ${kept} message${kept === 1 ? "" : "s"} word-for-word. Edit anything it got wrong.</p>
      ${field("Story so far", `<textarea id="mSum" style="min-height:160px" placeholder="Nothing summarized yet. This fills in automatically as the chat grows.">${esc(ch.summary)}</textarea>`)}
      <button class="btn" id="mSumSave">Save summary</button>
      <div class="group"><h3>Facts</h3>
        <p class="hint" style="margin:0;color:var(--muted);font-size:13px">Pinned facts (★) are never changed by the AI.</p>
        <div id="mFacts" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="row" style="align-items:center"><input id="mNew" style="flex:3;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)" placeholder="Add a fact…"><button class="btn" id="mAdd" style="flex:1">Add</button></div>
        <button class="btn" id="mRefresh">Update facts from recent chat</button>
      </div>
      <div class="group"><h3>Lore active right now</h3>
        <p class="note">${lore.length ? lore.map(l => esc(l.keys)).join("<br>") : "None. Lore loads when its keywords appear in the last few messages."}</p>
      </div>`;
    const draw = () => {
      const box = $("mFacts"); box.innerHTML = ch.facts.length ? "" : '<p class="note">No facts yet. They build up automatically every few replies.</p>';
      ch.facts.forEach((f, i) => {
        const d = document.createElement("div"); d.className = "fact" + (f.pin ? " pinned" : "");
        d.innerHTML = `<span>${esc(f.t)}</span><button class="pin" aria-label="${f.pin ? "Unpin" : "Pin"}">${f.pin ? "★" : "☆"}</button><button aria-label="Remove">✕</button>`;
        const [pin, rm] = d.querySelectorAll("button");
        pin.onclick = async () => { f.pin = !f.pin; await saveChat(); draw(); };
        rm.onclick = async () => { ch.facts.splice(i, 1); await saveChat(); draw(); };
        box.appendChild(d);
      });
    };
    draw();
    $("mSumSave").onclick = async () => { ch.summary = $("mSum").value.trim(); await saveChat(); $("mSumSave").textContent = "Saved"; };
    $("mAdd").onclick = async () => { const t = $("mNew").value.trim(); if (!t) return; ch.facts.push({ t, pin: true }); $("mNew").value = ""; await saveChat(); draw(); };
    $("mRefresh").onclick = async () => {
      const btn = $("mRefresh"); btn.disabled = true; btn.textContent = "Reading the chat…";
      try { await updateFacts(c, ch); draw(); btn.textContent = "Facts updated"; }
      catch (e) { btn.textContent = e.message; }
      finally { btn.disabled = false; }
    };
  });
}

/* Portrait sheet */
$("btnWho").onclick = () => {
  const c = char(), ch = S.chat;
  openSheet(c.name, b => {
    b.innerHTML = `<img class="big-portrait" id="pBig" alt="${esc(c.name)}">
      ${c.customPortrait ? "" : `<div class="lbl">Expressions</div><div class="mood-grid">${MOODS.map(m => `<figure><img data-m="${m}" alt="" loading="lazy"><figcaption>${m}</figcaption></figure>`).join("")}</div><p class="note">Expressions are drawn the first time they're needed, then cached by your browser.</p>`}`;
    setImg($("pBig"), portraitURL(c, ch.mood), c);
    b.querySelectorAll("[data-m]").forEach(im => setImg(im, portraitURL(c, im.dataset.m), c));
  });
};

/* More menu */
$("btnMore").onclick = () => openSheet("Options", b => {
  b.innerHTML = `<div class="menu">
    <button class="btn" id="oIll">Illustrate this moment</button>
    <button class="btn" id="oEdit">Edit character & lorebook</button>
    <button class="btn" id="oMem">View memory</button>
    <button class="btn danger" id="oReset">Start a new chat</button></div>
    <p class="note">Starting a new chat erases this conversation and its memory. Export a backup in Settings first if you want to keep it.</p>`;
  $("oIll").onclick = () => { closeSheet(); illustrate(); };
  $("oEdit").onclick = () => editChar(char(), false);
  $("oMem").onclick = openMemory;
  confirmBtn($("oReset"), "Tap again to erase this chat", async () => { S.chat = newChat(char()); await saveChat(); closeSheet(); updateStage(); renderMsgs(); });
});

function editMessage(i) {
  const m = S.chat.messages[i];
  openSheet("Edit message", b => {
    b.innerHTML = `${field("Text", `<textarea id="eTxt" style="min-height:220px">${esc(m.content)}</textarea>`)}<button class="btn primary" id="eSave">Save</button>`;
    $("eSave").onclick = async () => {
      m.content = $("eTxt").value; if (m.alts) m.alts[m.alt || 0] = m.content;
      S.openActs = null; await saveChat(); closeSheet(); renderMsgs(true);
    };
  });
}

$("btnBack").onclick = () => { if (S.busy) return; $("chat").hidden = true; $("home").hidden = false; S.charId = null; S.chat = null; renderHome(); };

/* ---------- Boot ---------- */
(async () => {
  await Store.open();
  S.settings = { ...DEFAULTS, ...((await Store.get("settings")) || {}) };
  S.chars = (await Store.get("chars")) || [];
  if (!S.chars.length && !(await Store.get("seeded"))) { S.chars = [sampleChar()]; await saveChars(); await Store.set("seeded", true); }
  renderHome();
})();
</script>
