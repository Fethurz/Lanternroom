<title>Aumadyr Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a night sky strip with the three moons, the hand-drawn map below it, and a reading panel beside it (below it on phones). */
:root{
  --bg:#130d17; --surface:#1e1623; --line:#3a2d40; --text:#f0e7dc; --muted:#ab9ca8; --accent:#e8a95b;
  --sea:#1d3240; --sea2:#24404f; --grass:#77803f; --grass2:#8c9446; --snow:#d3dbe0; --rock:#2f2c36; --sand:#c2a265; --lava:#d9772f;
  --d1:#6fdc6a; --d2:#c8d84f; --d3:#e8a95b; --d4:#e8674b; --d5:#c43b6b;
  --display:"Young Serif", Georgia, serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.5;margin:0;padding-block:18px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0;max-width:60ch}
.sky{position:relative;border:1px solid var(--line);border-radius:14px;background:radial-gradient(120% 140% at 50% 0%, #2a1f38 0%, #150f1c 60%, #0f0a13 100%);overflow:hidden}
.sky svg{display:block;width:100%;height:auto}
.skycap{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label{font-size:13px;color:var(--muted)}
button,select{font-family:var(--body);font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-height:36px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#1a1008;border-color:var(--accent);font-weight:700}
button:focus-visible,select:focus-visible,.spot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--sea);-webkit-overflow-scrolling:touch;max-height:82vh}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.zoom svg{width:220%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;position:sticky;top:max(12px, env(safe-area-inset-top, 0px))}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 2px}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.panel p{margin:8px 0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line)}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chapters{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ch{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.ch:hover{border-color:var(--line)}
.ch.on{border-color:var(--accent);background:rgba(232,169,91,.08)}
.ch b{font-family:var(--display);font-weight:400;color:var(--accent);text-align:center}
.ch input{width:18px;height:18px;accent-color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.inset{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sea)}
.inset svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.spot{cursor:pointer;outline:none}
.spot .ring{transition:r .15s}
.spot:hover .ring,.spot.sel .ring{r:26}
.lbl{font-family:var(--display);font-size:30px;fill:#f4ecdf;paint-order:stroke;stroke:#140d12;stroke-width:7px;stroke-linejoin:round}
.lbl.big{font-size:44px;letter-spacing:.04em}
.lbl.sm{font-size:24px}
.danger .dglow{opacity:.55}
.dglow{opacity:0;transition:opacity .25s;pointer-events:none}
.chfade .spot{opacity:.35}
.chfade .spot.inch{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes drift{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.shards{transform-origin:600px 70px;animation:drift 90s linear infinite}
</style>

 ["valdrenn","Valdrenn","Human kingdom",705,175,3,4,"big","Jarl-queen Astrid Hrafnsdottir, chosen by Selune's priestesses","Astrid and her priestesses Helka, Runa and Solveig; Brynja of The Full Horn; Moon Knights","Moonmoths, moonhounds, frost drakes, snowmaw seals on the coast","Strict, but swallowing a foe beaten in a fair fight is honourable ('feeding Halvra')","Norse-like longhalls, ice mages, duels and full-moon festivals. Honey mead and smoked seal. Old wars nearly wiped out the Jotun of the far north."],

 ["ochre","The Ochre Waste","Desert",790,1270,4,8,"big","Nobody","Ozhara, nomads, snubs","Dune-leeches, sand drakes, giant scorpions","None: survive","Heat and glare, and the empty basin where the Anubian kingdom vanished overnight."],
 ["ozhara","Ozhara","Elder Coil",610,1185,5,8,"sm","","Ozhara","","Swallows whole caravans; weeks inside","An elder world serpent who speaks in riddles about a god before the pantheon."],
 ["snubhaven","Snubhaven","Oasis camp",610,1370,2,8,"","Rasha 'Mother' Sand","Rasha, Renn's people, snubs of every mix","Bandits and bigots","Rasha eats raiders","Patched tents around an oasis: a refuge for half-breeds of every race."]
];
const DIRE = [
 ["Keiran mountains","North: snow and high passes, mountain-dwelling Dire.","M 30 20 L 370 20 L 360 90 L 40 95 Z","#cfd7dc"],
 ["Fir plains and the swamp","West: temperate flatlands, the swamp on the far edge (mirebelly toads, swamp wyrms).","M 30 95 L 130 95 L 130 230 L 30 230 Z","#7e8a46"],
 ["The Maag and Maaghold","Centre: the savanna capital region; Maaghold of stone and redwood, the arena, Nalaya.","M 130 95 L 280 95 L 280 230 L 130 230 Z","#b39a4f"],
 ["Jilnan jungle","East: dense jungle, agile Dire.","M 280 95 L 370 90 L 370 230 L 280 230 Z","#4f7a3c"],
 ["Hiraki desert","South: sand and heat; sand drakes.","M 30 230 L 370 230 L 360 290 L 40 290 Z","#c9a764"]
];
let sel = null, danger = false, ch = 0, visited = {};
try { visited = JSON.parse(localStorage.getItem("aum_visited") || "{}"); } catch (e) {}
const NS = "http://www.w3.org/2000/svg";
function el(t, a, p) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
const spots = document.getElementById("spots"), dl = document.getElementById("dangerLayer");
P.forEach(p => {
  const [id, name, kind, x, y, d, c, size] = p;
  el("circle", { cx: x, cy: y, r: size === "big" ? 150 : 90, fill: DCOL[d], class: "dglow", filter: "url(#soft)" }, dl);
  const g = el("g", { class: "spot", tabindex: 0, role: "button", "aria-label": name, "data-id": id }, spots);
  el("circle", { cx: x, cy: y, r: 46, fill: "transparent" }, g);
  el("circle", { cx: x, cy: y, r: 20, fill: "#140d12", stroke: "#e8a95b", "stroke-width": 4, class: "ring" }, g);
  el("circle", { cx: x, cy: y, r: 8, fill: DCOL[d] }, g);
  const t = el("text", { x: x, y: y - 32, "text-anchor": "middle", class: "lbl" + (size === "big" ? " big" : size === "sm" ? " sm" : "") }, g);
  t.textContent = name;
  g.addEventListener("click", () => pick(id));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(id); } });
});
const selCh = document.getElementById("selCh");
CH.forEach(([n, t]) => { const o = document.createElement("option"); o.value = n; o.textContent = n + ". " + t; selCh.appendChild(o); });
function saveV() { try { localStorage.setItem("aum_visited", JSON.stringify(visited)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function chaptersHTML() {
  return `<h2>The journey</h2><p class="muted">Nine chapters, one region each. Tick the ones you've played; tap a chapter to light up its places.</p><div class="chapters">` +
    CH.map(([n, t, g]) => `<div class="ch${ch === n ? " on" : ""}" data-ch="${n}"><b>${n}</b><span><span>${esc(t)}</span><br><span class="muted">${esc(g)}</span></span><input type="checkbox" aria-label="Played chapter ${n}" data-v="${n}" ${visited[n] ? "checked" : ""}></div>`).join("") + `</div>`;
}
function placeHTML(p) {
  const [id, name, kind, x, y, d, c, size, rule, people, mons, vore, about] = p;
  let h = `<div class="kind">${esc(kind)}</div><h2>${esc(name)}</h2><span class="pill"><i style="background:${DCOL[d]}"></i>${DNAME[d]}</span>`;
  if (c) h += ` <span class="pill">Chapter ${c}</span>`;
  if (about) h += `<p>${esc(about)}</p>`;
  h += `<dl class="facts">`;
  if (rule) h += `<dt>Rules</dt><dd>${esc(rule)}</dd>`;
  if (people) h += `<dt>Who</dt><dd>${esc(people)}</dd>`;
  if (mons) h += `<dt>Beasts</dt><dd>${esc(mons)}</dd>`;
  if (vore) h += `<dt>Vore</dt><dd>${esc(vore)}</dd>`;
  h += `</dl>`;
  if (id === "direplains") {
    h += `<div class="inset"><svg viewBox="0 0 400 310" role="img" aria-label="Regions of the Direplains">` +
      DIRE.map((r, i) => `<path d="${r[2]}" fill="${r[3]}" stroke="#140d12" stroke-width="3" data-r="${i}" style="cursor:pointer"/>`).join("") +
      `<text x="200" y="305" text-anchor="middle" font-size="12" fill="#ab9ca8">The Alteran ocean surrounds it all</text></svg></div><p class="muted" id="direInfo">Tap a region of the Direplains.</p>`;
  }
  h += `<p><button id="back">Back to the journey</button></p>`;
  return h;
}
const panel = document.getElementById("panel");
function draw() {
  const p = P.find(q => q[0] === sel);
  panel.innerHTML = p ? placeHTML(p) : chaptersHTML();
  document.querySelectorAll(".spot").forEach(g => {
    const q = P.find(z => z[0] === g.dataset.id);
    g.classList.toggle("sel", g.dataset.id === sel);
    g.classList.toggle("inch", ch > 0 && q[6] === ch);
  });
  document.getElementById("map").classList.toggle("chfade", ch > 0);
  const b = document.getElementById("back"); if (b) b.onclick = () => { sel = null; draw(); };
  panel.querySelectorAll("[data-ch]").forEach(r => r.addEventListener("click", e => { if (e.target.tagName === "INPUT") return; ch = ch === +r.dataset.ch ? 0 : +r.dataset.ch; selCh.value = ch; draw(); moons(); }));
  panel.querySelectorAll("[data-v]").forEach(c => c.addEventListener("change", () => { visited[c.dataset.v] = c.checked; saveV(); moons(); }));
  panel.querySelectorAll("[data-r]").forEach(r => r.addEventListener("click", () => { const d = DIRE[+r.dataset.r]; document.getElementById("direInfo").innerHTML = `<b>${esc(d[0])}</b>: ${esc(d[1])}`; }));
}
function pick(id) { sel = id; draw(); if (window.innerWidth < 900) panel.scrollIntoView({ behavior: "smooth", block: "start" }); }
selCh.addEventListener("change", () => { ch = +selCh.value; draw(); moons(); });
const bD = document.getElementById("bDanger");
bD.addEventListener("click", () => { danger = !danger; bD.setAttribute("aria-pressed", danger); document.getElementById("map").classList.toggle("danger", danger); legend(); });
const bZ = document.getElementById("bZoom"), mb = document.getElementById("mapbox");
bZ.addEventListener("click", () => { const z = !mb.classList.contains("zoom"); mb.classList.toggle("zoom", z); bZ.setAttribute("aria-pressed", z); bZ.textContent = z ? "Zoom out" : "Zoom in"; });
let blood = false;
document.getElementById("tide").addEventListener("click", () => { blood = !blood; document.getElementById("tideDisc").setAttribute("fill", blood ? "url(#mBlood)" : "url(#mTide)"); document.getElementById("tideCap").textContent = blood ? "The Blood Moon: karma swings hardest" : "Selune's tide moon (tap: Blood Moon)"; });
function moons() {
  // The third moon grows as the journey goes on: the furthest of the picked chapter and the played ones.
  const played = Object.keys(visited).filter(k => visited[k]).map(Number);
  const far = Math.max(ch, played.length ? Math.max(...played) : 0);
  const r = 14 + far * 3.2;
  document.getElementById("hole").setAttribute("r", r);
  document.getElementById("holeRing").setAttribute("r", r + 5);
  document.getElementById("holeCap").textContent = far >= 9 ? "The third moon is opening" : "The third moon";
}
function legend() {
  document.getElementById("legend").innerHTML = danger ? DNAME.slice(1).map((n, i) => `<span><span class="pill"><i style="background:${DCOL[i + 1]}"></i>${n}</span></span>`).join("") : `<span>Tap "Danger levels" to tint places by how deadly they are. Tap the tide moon for the Blood Moon. The third moon grows as you play.</span>`;
}
draw(); moons(); legend();
</script>
