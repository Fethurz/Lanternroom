<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#16131d">
<title>Lanternroom</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%2250%25%22%20cy%3D%2258%25%22%20r%3D%2250%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffd98a%22%20stop-opacity%3D%22.95%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23f0a24a%22%20stop-opacity%3D%22.35%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23e8a95b%22%20stop-opacity%3D%220%22/%3E%3C/radialGradient%3E%3ClinearGradient%20id%3D%22f%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23fff6cf%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23ffc35a%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff7a2e%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2237%22%20r%3D%2226%22%20fill%3D%22url%28%23g%29%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%227%22%20r%3D%224.2%22%20fill%3D%22none%22%20stroke%3D%22%23c9bbd9%22%20stroke-width%3D%222.6%22/%3E%3Cpath%20d%3D%22M20%2014h24l-3%206H23z%22%20fill%3D%22%234a3f5c%22/%3E%3Crect%20x%3D%2219%22%20y%3D%2220%22%20width%3D%2226%22%20height%3D%2230%22%20rx%3D%225%22%20fill%3D%22%232a2433%22%20stroke%3D%22%238d7ea3%22%20stroke-width%3D%222.6%22/%3E%3Cpath%20d%3D%22M32%2026c4%205%206%208%206%2012a6%206%200%200%201-12%200c0-4%202-7%206-12z%22%20fill%3D%22url%28%23f%29%22/%3E%3Crect%20x%3D%2216%22%20y%3D%2250%22%20width%3D%2232%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234a3f5c%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a one-screen phone app. Home = cast list; Chat = scene background, portrait header, bubbles, composer. Dark by design (night reading). */
:root{
  --bg:#16131d; --surface:#211d2b; --surface-2:#2c2739; --line:#3a3449;
  --fg:#efeaf6; --muted:#a39bb6; --accent:#e8a95b; --accent-ink:#2a1a06;
  --user:#3a3150; --danger:#e2766f; --ok:#8fcf9f;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 12px;font-size:13px}
.icon{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg);flex:none}
.icon:active{background:var(--surface-2)}
.icon svg{width:22px;height:22px}

#app{height:100%;padding-top:env(safe-area-inset-top,0px)}
section.screen{height:100%;display:flex;flex-direction:column;position:relative}

/* Home */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.topbar h1{font:400 28px/1.1 var(--f-display);margin:0;letter-spacing:.01em}
.topbar h1 span{color:var(--accent)}
.home-scroll{flex:1;overflow-y:auto;padding:8px 16px 24px}
.tagline{color:var(--muted);margin:0 0 16px;font-size:14px}
#charList{display:grid;gap:12px}
.char-card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.char-card img,.char-card .ph{width:72px;height:90px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.char-card .name{font:400 19px/1.2 var(--f-display)}
.char-card .snip{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.char-card > div{min-width:0}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.home-actions .btn{flex:1;white-space:nowrap;padding-inline:12px}
.ph{display:grid;place-items:center;font:400 28px var(--f-display);color:var(--accent)}

/* Chat */
#chat{background:var(--bg)}
#scene{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
#scene.on{opacity:.38}
#chat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,19,29,.55),rgba(22,19,29,.2) 30%,rgba(22,19,29,.85));pointer-events:none;z-index:0}
.chatbar,#msgs,#composer,#status{position:relative;z-index:1}
.chatbar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;background:rgba(22,19,29,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chatbar .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:2px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:2px solid var(--accent);flex:none;transition:opacity .4s}
.who .t{min-width:0}
.who .n{font:400 18px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood-chip{display:inline-block;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--accent);margin-right:4px;text-transform:capitalize}
#msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.assistant{align-self:flex-start;background:rgba(33,29,43,.92);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:6px}
.msg em.act{color:#c9bfdc;font-style:italic}
.msg .q{color:#fff3e2}
.msg.typing{color:var(--muted)}
.msg.img{padding:6px;background:var(--surface);border:1px solid var(--line);align-self:center;max-width:94%}
.msg.img img{display:block;border-radius:12px;width:100%;min-height:120px;background:var(--surface-2)}
.msg.img .mrow{margin:2px 0 -2px}
.msg.img .cap{font-size:12px;color:var(--muted);padding:6px 6px 2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.swipe{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.swipe button{padding:4px 10px;border-radius:999px;color:var(--accent);font-weight:700}
.swipe button:disabled{opacity:.3}
#status{font-size:12px;color:var(--muted);padding:0 16px 4px;min-height:0}
#status.err{color:var(--danger)}
#composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(22,19,29,.9);border-top:1px solid var(--line)}
#input{flex:1;min-width:0;resize:none;max-height:calc(45vh / var(--z, 1));min-height:44px;transition:height .18s ease;padding:10px 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);line-height:1.4}
#send{background:var(--accent);color:var(--accent-ink)}
#send:disabled{opacity:.5}

/* Sheets */
#sheet{position:fixed;inset:0;z-index:10;background:rgba(8,6,12,.6);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 20px}
.panel-head h2{margin:0;font:400 22px var(--f-display)}
#sheetBody{overflow-y:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.field textarea{min-height:90px;resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.group{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.group h3{margin:0;font:400 18px var(--f-display)}
.fact{display:flex;align-items:flex-start;gap:6px;padding:8px 6px 8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.fact.pinned{border-color:var(--accent)}
.fact span{flex:1;min-width:0;padding-top:3px}
.fact button{width:32px;height:32px;border-radius:8px;color:var(--muted);flex:none}
.fact.pinned .pin{color:var(--accent)}
.lore{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.lore input,.lore textarea{background:var(--surface)}
.big-portrait{width:100%;border-radius:16px;background:var(--surface-2);aspect-ratio:4/5;object-fit:cover}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;border-radius:12px;padding:14px 16px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood-grid figure{margin:0;text-align:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.mood-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.pick button{display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:12px;border:2px solid transparent;color:var(--muted);font-size:12px;align-items:center}
.pick button.sel{border-color:var(--accent);color:var(--accent)}
.pick{grid-template-columns:repeat(2,1fr)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.badge{display:inline-block;font:700 10px/1.6 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:middle}
.persona-bar{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;margin-bottom:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:14px;color:var(--muted)}
.persona-bar b{color:var(--fg)}
.persona-bar .chg{margin-left:auto;color:var(--accent);font-weight:700}
.msg-set{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:88%}
.msg-set .msg{max-width:100%}
.spk{display:flex;align-items:center;gap:8px;margin-bottom:4px;font:400 15px/1.2 var(--f-display);color:var(--accent)}
.spk img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.xrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.xbtn{font-size:13px;font-weight:700;color:var(--accent);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.xbtn:disabled{opacity:.6}
#speakers{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;padding:6px 10px 2px}
.chip{flex:none;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.checkrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.checkrow img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none}
.checkrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:8px}
.listrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%}
.listrow .grow{flex:1;min-width:0}
.listrow .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow.on{border-color:var(--accent)}
.kind-opt{display:flex!important;flex-direction:column;align-items:flex-start!important;gap:2px;text-align:left}
.kind-opt small{font-weight:400;color:var(--muted);font-size:13px}
.gen-opt{border-color:var(--accent)!important;color:var(--accent)!important}
.gen-wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 8px}
.gen-wait .lantern{width:72px;height:112px}
.gen-sum{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.gen-sum h3{margin:0 0 6px;font-family:var(--f-display);color:var(--accent)}
.gen-sum p{margin:0 0 8px}
.gen-tags{display:flex;flex-wrap:wrap;gap:4px}
details.gen-sec{border-bottom:1px solid var(--line)}
details.gen-sec summary{cursor:pointer;font-weight:700;padding:11px 0;list-style:none;min-height:34px}
details.gen-sec summary::-webkit-details-marker{display:none}
details.gen-sec summary::after{content:"›";float:right;color:var(--muted);transition:transform .2s}
details.gen-sec[open] summary::after{transform:rotate(90deg)}
.gen-body{padding:0 0 10px;font-size:14px;color:var(--fg)}
.gen-body p{margin:0 0 10px}
.cast{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cast .row input,.cast select,.cast textarea{background:var(--surface)}
.range-row{display:flex;flex-direction:column;gap:4px}
.range-row .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.range-row .top b{font-size:15px}
.range-row .val{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.range-row .desc{font-size:13px;color:var(--muted)}
.range-row input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:6px}
.warn{font-size:13px;color:#f1c56b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details.adv summary{cursor:pointer;font-weight:700;color:var(--accent);padding:10px 0;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] .advbody{display:flex}
.advbody{flex-direction:column;gap:14px}
/* ---- polish ---- */
body{background:radial-gradient(120% 70% at 50% -10%,#2a2140 0%,var(--bg) 55%) fixed,var(--bg)}
.btn{transition:transform .12s ease,background-color .2s,box-shadow .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active,.icon:active,.chip:active,.xbtn:active,.tab:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(180deg,#f2b96e,#d9944a);box-shadow:0 4px 18px -6px rgba(232,169,91,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:hover{border-color:#4d4560}
.icon{transition:transform .12s ease,background-color .2s}
.topbar h1{text-shadow:0 0 24px rgba(232,169,91,.25)}
.char-card{background:linear-gradient(160deg,var(--surface) 0%,#1b1824 100%);transition:transform .15s ease,border-color .2s,box-shadow .2s}
.char-card:active{transform:scale(.985)}
.char-card:hover{border-color:#4d4560;box-shadow:0 8px 24px -14px rgba(0,0,0,.7)}
.char-card img{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 6px 16px -8px rgba(0,0,0,.8)}
.avatar{box-shadow:0 0 0 3px rgba(22,19,29,.8),0 0 16px -2px var(--ring,var(--accent));border-color:var(--ring,var(--accent));transition:border-color .5s,box-shadow .5s}
#sheet{animation:fadeIn .18s ease}
.panel{animation:slideUp .26s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 50px -20px rgba(0,0,0,.8)}
.panel-head::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.panel-head{position:relative}
.msg.enter,.msg-set.enter{animation:msgIn .28s ease-out}
.msg.user{background:linear-gradient(160deg,#43395d,#352d4a)}
.msg.assistant{box-shadow:0 6px 18px -12px rgba(0,0,0,.8)}
.who-l{font:700 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;opacity:.9}
.msg.user .who-l{color:#cfc4ec;text-align:right}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
#input{transition:border-color .2s,box-shadow .2s,height .18s ease}
#btnMin{display:none;width:34px;height:34px;color:var(--muted)}
#composer.open #btnMin{display:inline-grid}
#composer.open{flex-wrap:wrap;row-gap:6px}
#composer.open #input{order:-1;flex:1 1 100%;width:100%}
#composer.open #btnMin{margin-left:auto}
#composer:not(.open) #input{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.msg.blank-open{border-style:dashed;opacity:.9}
/* v1.12: more text on screen */
#msgs{gap:8px;padding:12px 10px 6px}
#msgs .msg{font-size:14.5px;line-height:1.42;padding:8px 12px;border-radius:16px}
#msgs .msg .who-l{font-size:11px}
.rtabs,.ltabs{margin-bottom:6px}
.rtabs .tabs,.ltabs{flex-wrap:wrap}
.rtabs textarea{width:100%;margin-top:6px}
/* v1.12: compact bot grid, colors per kind */
:root{--k-character:#e8a95b;--k-world:#4fd1c5;--k-group:#c49bff}
#charList{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
#charList > .note{grid-column:1/-1}
#charList .char-card{display:flex!important;flex-direction:column;gap:0;padding:0;overflow:hidden;border-width:1px;border-top:3px solid var(--kc)}
#charList .char-card.k-character{--kc:var(--k-character)}#charList .char-card.k-world{--kc:var(--k-world)}#charList .char-card.k-group{--kc:var(--k-group)}
#charList .char-card .ph-wrap{position:relative}
#charList .char-card img,#charList .char-card .ph{width:100%;height:auto;aspect-ratio:4/5;border-radius:0;display:block}
#charList .char-card .kind-pill{position:absolute;left:5px;bottom:5px;font-size:9px;font-weight:700;letter-spacing:.02em;padding:0 6px;border-radius:999px;background:rgba(22,19,29,.82);color:var(--kc);border:1px solid color-mix(in srgb,var(--kc) 45%,transparent)}
#charList .char-card .cbody{padding:4px 6px 6px;min-width:0}
#charList .char-card .name{font-size:12.5px!important;line-height:1.2;padding-right:0!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg)}
#charList .char-card .ticons{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;font-size:11px;line-height:1}
#charList .char-card .more{top:0!important;right:0!important;width:30px!important;height:30px!important;background:rgba(22,19,29,.6);color:var(--fg)!important}
.chip .ti{margin-right:4px}
#btnAmb .x{display:none}
#btnAmb.muted .x{display:inline}
#btnAmb.muted .w1,#btnAmb.muted .w2{display:none}
#btnAmb.muted{color:var(--muted)}
#sAccount input{width:100%;margin-top:6px}
/* desktop: centred column, room around it */
html.wide body{background:radial-gradient(ellipse at 50% 0%,#231d30 0%,var(--bg) 70%)}
html.wide #app{max-width:860px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px -20px rgba(0,0,0,.8)}
html.wide #charList{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
html.wide .panel{max-width:720px;border-radius:22px;margin-bottom:24px;border-bottom:1px solid var(--line)}
html.wide #sheet{align-items:center}
.desk-only{display:none}
html.wide .desk-only{display:inline}
.snd-drop{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s,background-color .2s}
.snd-drop.over{border-color:var(--accent);background:rgba(232,169,91,.08)}
details.snd-sec{border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin-top:8px}
details.snd-sec summary{cursor:pointer;font-weight:700;padding:8px 0;min-height:34px}
.linkish{color:var(--accent);text-decoration:underline;padding:0;font-size:inherit}
.snd-built{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.snd-built a{color:var(--accent)}
.snd-help{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.tab .mine{font-weight:400;opacity:.8}
#spTypes .lbl{margin-top:8px}
.snd-row{display:grid!important;grid-template-columns:34px minmax(0,1fr) auto 34px;gap:8px!important;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.snd-row .snd-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.snd-row select{max-width:120px;padding:6px 8px;border-radius:10px;font-size:13px}
.snd-row .icon{width:34px;height:34px}
.snd-row > *{flex:none!important;min-width:0}
.snd-row .snd-name{text-align:left}
.msg.blank-open p{margin:4px 0 0}
#input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,169,91,.18)}
#send{box-shadow:0 4px 14px -4px rgba(232,169,91,.6);transition:transform .12s,opacity .2s}
#send.busy{animation:pulse 1.2s infinite ease-in-out}
#btnCont{color:var(--accent)}
.chip{transition:background-color .2s,color .2s,transform .12s}
.cx{font-weight:700}
#msgs .msg{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);color:var(--fg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20;animation:toast 1.6s ease forwards;pointer-events:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-width:36px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:700;font-size:13px;transition:background-color .2s,color .2s,transform .12s}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tab.rm{margin-left:auto;color:var(--danger)}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.searchrow input{flex:1;min-width:0;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.searchrow input:focus{outline:none;border-color:var(--accent)}
.tagrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.tagrow:empty{display:none}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags span{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.xnote{font-size:13px;color:var(--accent);text-align:right}
.xnote.err{color:var(--danger)}
/* lantern */
.lantern{display:inline-block;overflow:visible}
.lantern .flame-g{transform-origin:32px 62px;animation:flick 1.6s infinite ease-in-out}
.lantern .halo{transform-origin:32px 56px;animation:halo 2.3s infinite ease-in-out}
.lantern .smoke{opacity:0}
.lantern.out .flame-g{animation:none;transform:scale(0,0);opacity:0;transition:transform .45s ease-in,opacity .45s}
.lantern.out .halo{animation:none;opacity:0;transition:opacity .6s}
.lantern.out .smoke{animation:smoke 1.6s ease-out}
.lantern.relit .flame-g{animation:relight .55s ease-out,flick 1.6s .55s infinite ease-in-out}
.lantern.relit .halo{animation:haloIn .7s ease-out,halo 2.3s .7s infinite ease-in-out}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}15%{transform:scale(.95,1.07) skewX(-3deg)}30%{transform:scale(1.04,.94) skewX(2deg)}45%{transform:scale(.98,1.05) skewX(-1deg)}60%{transform:scale(1.02,.97) skewX(3deg)}80%{transform:scale(.96,1.04) skewX(-2deg)}}
@keyframes halo{0%,100%{opacity:.9;transform:scale(1)}20%{opacity:.7;transform:scale(.96)}35%{opacity:1;transform:scale(1.02)}55%{opacity:.8;transform:scale(1.04)}70%{opacity:.95;transform:scale(.99)}}
@keyframes smoke{0%{opacity:0;transform:translateY(6px)}25%{opacity:.75}100%{opacity:0;transform:translateY(-18px) scaleX(1.4)}}
@keyframes relight{0%{transform:scale(0,0)}55%{transform:scale(1.35,1.45)}100%{transform:scale(1,1)}}
@keyframes haloIn{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.2)}100%{opacity:.9;transform:scale(1)}}
.logo{display:flex;align-items:center;gap:8px;padding:0;color:inherit}
.logo .lantern{width:26px;height:40px;margin-top:-4px}
.topbar h1{transition:text-shadow .6s,opacity .6s}
.logo.dark h1{text-shadow:none;opacity:.75}
.typing-l{display:inline-flex;align-items:center;gap:8px}
.typing-l .lantern{width:24px;height:38px;margin:-6px 0;flex:none}
.lantern .sparks circle{opacity:0;fill:#ffd98a}
.lantern.seq .flame-g{animation:seqFlame 3.6s infinite ease-in-out}
.lantern.seq .halo{animation:seqHalo 3.6s infinite ease-in-out}
.lantern.seq .sparks circle{animation:seqSpark 3.6s infinite ease-out}
.lantern.seq .sparks circle:nth-child(2){animation-delay:.08s}.lantern.seq .sparks circle:nth-child(3){animation-delay:.16s}.lantern.seq .sparks circle:nth-child(4){animation-delay:.05s}
.lantern.seq .smoke{animation:seqSmoke 3.6s infinite ease-out}
.lantern.lit .halo{filter:drop-shadow(0 0 6px rgba(255,200,110,.9));animation:haloIn .7s ease-out both}
.lantern.lit .flame-g{animation:relight .55s ease-out,flick 1.6s .55s infinite ease-in-out}
@keyframes seqFlame{0%,28%{transform:scale(0,0)}31%{transform:scale(.35,.25)}33%,41%{transform:scale(0,0)}46%{transform:scale(.5,.6)}52%{transform:scale(1,1.06)}58%{transform:scale(.95,1.05) skewX(-3deg)}64%{transform:scale(1.04,.95) skewX(2deg)}70%{transform:scale(1,1)}76%{transform:scale(.45,.35)}80%,100%{transform:scale(0,0)}}
@keyframes seqHalo{0%,44%{opacity:0;transform:scale(.6)}52%{opacity:.9;transform:scale(1)}70%{opacity:.85}78%,100%{opacity:0;transform:scale(.7)}}
@keyframes seqSpark{0%,8%{opacity:0;transform:none}11%{opacity:1;transform:translate(var(--dx),var(--dy))}15%{opacity:0;transform:translate(calc(var(--dx)*1.6),calc(var(--dy)*1.6))}24%{opacity:0;transform:none}28%{opacity:1;transform:translate(calc(var(--dx)*-1),var(--dy))}32%{opacity:0;transform:translate(calc(var(--dx)*-1.6),calc(var(--dy)*1.6))}38%{opacity:0;transform:none}41%{opacity:1;transform:translate(var(--dx),calc(var(--dy)*.7))}45%,100%{opacity:0}}
@keyframes seqSmoke{0%,78%{opacity:0;transform:translateY(6px)}84%{opacity:.6}96%,100%{opacity:0;transform:translateY(-16px) scaleX(1.4)}}
.mact{margin-left:auto;padding:0 8px;height:24px;border-radius:8px;color:var(--muted);font-weight:700;letter-spacing:1px;display:inline-flex;align-items:center}
.mact:active{background:var(--surface-2)}
.mrow{display:flex;align-items:center;gap:2px;margin-top:4px;margin-bottom:-6px;margin-right:-8px}
.mrow .swipe{margin-top:0}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 45%,#2a2140 0%,#16131d 70%);transition:opacity .6s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .sp{display:flex;flex-direction:column;align-items:center;gap:18px}
#splash .lantern{width:84px;height:131px;animation:spIn 1s ease-out both}
#splash .sp-t{font:400 34px var(--f-display);letter-spacing:.02em;display:flex}
#splash .sp-t span{display:inline-block;animation:letterIn .5s ease-out both}
#splash .sp-t .a{color:var(--accent);text-shadow:0 0 24px rgba(232,169,91,.4)}
@keyframes spIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
@keyframes letterIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* home tabs & card menu */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;margin-bottom:10px}
.seg button{flex:1;padding:7px 8px;border-radius:999px;color:var(--muted);font-weight:700;font-size:14px;transition:background-color .2s,color .2s}
.seg button.on{background:var(--surface-2);color:var(--fg);box-shadow:0 2px 8px -4px rgba(0,0,0,.6)}
.char-card{position:relative;cursor:pointer}
#charList{gap:8px}
.char-card{grid-template-columns:48px 1fr;gap:10px;padding:8px 10px}
.char-card img,.char-card .ph{width:48px;height:60px;border-radius:8px}
.char-card .name{font-size:16px}
.char-card .snip{-webkit-line-clamp:1;font-size:13px;margin-top:1px}
.char-card .tags{margin-top:3px}
.char-card .tags span{font-size:10px;padding:0 6px}
.seg button{font-size:13px;padding:7px 4px}
.char-card .more{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.char-card .more:active{background:var(--surface-2)}
.char-card .name{padding-right:34px}
.fav-star{color:var(--accent);margin-right:4px}
/* images */
#attach{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:8px 12px 0}
#attach img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.uimg{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:4px 0 6px;object-fit:cover}
/* sound effects */
.sfx{display:inline-block;cursor:pointer;white-space:normal}
.fxi{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;margin-left:3px}
.fxi svg{width:100%;height:100%;overflow:visible;display:block}
.fx-gas svg{animation:fxDrift 3.2s infinite ease-in-out}
.fx-bubbles svg{animation:fxRise 2.4s infinite ease-in-out}
.fx-hit svg,.fx-boom svg{animation:fxThrob 1.8s infinite ease-in-out}
.fx-kiss svg,.fx-beat svg{animation:fxBeat 1.1s infinite ease-in-out}
.fx-zap svg{animation:fxZap 1.6s infinite steps(1)}
.fx-magic svg{animation:fxTwinkle 2.2s infinite ease-in-out}
.fx-fire svg{animation:flick 1.2s infinite ease-in-out;transform-origin:50% 90%}
.fx-liquid svg{animation:fxDrip 2s infinite ease-in}
.fx-wind svg{animation:fxSlide 2.4s infinite ease-in-out}
.fx-wave svg{animation:fxPulse 1.6s infinite ease-in-out}
.fx-zzz svg{animation:fxFloat 2.6s infinite ease-in-out}
.fx-stomp svg,.fx-crack svg{animation:fxShake 2.6s infinite}
.fx-shit svg,.fx-shitbones svg,.fx-condom svg{animation:fxSquish 2.6s infinite ease-in-out;transform-origin:50% 92%}
.fx-cum svg{animation:fxDrip 2s infinite ease-in}
.fx-cumbub svg{animation:fxRise 2.4s infinite ease-in-out}
.fx-sex svg{animation:fxBeat 1.1s infinite ease-in-out}
@keyframes fxSquish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.07,.9)}}
.fxp{position:fixed;left:0;top:0;width:14px;height:14px;pointer-events:none;z-index:30}
.fxp svg{width:100%;height:100%;overflow:visible;display:block}
.fxring{position:fixed;border:2px solid currentColor;border-radius:50%;pointer-events:none;z-index:30}
@keyframes fxDrift{0%,100%{transform:translate(0,0);opacity:.85}50%{transform:translate(2px,-3px);opacity:.55}}
@keyframes fxRise{0%{transform:translateY(2px);opacity:.5}50%{opacity:1}100%{transform:translateY(-3px);opacity:.5}}
@keyframes fxThrob{0%,100%{transform:scale(.9)}50%{transform:scale(1.12)}}
@keyframes fxBeat{0%,40%,100%{transform:scale(1)}20%{transform:scale(1.22)}30%{transform:scale(1.05)}}
@keyframes fxZap{0%,100%{opacity:1}30%{opacity:.3}35%{opacity:1}60%{opacity:.5}}
@keyframes fxTwinkle{0%,100%{transform:scale(.85) rotate(0);opacity:.7}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
@keyframes fxDrip{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(3px);opacity:.3}}
@keyframes fxSlide{0%,100%{transform:translateX(-1px)}50%{transform:translateX(2px)}}
@keyframes fxPulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes fxFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-3px)}}
@keyframes fxShake{0%,90%,100%{transform:none}92%{transform:translateX(-1px) rotate(-4deg)}95%{transform:translateX(1px) rotate(4deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,169,91,.5)}50%{box-shadow:0 0 0 8px rgba(232,169,91,0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <section id="home" class="screen">
    <header class="topbar">
      <button class="logo" id="logoBtn" aria-label="Lanternroom: tap to put out or light the lantern"><span id="logoLantern"></span><h1>Lantern<span>room</span></h1></button>
      <button class="icon" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div class="home-scroll">

/* ---------- Model API ---------- */
async function ds(messages, o = {}) {
  const st = S.settings, deep = isDS();
  const key = (deep ? st.apiKey : st.customKey).trim();
  if (!key) throw new Error("Add your API key in Settings first.");
  const think = deep && !!o.thinking;
  const body = { model: o.model || (deep ? st.model : st.customModel), messages, max_tokens: (o.maxTokens || st.maxTokens) + (think ? 4000 : 0), stream: !!o.onDelta };
  const temp = o.temperature ?? st.temperature;
  if (deep) {
    body.thinking = { type: think ? "enabled" : "disabled" };
    if (!think) {
      body.temperature = temp;
      if (!o.plain && st.freqPenalty) body.frequency_penalty = st.freqPenalty;
    } else if (!o.plain && st.topP) body.top_p = st.topP;
  } else {
    body.temperature = temp;
    if (!o.plain) {
      if (st.topP) body.top_p = st.topP;
      if (st.topK) body.top_k = st.topK;
      if (st.repPenalty) body.repetition_penalty = st.repPenalty;
      if (st.freqPenalty) body.frequency_penalty = st.freqPenalty;
    }
  }
  if (o.json) body.response_format = { type: "json_object" };
  const url = deep ? "https://api.deepseek.com/chat/completions" : st.customUrl.replace(/\/+$/, "") + "/chat/completions";
  let r;
  try {
    r = await fetch(url, { method: "POST", signal: o.signal, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key }, body: JSON.stringify(body) });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    throw new Error(`Couldn't reach ${deep ? "DeepSeek" : "the API"}. Check your internet connection and try again.`);
  }
  if (!r.ok) {
    let msg = ""; try { msg = (await r.json()).error?.message || ""; } catch {}
    const known = { 401: "The API key was rejected. Check it in Settings.", 402: "Your API balance is empty. Top up your account.", 429: "You're being rate-limited. Wait a moment and try again.", 503: "The model is overloaded right now. Try again shortly." };
    throw new Error(known[r.status] || `API error ${r.status}${msg ? ": " + msg : ""}`);
  }
  if (!o.onDelta) { const j = await r.json(); return j.choices?.[0]?.message?.content || ""; }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", full = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      const l = line.trim();
      if (!l.startsWith("data:")) continue;
      const d = l.slice(5).trim();
      if (d === "[DONE]") continue;
      try {
        const dl = JSON.parse(d).choices?.[0]?.delta || {};
        if ((dl.reasoning_content || dl.reasoning) && !full) o.onThinking?.();
        if (dl.content) { full += dl.content; o.onDelta(full); }
      } catch {}
    }
  }
  return full;
}

function parseJSONLoose(raw) {

  for (const w of words) {
    const core = w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");

    if (c.description) sys += `\n\n# About this group\n${fill(c.description, c)}`;
    sys += ms.map(m => `\n\n# ${m.name} (${ART[artOf(m)].label})\n${fill(m.description, m)}`).join("");
  } else {
    sys = `You are ${c.name} in an ongoing interactive story with ${u}. Stay fully in character. ${rules}\n\n# ${c.name}\n${fill(c.description, c)}`;
  }
  if (c.kind === "group") sys += `\n\nEnd each reply where the moment naturally ends: never close with a question, cliffhanger or prompt aimed at ${u} just to get a response.`;
  if (c.scenario) sys += `\n\n# Scenario\n${fill(c.scenario, c)}`;
  if (p.description) sys += `\n\n# About ${u} (the user's character)\n${fill(p.description, c)}`;
  if (chat.summary) sys += `\n\n# Story so far\n${chat.summary}`;
  if (chat.facts.length) sys += `\n\n# Established facts (never contradict these)\n` + chat.facts.map(f => "- " + f.t).join("\n");
  const lore = activeLore(c, chat.messages.slice(0, upto));
  if (lore.length) sys += `\n\n# World notes\n` + lore.map(l => fill(l.text, c)).join("\n");
  if (c.instructions) sys += `\n\n# Special instructions for this story\n${fill(c.instructions, c)}`;
  if ((st.globalInstr || "").trim()) sys += `\n\n# The user's instructions for every chat (always follow)\n${fill(st.globalInstr, c)}`;
  sys += `\n\n# Text colors\nThe app shows [color=NAME or #hex]text[/color] as colored text. Use it whenever instructions ask for colored text.` + (st.sfxColors ? `\n${st.sfxRules}` : "");
  const focusPart = c.kind === "group" ? " | focus: name of the character who spoke most" : "";
  sys += `\n\nAfter every reply, add one final line in exactly this format, which the app reads and hides:\n[[mood: one of ${MOODS.join("/")} | place: short name of the current location | ambience: one of ${AMB_KEYS.join("/")} | activity: one of ${ACT_KEYS.join("/")}${focusPart}]]\nambience is the background soundscape of where the scene is right now (combat while a fight is happening; indoors for a quiet room; none if nothing fits). activity is struggle while living prey is squirming inside a stomach, vore while anyone is inside a stomach or being digested and not struggling, sex during penetrative sex, oral during oral sex, otherwise none.`;
  if (c.kind === "group" && S.nextSpeaker) sys += `\n\nThis turn, only ${S.nextSpeaker} responds.`;

  const hist = chat.messages.slice(chat.summarizedUpTo || 0, upto).filter(m => m.role !== "image" && (m.content || m.image));

  const out = [];
  let imgs = 0;
  for (let i = hist.length - 1; i >= 0; i--) {
    const m = hist[i];
    let content = m.content;
    if (m.image) {
      if (imgs < 3) {
        imgs++; budget -= 3500;
        out.unshift({ role: "user", content: [{ type: "text", text: (m.content || "") + `\n[${u} shares an image. Look at it closely, work out what it shows, and react to it in character, in the context of the scene.]` }, { type: "image_url", image_url: { url: m.image } }] });

// GEN keeps the last request and result while the app is open, so closing the sheet doesn't lose work.
const GEN = { kind: "character", form: "auto", prompt: "", card: null, busy: false };
const GEN_PARTS = {
  character: [["name", "Name"], ["tags", "Tags"], ["appearance", "Look"], ["description", "Personality"], ["scenario", "Scenario"], ["firstMessages", "Openings"], ["instructions", "Rules"], ["lore", "Lore"]],
  world: [["name", "Name"], ["tags", "Tags"], ["description", "World"], ["cast", "Listings"], ["scenario", "Opening situation"], ["firstMessages", "Openings"], ["instructions", "Rules"], ["lore", "Lore"]],
  group: [["name", "Name"], ["tags", "Tags"], ["description", "Group"], ["members", "Members"], ["scenario", "Scenario"], ["firstMessages", "Openings"], ["instructions", "Rules"], ["lore", "Lore"]]

function genSpec(kind, form) {
  const formLine = f => f && f !== "auto" ? `"${f}"` : `"human", "anthro" or "feral" (whichever fits)`;
  const common = `- "name": the name
- "tags": 4-10 short lowercase tags (gender, form, genre, themes, kinks the card involves)
- "summary": 2-4 plain sentences for the user, describing what this bot is like and how chatting with it will feel
- "scenario": where and how the story starts, 80-180 words; refer to the user as {{user}}${kind === "character" ? " and the character as {{char}}" : ""}
- "firstMessages": an array of 2 different openings, 120-250 words each, in the story's voice with *actions* in asterisks and dialogue in quotes, ending where the moment naturally pauses, never with a question or prompt aimed at {{user}} just to get a reply; never speak or act for {{user}}${kind === "group" ? "; start each character's part with **Name:**" : ""}
- "startPlace": the starting location in 2-6 words
- "instructions": special rules the AI follows in every reply for this bot, as 2-8 lines each starting with "- " (how to portray it, recurring mechanics, trackers or stats, colored text for thoughts, pacing)
- "lore": 3-8 entries {"keys": "comma, separated, keywords", "text": "40-120 words"} for facts that only matter when they come up (people, places, items, abilities, mechanics)`;
  if (kind === "world") return common + `
- "description": the world itself, 250-450 words: geography, history, cultures, power, daily life, tone
- "cast": 5-10 listings {"name", "type": one of "character" | "group" | "species" | "location" | "concept", "details": 60-150 words}, covering the key characters, factions, species, places and setting rules`;
  if (kind === "group") return common + `
- "description": how the members fit together, 120-250 words: how they know each other, dynamics, tensions
- "members": 2-5 characters {"name", "artType": ${formLine(form)}, "appearance": 50-100 words, "description": personality, background and speech style, 120-220 words}`;
  return common + `
- "artType": ${formLine(form)}
- "appearance": 60-120 words: build, face, coloring, hair or fur, clothing, distinctive features
- "description": personality and background, 200-350 words: temperament, history, desires, quirks, speech style and how they treat {{user}}`;
}
const GEN_SYS = kind => `You design bots for Lanternroom, an interactive roleplay chat app. Build a complete, ready-to-play ${KINDS[kind].label.toLowerCase()} from the user's request. Follow the request closely and include every theme, kink, tone and detail they ask for. Fill everything they left unsaid with specific, vivid, consistent choices. Characters are adults; this needs no mention anywhere in the card.`;
function genNormalize(j, kind, form) {
  const str = v => typeof v === "string" ? v.trim() : Array.isArray(v) ? v.join("\n").trim() : v == null ? "" : String(v).trim();

  if ("firstMessages" in j) out.firstMessages = (Array.isArray(j.firstMessages) ? j.firstMessages : [j.firstMessages]).map(str).filter(Boolean);
  if ("instructions" in j) out.instructions = (Array.isArray(j.instructions) ? j.instructions.map(str) : parseRules(str(j.instructions))).map(x => x.replace(/^[-•]\s*/, "")).filter(Boolean).join("\n\n");

async function genCard(kind, form, prompt) {
  const j = await dsJSON([
    { role: "system", content: GEN_SYS(kind) + `\n\nRespond with only a JSON object with these keys:\n${genSpec(kind, form)}` },
    { role: "user", content: `Make this ${KINDS[kind].label.toLowerCase()}:\n${prompt}` }
  ], { temperature: 0.95, maxTokens: 7000, plain: true });

    { role: "system", content: GEN_SYS(kind) + `\n\nYou are revising a card you made. The fields are:\n${genSpec(kind, form)}\n\n${keys.length ? `Rewrite only these fields: ${keys.join(", ")}.` : "Change whichever fields the user's note needs, and only those."} Keep the rest of the card consistent with your changes. Respond with only a JSON object containing the fields you rewrote, plus an updated "summary".` },
    { role: "user", content: `Card:\n${JSON.stringify(card)}\n\nWhat the user wants changed:\n${note || "Rewrite these parts with fresh ideas, still matching the original request: " + GEN.prompt}` }

async function send() {

async function sendInner() {

async function reroll(i) { S.openActs = null; await generate(i, S.chat.messages[i], !!S.chat.messages[i].cont); }
async function generate(upto, existing, cont) {
  const c = char(), chat = S.chat;
  setBusy(true); setStatus("");
  let bubble;
  if (existing) bubble = $("msgs").querySelector(`[data-i="${upto}"]`);
  else { bubble = document.createElement("div"); bubble.className = "msg assistant typing"; bubble.dataset.i = upto; $("msgs").appendChild(bubble); }
  if (bubble.classList.contains("msg-set")) { bubble.className = "msg assistant"; }
  const who = c.kind === "world" ? "The narrator" : c.kind === "group" ? (S.nextSpeaker || "The group") : c.name;
  const waiting = verb => `<span class="typing-l"><span>${esc(who)} is ${verb}…</span>${lanternSVG("seq")}</span>`;
  bubble.innerHTML = waiting("thinking"); bubble.classList.add("typing");
  const box = $("msgs"); box.scrollTop = box.scrollHeight;
  // follow the new reply down only until its first line reaches the top, so it can be read from the start
  let follow = true; const stopFollow = () => { follow = false; };
  box.addEventListener("touchstart", stopFollow, { once: true, passive: true }); box.addEventListener("wheel", stopFollow, { once: true, passive: true });
  try {
    let p;
    const pause = matchMedia("(prefers-reduced-motion: reduce)").matches ? 150 : 800;
    for (let attempt = 0; attempt < 2; attempt++) {
      let latest = "", shown = false, revealP = null;
      const show = () => { bubble.classList.remove("typing"); bubble.innerHTML = fmt(latest.split("[[")[0]); decorateSfx(bubble); if (follow) { const target = Math.min(box.scrollHeight - box.clientHeight, bubble.offsetTop - 8); if (target > box.scrollTop) box.scrollTop = target; } };
      const raw = await ds(buildPrompt(c, chat, upto, cont), {
        thinking: S.settings.thinking,
        temperature: attempt ? Math.min(S.settings.temperature, 0.7) : undefined,
        onThinking: () => {},
        onDelta: full => {
          latest = full;
          if (!revealP) {
            const l = bubble.querySelector(".lantern");
            if (l) { l.classList.remove("seq"); l.classList.add("lit"); const t = bubble.querySelector(".typing-l > span"); if (t) t.textContent = `${who} is writing…`; }
            revealP = new Promise(res => setTimeout(() => { shown = true; show(); res(); }, pause));
          } else if (shown) show();
        }
      });
      if (revealP) await revealP;
      p = parseTag(raw);
      if (!garbled(stripColor(p.text), c)) break;
      if (attempt === 0) { bubble.classList.add("typing"); bubble.innerHTML = `<span class="typing-l"><span>That came out garbled. Trying again…</span>${lanternSVG("seq")}</span>`; }
      else setStatus("This reply may still be garbled. Tap ↻ for a new version, or lower Temperature in Settings.", true);
    }
    if (!p.text) throw new Error("The model sent an empty reply. Tap ↻ to try again.");
    const meta = { mood: p.mood || chat.mood || "neutral", place: p.place || chat.place, focus: c.kind === "group" ? (memberByName(c, p.focus)?.name || chat.focus || "") : "", amb: p.amb || null, act: p.act || null };
    if (existing) {
      existing.alts = existing.alts || [existing.content];
      existing.altMeta = existing.altMeta || [];
      existing.alts.push(p.text); existing.alt = existing.alts.length - 1;
      existing.altMeta[existing.alt] = meta;
      existing.content = p.text; Object.assign(existing, meta);
    } else {
      chat.messages.push({ id: uid(), role: "assistant", content: p.text, alts: [p.text], alt: 0, altMeta: [meta], ...meta, ...(cont ? { cont: true } : {}) });
    }
    chat.mood = meta.mood; if (p.place) chat.place = p.place; if (meta.focus) chat.focus = meta.focus;
    S.nextSpeaker = ""; renderSpeakers();
    await saveChat();
    renderMsgs(true); updateStage();
    showMsgTop(existing ? upto : chat.messages.length - 1);
    if (!existing) maintainMemory(c, chat).catch(e => setStatus("Memory update skipped: " + e.message, true));
    captionImages(chat).catch(() => {});
  } catch (e) {
    if (!existing) bubble.remove(); else renderMsgs(true);
    setStatus(e.message, true);
  } finally { setBusy(false); }
}

/* ---------- Memory ---------- */
async function maintainMemory(c, chat) {
  const st = S.settings;
  const start = chat.summarizedUpTo || 0, end = chat.messages.length - st.keepRecent;
  if (end > start) {
    const chunk = chat.messages.slice(start, end).filter(m => m.role !== "image");
    const size = chunk.reduce((a, m) => a + m.content.length, 0);
    if (size > st.summarizeAt) { setStatus("Saving older events to memory…"); await summarize(c, chat, chunk, end); }
  }
  chat.turnsSinceFacts = (chat.turnsSinceFacts || 0) + 1;
  if (chat.turnsSinceFacts >= st.factsEvery) { setStatus("Updating remembered facts…"); await updateFacts(c, chat); }
  if (S.chat === chat) setStatus("");
}
async function summarize(c, chat, chunk, end) {
  const u = uname();
  const txt = chunk.map(m => `${m.role === "user" ? u : speakerLabel(c)}: ${m.content}${m.image ? ` [shared an image${m.caption ? ": " + m.caption : ""}]` : ""}`).join("\n\n");
  const sum = await ds([
    { role: "system", content: "You keep the running summary of a long roleplay story. Merge the existing summary and the new events into ONE updated summary in past tense, third person. Preserve names, relationships and how they changed, promises, secrets, injuries, items, decisions, and unresolved threads. Drop filler. Up to 450 words. Output only the summary." },
    { role: "user", content: `Story: ${c.name}. Protagonist: ${u}.\n\nExisting summary:\n${chat.summary || "(none yet)"}\n\nNew events:\n${txt}` }
  ], { temperature: 0.3, maxTokens: 1000, plain: true });
  if (sum.trim()) { chat.summary = sum.trim(); chat.summarizedUpTo = end; await saveChat(); }
}
async function updateFacts(c, chat) {
  const u = uname();
  chat.turnsSinceFacts = 0;
  const recent = chat.messages.filter(m => m.role !== "image").slice(-14).map(m => `${m.role === "user" ? u : speakerLabel(c)}: ${m.content}`).join("\n\n");
  const pinned = chat.facts.filter(f => f.pin), loose = chat.facts.filter(f => !f.pin);
  const out = await ds([
    { role: "system", content: `You maintain a list of durable facts for continuity in a roleplay (${c.name}) with ${u}. Update the list using the recent conversation: add new important facts, correct facts that changed, merge duplicates, remove facts no longer true. Keep only what matters later: names, relationships and feelings, decisions, promises, secrets revealed, possessions, injuries, appearance changes, places, time of day/date. Each fact under 20 words. At most 30 facts. Do not repeat the pinned facts. Respond as JSON: {"facts": ["...", "..."]}` },
    { role: "user", content: `Pinned facts (keep, don't repeat):\n${pinned.map(f => "- " + f.t).join("\n") || "(none)"}\n\nCurrent facts:\n${loose.map(f => "- " + f.t).join("\n") || "(none)"}\n\nRecent conversation:\n${recent}` }
  ], { temperature: 0.2, maxTokens: 1200, json: true, plain: true });
  let list; try { list = JSON.parse(out).facts; } catch { return; }
  if (Array.isArray(list)) {
    chat.facts = [...pinned, ...list.filter(x => typeof x === "string" && x.trim()).slice(0, 30).map(t => ({ t: t.trim(), pin: false }))];
    await saveChat();
  }
}

/* ---------- Expand & Split helpers ---------- */
const EXPAND = {
  appearance: ["the character's physical appearance: build, face, coloring, hair or fur, clothing, distinctive features", "60-120"],
  personality: ["the character's personality and background: temperament, history, motivations, fears, quirks, speech style, relationships", "180-350"],
  scenario: ["the opening scenario: where and when the story starts, the situation, and what is at stake", "90-200"],
  first: ["the opening message of the roleplay, written in the story's voice with *actions* in asterisks and dialogue in quotes, setting the scene and ending where the moment naturally pauses, without questions or prompts aimed at the user", "120-250"],
  world: ["the world or setting: geography, history, cultures, factions, technology or magic, daily life, tone and themes", "250-450"],
  groupdesc: ["how this group of characters fits together: how they know each other, their dynamics, shared history and tensions", "120-250"],
  lore: ["a lorebook entry: a self-contained reference note the AI consults when its keywords come up", "60-150"],
  cast: ["one listing in this world (a character, faction, species, location or concept, as named in the context): its key details, appearance or nature, role in the world, and how it works or what it wants", "80-200"],
  persona: ["the user's own character (persona): name-appropriate appearance, personality and background", "100-220"]
};
async function expandText(kind, draft, ctx) {
  const [what, len] = EXPAND[kind] || ["this text", "100-250"];
  const out = await ds([
    { role: "system", content: `You help write cards for an interactive fiction app. Expand the user's draft of ${what}. Keep every detail and the intent of what they wrote and never contradict it. Add specific, vivid, consistent detail that fills the gaps, matching their tone and point of view. Aim for about ${len} words. If the draft is empty, write it from scratch using the context. Output only the finished text: no headings, no commentary, no quotation marks around it.` },
    { role: "user", content: `Context:\n${ctx || "(none)"}\n\nDraft:\n${draft || "(empty)"}` }
  ], { temperature: 0.9, maxTokens: 900, plain: true });
  return out.trim();
}
function wireExpand(root, ctxFn) {
  root.querySelectorAll("textarea[data-x]:not([data-wired])").forEach(ta => {
    ta.dataset.wired = "1";
    let row = ta.nextElementSibling;
    if (!row || !row.classList.contains("xrow")) { row = document.createElement("div"); row.className = "xrow"; ta.after(row); }
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "xbtn"; btn.textContent = "✦ Expand";
    row.appendChild(btn);
    let undo = null;
    ta.addEventListener("input", () => { if (undo !== null) { undo = null; btn.textContent = "✦ Expand"; } });
    btn.onclick = async () => {
      if (undo !== null) { const u = undo; ta.value = u; ta.dispatchEvent(new Event("input")); return; }
      if (!hasKey()) { btn.textContent = "Add your API key in Settings first"; return; }
      btn.disabled = true; btn.textContent = "Expanding…";
      try {
        const prev = ta.value;
        const out = await expandText(ta.dataset.x, prev, ctxFn ? ctxFn() : "");
        if (out) { ta.value = out; ta.dispatchEvent(new Event("input")); undo = prev; btn.textContent = "↶ Undo expand"; }
        else btn.textContent = "✦ Expand";
      } catch (e) { btn.textContent = e.message; setTimeout(() => { btn.textContent = "✦ Expand"; }, 4000); }
      finally { btn.disabled = false; }
    };
  });
}
function cardContext(w) {
  const parts = [`Type: ${KINDS[w.kind || "character"].label}`, `Name: ${w.name || "(unnamed)"}`];
  if (w.kind === "character") parts.push(`Form: ${ART[artOf(w)].label}`);
  if (w.appearance) parts.push(`Appearance: ${w.appearance.slice(0, 800)}`);
  if (w.description) parts.push(`Description: ${w.description.slice(0, 1500)}`);
  if (w.scenario) parts.push(`Scenario: ${w.scenario.slice(0, 800)}`);
  if (w.kind === "group") parts.push("Members:\n" + (w.members || []).map(byId).filter(Boolean).map(m => `- ${m.name}: ${(m.description || "").slice(0, 300)}`).join("\n"));
  if (w.kind === "world" && (w.cast || []).length) parts.push("World listings: " + w.cast.map(x => `${x.name} (${(WORLD_TYPES[x.type] || "Character").toLowerCase()})`).join(", "));
  if ((w.tags || []).length) parts.push("Tags: " + w.tags.join(", "));
  parts.push(`User's persona: ${uname()}${persona().description ? " — " + persona().description.slice(0, 300) : ""}`);

function findLoose(text, needle, from) {

async function splitChunk(text, kind, w) {

  const j = await dsJSON([
    { role: "system", content: `You divide text for an interactive fiction app. The text describes a ${forGroup ? "group of characters" : "world"} and mixes several separate subjects together. Break it into consecutive parts, in order. Each part is either one distinct subject with its own description (allowed types: ${types}) or "general" for text that is not about one specific subject.
For every part give its name, its type, and "start": the EXACT first 6 to 10 words where that part begins, copied character for character from the text. A part runs until the next part starts, so together the parts must cover the whole text.
Respond as JSON: {"parts": [{"name": "...", "type": "...", "start": "..."}]}` },
    { role: "user", content: text }

  const parts = Array.isArray(j.parts) ? j.parts : Array.isArray(j.entries) ? j.entries : [];

  }

}

function loreEditor(box, arr, ctxFn) {

  const label = (l, i) => (l.name || splitKeys(l.keys)[0] || `Entry ${i + 1}`).slice(0, 16);
  const draw = () => {
    if (arr.length > seen) sel = arr.length - 1;
    seen = arr.length; sel = Math.min(sel, arr.length - 1);
    box.innerHTML = `<div class="tabs ltabs">${arr.map((l, i) => `<button type="button" class="tab ${i === sel ? "on" : ""}" data-i="${i}">${esc(label(l, i))}</button>`).join("")}<button type="button" class="tab" data-i="add">+ New</button></div>`;
    box.querySelectorAll(".ltabs [data-i]").forEach(t => t.onclick = () => {
      if (t.dataset.i === "add") { arr.push({ keys: "", text: "" }); draw(); box.querySelector('[data-k="keys"]')?.focus(); }
      else { sel = +t.dataset.i; draw(); }
    });
    if (!arr.length) { box.insertAdjacentHTML("beforeend", '<p class="note">No entries yet. Tap + New.</p>'); return; }
    const l = arr[sel], i = sel;
    const d = document.createElement("div"); d.className = "lore";
    d.innerHTML = `${l.name ? `<div class="lbl">${esc(l.name)}</div>` : ""}<input placeholder="Keywords, comma separated" value="${esc(l.keys)}" data-k="keys"><input placeholder="Only if one of these is also mentioned (optional)" value="${esc(l.secondary || "")}" data-k="secondary"><textarea data-x="lore" placeholder="What the AI should know when these come up" data-k="text">${esc(l.text)}</textarea><label class="check" style="font-size:14px"><input type="checkbox" data-c="constant" ${l.constant ? "checked" : ""}> Always on (ignore keywords)</label><label class="check" style="font-size:14px"><input type="checkbox" data-c="enabled" ${l.enabled !== false ? "checked" : ""}> Enabled</label><div class="xrow"><button class="btn small danger" type="button" data-rm>Remove entry</button></div>`;
    d.querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => {
      l[el.dataset.k] = el.value;
      if (el.dataset.k === "keys") { const t = box.querySelector(`.ltabs [data-i="${i}"]`); if (t) t.textContent = label(l, i); }
    }));

    d.querySelector("[data-rm]").onclick = () => { arr.splice(i, 1); seen = arr.length; sel = Math.max(0, i - 1); draw(); };
    box.appendChild(d);

  };

}

  const wrap = document.createElement("div"); wrap.className = "rtabs"; ta.after(wrap);
  const rules = parseRules(ta.value); let sel = 0;
  const label = (r, i) => (r.replace(/^[-•*\d.)\s]+/, "").replace(/\[\/?colou?r[^\]]*\]/gi, "").slice(0, 14) || `Rule ${i + 1}`);
  const sync = () => { ta.value = rules.map(r => r.trim()).filter(Boolean).join("\n\n"); };
  const draw = () => {
    sel = Math.min(sel, rules.length - 1);
    wrap.innerHTML = `<div class="tabs">${rules.map((r, i) => `<button type="button" class="tab ${i === sel ? "on" : ""}" data-i="${i}">${esc(label(r, i))}</button>`).join("")}<button type="button" class="tab" data-i="add">+ New rule</button></div>`
      + (rules.length ? `<textarea style="min-height:90px" placeholder="${esc(ta.placeholder || "A rule the AI always follows")}">${esc(rules[sel])}</textarea><div class="xrow"><button type="button" class="btn small danger" data-rm>Remove rule</button></div>` : `<p class="note">No rules yet. Tap + New rule.</p>`);

      row.innerHTML = `<div class="grow"><div><b>${esc(p.name || "Unnamed")}</b>${p.id === S.personaId ? '<span class="badge">Active</span>' : ""}</div><div class="sub">${esc((p.description || "No description").slice(0, 90))}</div></div>${p.id === S.personaId ? "" : '<button class="btn small" data-use>Use</button>'}<button class="btn small" data-edit>Edit</button>`;
      row.querySelector("[data-use]")?.addEventListener("click", () => usePersona(p.id));
      row.querySelector("[data-edit]").onclick = () => editPersona(p, false);
      $("pList").appendChild(row);
    }
    $("pNew").onclick = () => editPersona({ id: uid(), name: "", description: "" }, true);
  });
}
async function usePersona(id) {
  S.personaId = id; await savePersonas(); closeSheet();
  if (!$("chat").hidden && S.charId) await openChat(S.charId); else renderHome();
  if (!$("chat").hidden) toast(`Playing as ${personaName(id)}`);
}
function editPersona(p, isNew) {
  const work = { ...p };
  openSheet(isNew ? "New persona" : "Edit persona", b => {
    b.innerHTML = `
      ${field("Name", `<input id="peName" value="${esc(work.name)}" placeholder="Who you play">`)}
      ${field("Description", `<textarea id="peDesc" data-x="persona" style="min-height:140px" placeholder="Appearance, personality, background">${esc(work.description)}</textarea>`, "Characters see this, and it's used when illustrating scenes.")}
      <button class="btn primary" id="peSave">${isNew ? "Create and use" : "Save"}</button>
      ${!isNew && S.personas.length > 1 ? '<button class="btn danger" id="peDel">Delete persona</button>' : ""}`;
    wireExpand(b, () => `Persona name: ${$("peName").value}`);
    $("peSave").onclick = async () => {
      work.name = $("peName").value.trim(); work.description = $("peDesc").value.trim();
      if (!work.name) { $("peName").focus(); $("peName").placeholder = "A name is required"; return; }
      const i = S.personas.findIndex(x => x.id === work.id);
      if (i < 0) S.personas.push(work); else S.personas[i] = work;
      if (isNew) S.personaId = work.id;
      await savePersonas();
      if (isNew && !$("chat").hidden && S.charId) { closeSheet(); await openChat(S.charId); } else { renderHome(); openPersonas(); }
    };
    if ($("peDel")) confirmBtn($("peDel"), "Tap again: deletes this persona and its chats", async () => {
      S.personas = S.personas.filter(x => x.id !== work.id);
      for (const c of S.chars) { const idx = await getIndex(c.id); for (const e of idx.filter(x => x.personaId === work.id)) await deleteChat(c.id, e.id); }
      if (S.personaId === work.id) S.personaId = S.personas[0].id;
      await savePersonas();
      if (!$("chat").hidden && S.charId) { closeSheet(); await openChat(S.charId); } else { renderHome(); openPersonas(); }
    });
  });
}

/* ---------- Lorebooks ---------- */
function openBooks() {
  openSheet("Lorebooks", b => {
    b.innerHTML = `<p class="note">A lorebook is a set of entries you can attach to as many characters, worlds and groups as you like. Entries load only when their keywords come up.</p><div class="stack" id="bList"></div><button class="btn primary" id="bNew">New lorebook</button><button class="btn" id="bImport">Import lorebook (Janitor / SillyTavern)</button>`;
    if (!S.books.length) $("bList").innerHTML = '<p class="note">No lorebooks yet.</p>';
    for (const bk of S.books) {
      const used = S.chars.filter(c => (c.bookIds || []).includes(bk.id)).length;
      const row = document.createElement("button"); row.className = "listrow";
      row.innerHTML = `<div class="grow"><b>${esc(bk.name)}</b><div class="sub">${bk.entries.length} entr${bk.entries.length === 1 ? "y" : "ies"} · used by ${used}</div></div><span class="badge">Edit</span>`;
      row.onclick = () => editBook(bk, false);
      $("bList").appendChild(row);
    }
    $("bNew").onclick = () => editBook({ id: uid(), name: "", entries: [] }, true);
    $("bImport").onclick = importBook;
  });
}
function importBook() {
  openSheet("Import lorebook", b => {
    b.innerHTML = `
      <p class="note">Paste a lorebook exported from Janitor AI or SillyTavern (the text starting with [ or {), or choose the file. Always-on entries, secondary keywords, whole-word matching and entry order carry over.</p>
      ${field("Name", `<input id="ibName" placeholder="e.g. Vore">`)}
      ${field("Lorebook JSON", `<textarea id="ibText" style="min-height:200px;font-family:ui-monospace,monospace;font-size:13px" placeholder="[ { &quot;key&quot;: [...], &quot;content&quot;: &quot;...&quot; } ]"></textarea>`)}
      <div class="row"><label class="btn" for="ibFile">Choose file instead</label></div>
      <input type="file" id="ibFile" accept=".json,application/json,text/plain" hidden>
      <div id="ibMsg" class="hint"></div>
      <button class="btn primary" id="ibGo">Import</button>`;
    $("ibFile").onchange = async e => { const f = e.target.files[0]; if (f) { $("ibText").value = await f.text(); if (!$("ibName").value) $("ibName").value = f.name.replace(/\.json$/i, ""); } };
    $("ibGo").onclick = () => {
      try {
        const r = parseLorebook($("ibText").value.trim());
        if (!r.entries.length) throw new Error("That lorebook has no entries with text.");
        const bk = { id: uid(), name: $("ibName").value.trim() || r.name || "Imported lorebook", entries: r.entries };
        editBook(bk, true);
        $("sheetBody").insertAdjacentHTML("afterbegin", `<p class="note">Read ${r.entries.length} entries (${r.entries.filter(e => e.constant).length} always on). Tick who should use it, then tap Create lorebook.</p>`);
      } catch (e) { $("ibMsg").textContent = e instanceof SyntaxError ? "That isn't valid JSON. Make sure you copied all of it, from the first [ to the last ]." : e.message; }
    };
  });
}
function editBook(bk, isNew, preset) {
  const work = JSON.parse(JSON.stringify(bk));
  const chosen = new Set(preset || S.chars.filter(c => (c.bookIds || []).includes(bk.id)).map(c => c.id));
  openSheet(isNew ? "New lorebook" : "Edit lorebook", b => {
    b.innerHTML = `
      ${field("Name", `<input id="bkName" value="${esc(work.name)}" placeholder="e.g. The Sallow Coast">`)}
      <div class="group"><h3>Entries</h3><div id="bkLore" class="stack"></div><button class="btn" id="bkAdd">Add entry</button></div>
      <div class="group"><h3>Use with</h3>
        <div class="row"><button class="btn small" id="bkAll">Select all</button><button class="btn small" id="bkNone">Select none</button></div>
        <div class="stack" id="bkUse"></div>
      </div>
      <button class="btn primary" id="bkSave">${isNew ? "Create lorebook" : "Save lorebook"}</button>
      ${isNew ? "" : '<button class="btn danger" id="bkDel">Delete lorebook</button>'}`;
    const redraw = loreEditor($("bkLore"), work.entries, () => `Lorebook: ${$("bkName").value}`);
    $("bkAdd").onclick = () => { work.entries.push({ keys: "", text: "" }); redraw(); };
    const drawUse = () => {
      const box = $("bkUse"); box.innerHTML = S.chars.length ? "" : '<p class="note">Create a character first.</p>';
      for (const c of S.chars) {
        const l = document.createElement("label"); l.className = "checkrow";
        l.innerHTML = `<input type="checkbox" ${chosen.has(c.id) ? "checked" : ""}><img alt=""><span>${esc(c.name)}${c.kind !== "character" ? ` <span class="badge">${KINDS[c.kind].label}</span>` : ""}</span>`;
        setImg(l.querySelector("img"), thumbURL(c), c);
        l.querySelector("input").onchange = e => { e.target.checked ? chosen.add(c.id) : chosen.delete(c.id); };
        box.appendChild(l);
      }
    };
    drawUse();
    $("bkAll").onclick = () => { S.chars.forEach(c => chosen.add(c.id)); drawUse(); };
    $("bkNone").onclick = () => { chosen.clear(); drawUse(); };
    $("bkSave").onclick = async () => {
      work.name = $("bkName").value.trim();
      if (!work.name) { $("bkName").focus(); $("bkName").placeholder = "A name is required"; return; }
      work.entries = work.entries.filter(e => e.text.trim());
      const i = S.books.findIndex(x => x.id === work.id);
      if (i < 0) S.books.push(work); else S.books[i] = work;
      for (const c of S.chars) {
        c.bookIds = (c.bookIds || []).filter(id => id !== work.id);
        if (chosen.has(c.id)) c.bookIds.push(work.id);
      }
      await saveBooks(); await saveChars();
      openBooks();
    };
    if ($("bkDel")) confirmBtn($("bkDel"), "Tap again to delete this lorebook", async () => {
      S.books = S.books.filter(x => x.id !== work.id);
      for (const c of S.chars) c.bookIds = (c.bookIds || []).filter(id => id !== work.id);
      await saveBooks(); await saveChars(); openBooks();
    });
  });
}

        <button class="btn" type="button" id="cVisGen">Write it from the card</button>

async function shrinkImage(file, max = 768) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return cv.toDataURL("image/jpeg", 0.85);
}

/* ---------- Import character cards (Tavern-style JSON or PNG) ---------- */
function readPngCard(buf) {
  const dv = new DataView(buf); let p = 8, found = {};
  while (p + 8 <= dv.byteLength) {
    const len = dv.getUint32(p), type = String.fromCharCode(...new Uint8Array(buf, p + 4, 4));
    if (type === "tEXt") {
      const data = new Uint8Array(buf, p + 8, len), z = data.indexOf(0);
      const key = new TextDecoder("latin1").decode(data.slice(0, z));
      if (key === "chara" || key === "ccv3") {
        const bin = atob(new TextDecoder("latin1").decode(data.slice(z + 1)));
        found[key] = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
      }
    }
    if (type === "IEND") break;
    p += 12 + len;
  }
  return found.ccv3 || found.chara || null;
}
$("importCard").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    let card, pic = "";
    if (/png$/i.test(f.type) || /\.png$/i.test(f.name)) { card = readPngCard(await f.arrayBuffer()); pic = await shrinkImage(f); }
    else card = JSON.parse(await f.text());
    if (!card) throw new Error();
    if (card.app === "lanternroom" && card.char) {
      const c = { ...blankChar("character"), ...card.char, id: uid() };
      S.chars.unshift(c); await saveChars(); renderHome(); editChar(c, false); return;
    }
    const d = card.data || card;
    const desc = [d.description, d.personality ? "Personality: " + d.personality : "", d.mes_example ? "Example dialogue:\n" + d.mes_example : ""].filter(Boolean).join("\n\n");
    let lore = []; try { if (d.character_book) lore = parseLorebook(d.character_book).entries; } catch {}
    const c = { ...blankChar("character"), name: d.name || "Imported", description: desc, scenario: d.scenario || "", firstMessage: d.first_mes || "", altGreetings: (d.alternate_greetings || []).filter(g => typeof g === "string" && g.trim()), lore, customPortrait: pic };
    S.chars.unshift(c); await saveChars(); renderHome(); editChar(c, false);
  } catch { $("tagline").textContent = "That file doesn't look like a character card (PNG or JSON)."; }
};

      if (blobs.length) {
        const built = new Set((await builtinSounds()).map(x => x.name.toLowerCase().replace(/[^a-z0-9]/g, "")));
        const meta = new Map(((await Store.get("sounds")) || []).map(x => [x.id, x]));

  async fetchSound(id) {

document.addEventListener("visibilitychange", () => { if (!Sync.on()) return; if (document.hidden) Sync.push(); else Sync.pull(); });
setInterval(() => { if (Sync.on() && !document.hidden) Sync.pull(); }, 60000);
function drawAccount(box) {
  if (!box) return;
  if (Sync.on()) {
    box.innerHTML = `<h3>Account</h3><p class="note" style="margin:0">Logged in as <b>${esc(Sync.st.email || "")}</b>. Bots, chats, personas, lorebooks, rules, settings and your own sounds sync to every device where you log in. Your API key stays on each device.</p>

      <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn small" type="button" id="acNow">Sync now</button><button class="btn small" type="button" id="acOut">Log out</button></div>`;
    $("acNow").onclick = async () => { $("acStat").textContent = "Syncing…"; await Sync.push(); await Sync.pull(); $("acStat").textContent = Sync.status; };
    confirmBtn($("acOut"), "Tap again: this device keeps its copy", () => { Sync.logOut(); drawAccount(box); });
    return;
  }
  box.innerHTML = `<h3>Account</h3><p class="note" style="margin:0">Log in to keep your bots, chats, settings and sounds the same on every phone and computer. Your API key is entered once per device and stays there.</p>
    <input id="acEmail" type="email" autocomplete="username" placeholder="Email" value="${esc(Sync.st.email || "")}">
    <input id="acPass" type="password" autocomplete="current-password" placeholder="Password (8+ characters)">
    <div class="hint" id="acStat">${esc(Sync.status || "")}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn primary small" type="button" id="acIn">Log in</button><button class="btn small" type="button" id="acNew">Create my account</button></div>`;
  const go = async create => {
    const email = $("acEmail").value.trim(), pass = $("acPass").value;
    if (!email || pass.length < 8) { $("acStat").textContent = "Enter your email and a password of at least 8 characters."; return; }
    $("acIn").disabled = $("acNew").disabled = true; $("acStat").textContent = create ? "Creating your account…" : "Logging in…";
    try {

/* ---------- Boot & migrations ---------- */
async function migrateChats() {
  for (const k of await Store.keys()) {
    if (!k.startsWith("chat:")) continue;
    const [, cid, pid] = k.split(":");
    const old = await Store.get(k);
    if (cid && old && old.messages && byId(cid)) {
      old.id = uid(); old.personaId = pid || S.personaId; old.created = old.created || Date.now();
      await Store.set("c2:" + old.id, old);
      await touchIndex(cid, old);
    }
    await Store.del(k);
  }
}
(async () => {
  await Store.open();
  const saved = (await Store.get("settings")) || {};

  if (S.settings.sfxRules === "Write every sound effect or onomatopoeia in bold capitals inside a color tag, like [color=green]**BWOORP**[/color].\n- green: belches, stomach gurgles and growls\n- #a8875a (brown): farts\n- #c9a27e (light brown): pooping and defecation sounds\n- red: physical damage, impacts, bones breaking, combat, gunshots, explosions\n- for anything else pick a fitting color, e.g. lightskyblue for water and splashes, gold for magic, orange for fire, silver for metal and machines, hotpink for kisses") S.settings.sfxRules = DEFAULTS.sfxRules;

  S.recent = (await Store.get("recent")) || {};
  S.books = (await Store.get("books")) || [];
  S.personas = (await Store.get("personas")) || [];

  S.personaId = (await Store.get("activePersona")) || S.personas[0].id;
