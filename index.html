<meta charset="utf-8">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%2250%25%22%20cy%3D%2258%25%22%20r%3D%2250%25%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffd98a%22%20stop-opacity%3D%22.95%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23f0a24a%22%20stop-opacity%3D%22.35%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23e8a95b%22%20stop-opacity%3D%220%22/%3E%3C/radialGradient%3E%3ClinearGradient%20id%3D%22f%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23fff6cf%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23ffc35a%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff7a2e%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2237%22%20r%3D%2226%22%20fill%3D%22url%28%23g%29%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%227%22%20r%3D%224.2%22%20fill%3D%22none%22%20stroke%3D%22%23c9bbd9%22%20stroke-width%3D%222.6%22/%3E%3Cpath%20d%3D%22M20%2014h24l-3%206H23z%22%20fill%3D%22%234a3f5c%22/%3E%3Crect%20x%3D%2219%22%20y%3D%2220%22%20width%3D%2226%22%20height%3D%2230%22%20rx%3D%225%22%20fill%3D%22%232a2433%22%20stroke%3D%22%238d7ea3%22%20stroke-width%3D%222.6%22/%3E%3Cpath%20d%3D%22M32%2026c4%205%206%208%206%2012a6%206%200%200%201-12%200c0-4%202-7%206-12z%22%20fill%3D%22url%28%23f%29%22/%3E%3Crect%20x%3D%2216%22%20y%3D%2250%22%20width%3D%2232%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234a3f5c%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a one-screen phone app. Home = cast list; Chat = scene background, portrait header, bubbles, composer. Dark by design (night reading). */
:root{
  --bg:#16131d; --surface:#211d2b; --surface-2:#2c2739; --line:#3a3449;
  --fg:#efeaf6; --muted:#a39bb6; --accent:#e8a95b; --accent-ink:#2a1a06;
  --user:#3a3150; --danger:#e2766f; --ok:#8fcf9f;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
  --bg-deep:#0e0c13; --glow:#2a2140; --card-0:#1b1824; --user-1:#43395d; --user-2:#352d4a; --line-hi:#4d4560;
  --act:#c9bfdc; --quote:#fff3e2; --user-label:#cfc4ec;
  --accent-hi:color-mix(in srgb,var(--accent) 78%,#fff); --accent-lo:color-mix(in srgb,var(--accent) 88%,#000);
  --fl-core:color-mix(in srgb,var(--accent) 22%,#fff); --fl-mid:color-mix(in srgb,var(--accent) 70%,#fff); --fl-base:color-mix(in srgb,var(--accent) 80%,#e2401a);
  --fl-halo:color-mix(in srgb,var(--accent) 55%,#fff);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 12px;font-size:13px}
.icon{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg);flex:none}
.icon:active{background:var(--surface-2)}
.icon svg{width:22px;height:22px}

#app{height:100%;padding-top:env(safe-area-inset-top,0px)}
section.screen{height:100%;display:flex;flex-direction:column;position:relative}

/* Home */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.topbar h1{font:400 28px/1.1 var(--f-display);margin:0;letter-spacing:.01em}
.topbar h1 span{color:var(--accent)}
.home-scroll{flex:1;overflow-y:auto;padding:8px 16px 24px}
.tagline{color:var(--muted);margin:0 0 16px;font-size:14px}
#charList{display:grid;gap:12px}
.char-card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.char-card img,.char-card .ph{width:72px;height:90px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.char-card .name{font:400 19px/1.2 var(--f-display)}
.char-card .snip{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.char-card > div{min-width:0}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.home-actions .btn{flex:1 1 auto;white-space:nowrap;padding-inline:10px}
.home-actions{gap:8px}
.ph{display:grid;place-items:center;font:400 28px var(--f-display);color:var(--accent)}

/* Chat */
#chat{background:var(--bg);overflow:hidden}
#fxLayer{position:fixed;overflow:hidden;pointer-events:none;z-index:60}
#fxLayer .fxp,#fxLayer .fxring{position:absolute}
#scene{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
#scene.on{opacity:.38}
#chat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent),color-mix(in srgb,var(--bg) 20%,transparent) 30%,color-mix(in srgb,var(--bg) 85%,transparent));pointer-events:none;z-index:0}
.chatbar,#msgs,#composer,#status{position:relative;z-index:1}
.chatbar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chatbar .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:2px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:2px solid var(--accent);flex:none;transition:opacity .4s}
.who .t{min-width:0}
.who .n{font:400 18px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood-chip{display:inline-block;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--accent);margin-right:4px;text-transform:capitalize}
#msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.assistant{align-self:flex-start;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:6px}
.msg em.act{color:var(--act);font-style:italic}
.msg .q{color:var(--quote)}
.msg.typing{color:var(--muted)}
.msg.img{padding:6px;background:var(--surface);border:1px solid var(--line);align-self:center;max-width:94%}
.msg.img img{display:block;border-radius:12px;width:100%;min-height:120px;background:var(--surface-2)}
.msg.img .mrow{margin:2px 0 -2px}
.msg.img .cap{font-size:12px;color:var(--muted);padding:6px 6px 2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.swipe{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.swipe button{padding:4px 10px;border-radius:999px;color:var(--accent);font-weight:700}
.swipe button:disabled{opacity:.3}
#status{font-size:12px;color:var(--muted);padding:0 16px 4px;min-height:0}
#status.err{color:var(--danger)}
#composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);border-top:1px solid var(--line)}
#input{flex:1;min-width:0;resize:none;max-height:calc(45vh / var(--z, 1));min-height:44px;transition:height .18s ease;padding:10px 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);line-height:1.4}
#send{background:var(--accent);color:var(--accent-ink)}
#send:disabled{opacity:.5}

/* Sheets */
#sheet{position:fixed;inset:0;z-index:10;background:rgba(8,6,12,.6);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 20px}
.panel-head h2{margin:0;font:400 22px var(--f-display)}
#sheetBody{overflow-y:auto;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.field textarea{min-height:90px;resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.group{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.group h3{margin:0;font:400 18px var(--f-display)}
.fact{display:flex;align-items:flex-start;gap:6px;padding:8px 6px 8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.fact.pinned{border-color:var(--accent)}
.fact span{flex:1;min-width:0;padding-top:3px}
.fact button{width:32px;height:32px;border-radius:8px;color:var(--muted);flex:none}
.fact.pinned .pin{color:var(--accent)}
.lore{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.lore input,.lore textarea{background:var(--surface)}
.big-portrait{width:100%;border-radius:16px;background:var(--surface-2);aspect-ratio:4/5;object-fit:cover}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;border-radius:12px;padding:14px 16px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood-grid figure{margin:0;text-align:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.mood-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.pick button{display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:12px;border:2px solid transparent;color:var(--muted);font-size:12px;align-items:center}
.pick button.sel{border-color:var(--accent);color:var(--accent)}
.pick{grid-template-columns:repeat(2,1fr)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.badge{display:inline-block;font:700 10px/1.6 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:middle}
.persona-bar{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;margin-bottom:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:14px;color:var(--muted)}
.persona-bar b{color:var(--fg)}
.persona-bar .chg{margin-left:auto;color:var(--accent);font-weight:700}
.msg-set{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:88%}
.msg-set .msg{max-width:100%}
.spk{display:flex;align-items:center;gap:8px;margin-bottom:4px;font:400 15px/1.2 var(--f-display);color:var(--accent)}
.spk img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.xrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.xbtn{font-size:13px;font-weight:700;color:var(--accent);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.xbtn:disabled{opacity:.6}
#speakers{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;padding:6px 10px 2px}
.chip{flex:none;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.checkrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.checkrow img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none}
.checkrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:8px}
.listrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%}
.listrow .grow{flex:1;min-width:0}
.listrow .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow.on{border-color:var(--accent)}
.kind-opt{display:flex!important;flex-direction:column;align-items:flex-start!important;gap:2px;text-align:left}
.kind-opt small{font-weight:400;color:var(--muted);font-size:13px}
.gen-opt{border-color:var(--accent)!important;color:var(--accent)!important}
.gen-wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 8px}
.gen-wait .lantern{width:72px;height:112px}
.gen-sum{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.gen-sum h3{margin:0 0 6px;font-family:var(--f-display);color:var(--accent)}
.gen-sum p{margin:0 0 8px}
.gen-tags{display:flex;flex-wrap:wrap;gap:4px}
details.gen-sec{border-bottom:1px solid var(--line)}
details.gen-sec summary{cursor:pointer;font-weight:700;padding:11px 0;list-style:none;min-height:34px}
details.gen-sec summary::-webkit-details-marker{display:none}
details.gen-sec summary::after{content:"›";float:right;color:var(--muted);transition:transform .2s}
details.gen-sec[open] summary::after{transform:rotate(90deg)}
.gen-body{padding:0 0 10px;font-size:14px;color:var(--fg)}
.gen-body p{margin:0 0 10px}
.cast{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cast .row input,.cast select,.cast textarea{background:var(--surface)}
.range-row{display:flex;flex-direction:column;gap:4px}
.range-row .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.range-row .top b{font-size:15px}
.range-row .val{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.range-row .desc{font-size:13px;color:var(--muted)}
.range-row input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:6px}
.warn{font-size:13px;color:#f1c56b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details.adv summary{cursor:pointer;font-weight:700;color:var(--accent);padding:10px 0;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] .advbody{display:flex}
.advbody{flex-direction:column;gap:14px}
/* ---- polish ---- */
body{background:radial-gradient(120% 70% at 50% -10%,var(--glow) 0%,var(--bg) 55%) fixed,var(--bg)}
.btn{transition:transform .12s ease,background-color .2s,box-shadow .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active,.icon:active,.chip:active,.xbtn:active,.tab:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));box-shadow:0 4px 18px -6px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:hover{border-color:var(--line-hi)}
.icon{transition:transform .12s ease,background-color .2s}
.topbar h1{text-shadow:0 0 24px color-mix(in srgb,var(--accent) 25%,transparent)}
.char-card{background:linear-gradient(160deg,var(--surface) 0%,var(--card-0) 100%);transition:transform .15s ease,border-color .2s,box-shadow .2s}
.char-card:active{transform:scale(.985)}
.char-card:hover{border-color:var(--line-hi);box-shadow:0 8px 24px -14px rgba(0,0,0,.7)}
.char-card img{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 6px 16px -8px rgba(0,0,0,.8)}
.avatar{box-shadow:0 0 0 3px color-mix(in srgb,var(--bg) 80%,transparent),0 0 16px -2px var(--ring,var(--accent));border-color:var(--ring,var(--accent));transition:border-color .5s,box-shadow .5s}
#sheet{animation:fadeIn .18s ease}
.panel{animation:slideUp .26s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 50px -20px rgba(0,0,0,.8)}
.panel-head::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.panel-head{position:relative}
.msg.enter,.msg-set.enter{animation:msgIn .28s ease-out}
.msg.user{background:linear-gradient(160deg,var(--user-1),var(--user-2))}
.msg.assistant{box-shadow:0 6px 18px -12px rgba(0,0,0,.8)}
.who-l{font:700 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;opacity:.9}
.msg.user .who-l{color:var(--user-label);text-align:right}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
#input{transition:border-color .2s,box-shadow .2s,height .18s ease}
#btnMin{display:none;width:34px;height:34px;color:var(--muted)}
#composer.open #btnMin{display:inline-grid}
#composer.open{flex-wrap:wrap;row-gap:6px}
#composer.open #input{order:-1;flex:1 1 100%;width:100%}
#composer.open #btnMin{margin-left:auto}
#composer:not(.open) #input{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.msg.blank-open{border-style:dashed;opacity:.9}
/* v1.12: more text on screen */
#msgs{gap:8px;padding:12px 10px 6px}
#msgs .msg{font-size:14.5px;line-height:1.42;padding:8px 12px;border-radius:16px}
#msgs .msg .who-l{font-size:11px}
.rtabs,.ltabs{margin-bottom:6px}

/* lantern */
.lantern{display:inline-block;overflow:visible}
.lantern .flame-g{transform-origin:32px 62px;animation:flick 1.6s infinite ease-in-out}
.lantern .halo{transform-origin:32px 56px;animation:halo 2.3s infinite ease-in-out}
.lantern .smoke{opacity:0}
.lantern.out .flame-g{animation:none;transform:scale(0,0);opacity:0;transition:transform .45s ease-in,opacity .45s}
.lantern.out .halo{animation:none;opacity:0;transition:opacity .6s}
.lantern.out .smoke{animation:smoke 1.6s ease-out}
.lantern.relit .flame-g{animation:relight .55s ease-out,flick 1.6s .55s infinite ease-in-out}
.lantern.relit .halo{animation:haloIn .7s ease-out,halo 2.3s .7s infinite ease-in-out}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}15%{transform:scale(.95,1.07) skewX(-3deg)}30%{transform:scale(1.04,.94) skewX(2deg)}45%{transform:scale(.98,1.05) skewX(-1deg)}60%{transform:scale(1.02,.97) skewX(3deg)}80%{transform:scale(.96,1.04) skewX(-2deg)}}
@keyframes halo{0%,100%{opacity:.9;transform:scale(1)}20%{opacity:.7;transform:scale(.96)}35%{opacity:1;transform:scale(1.02)}55%{opacity:.8;transform:scale(1.04)}70%{opacity:.95;transform:scale(.99)}}
@keyframes smoke{0%{opacity:0;transform:translateY(6px)}25%{opacity:.75}100%{opacity:0;transform:translateY(-18px) scaleX(1.4)}}
@keyframes relight{0%{transform:scale(0,0)}55%{transform:scale(1.35,1.45)}100%{transform:scale(1,1)}}
@keyframes haloIn{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.2)}100%{opacity:.9;transform:scale(1)}}

.lantern.seq .sparks circle:nth-child(2){animation-delay:.08s}.lantern.seq .sparks circle:nth-child(3){animation-delay:.16s}.lantern.seq .sparks circle:nth-child(4){animation-delay:.05s}

@keyframes seqFlame{0%,28%{transform:scale(0,0)}31%{transform:scale(.35,.25)}33%,41%{transform:scale(0,0)}46%{transform:scale(.5,.6)}52%{transform:scale(1,1.06)}58%{transform:scale(.95,1.05) skewX(-3deg)}64%{transform:scale(1.04,.95) skewX(2deg)}70%{transform:scale(1,1)}76%{transform:scale(.45,.35)}80%,100%{transform:scale(0,0)}}

.fx-cum svg{animation:fxDrip 2s infinite ease-in}

/* v1.27 play features: screen effects, gauges, pacer, dice */
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fx-vig{position:absolute;inset:0;z-index:2;pointer-events:none;transition:box-shadow 1.2s ease,background 1.2s ease;--vc:0,0,0;--va:0}
.fx-vig::before,.fx-vig::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
/* weather & light */
.fx-vig.w-rain{background:linear-gradient(180deg,rgba(60,80,120,.16),transparent 60%)}
.fx-vig.w-storm{background:linear-gradient(180deg,rgba(40,50,90,.28),transparent 70%);box-shadow:inset 0 0 120px rgba(10,12,30,.55)}
.fx-vig.w-snow{background:linear-gradient(180deg,rgba(200,220,255,.10),transparent 60%)}
.fx-vig.w-embers{background:radial-gradient(120% 70% at 50% 110%,rgba(255,140,50,.20),transparent 60%)}
.fx-vig.w-fireflies{box-shadow:inset 0 0 140px rgba(5,5,25,.6);background:linear-gradient(180deg,rgba(20,25,70,.18),transparent)}
.fx-vig.w-motes{background:radial-gradient(90% 60% at 30% -10%,rgba(220,255,170,.12),transparent 60%)}
.fx-vig.w-dust{box-shadow:inset 0 0 150px rgba(0,0,0,.7)}
.fx-vig.w-bubbles{background:linear-gradient(180deg,rgba(40,120,170,.18),rgba(10,40,80,.22));box-shadow:inset 0 0 120px rgba(0,30,60,.5)}
.fx-vig.w-bubbles::before{opacity:1;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(170,220,255,.05) 40px 70px);animation:fxCaustic 9s linear infinite}
.fx-vig.w-glints{background:linear-gradient(180deg,rgba(255,220,160,.08),transparent 50%)}
.fx-vig.w-combat{box-shadow:inset 0 0 90px rgba(0,0,0,.4)}
.fx-vig.h-light{box-shadow:inset 0 0 70px rgba(150,10,10,.28)}
.fx-vig.h-heavy{box-shadow:inset 0 0 130px rgba(160,0,0,.55);animation:fxHurt 1.1s ease-in-out infinite}
@keyframes fxHurt{0%,100%{filter:none}15%{filter:brightness(1.35)}30%{filter:none}45%{filter:brightness(1.2)}}
.fx-vig.flash::after{background:rgba(220,230,255,.55);animation:fxFlash 1.1s ease-out forwards}
.fx-vig.hitflash::after{background:radial-gradient(circle,transparent 40%,rgba(200,20,20,.45));animation:fxFlash .6s ease-out forwards}
/* what's happening */
.fx-vig.a-sex::before{opacity:1;box-shadow:inset 0 0 110px rgba(255,80,160,.55);animation:fxPulse .62s ease-in-out infinite}
.fx-vig.a-oral::before{opacity:1;box-shadow:inset 0 0 100px rgba(255,110,170,.42);animation:fxPulse 1.1s ease-in-out infinite}
.fx-vig.a-kiss::before{opacity:1;box-shadow:inset 0 0 120px rgba(255,140,190,.35);animation:fxPulse 2.4s ease-in-out infinite}
.fx-vig.a-vore,.fx-vig.a-struggle,.fx-vig.a-swallow{--vc:110,220,90}
.fx-vig.vk-white{--vc:245,240,225}
.fx-vig.a-vore::before{opacity:1;box-shadow:inset 0 0 120px rgba(var(--vc),.42),inset 0 0 40px rgba(var(--vc),.18)}
.fx-vig.a-struggle::before{opacity:1;box-shadow:inset 0 0 120px rgba(var(--vc),.5),inset 0 0 44px rgba(var(--vc),.22)}
.fx-vig.a-swallow::before{opacity:1;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(var(--vc),.32) 100%);box-shadow:inset 0 0 90px rgba(var(--vc),.35)}
.fx-vig.a-chew::before{opacity:1;box-shadow:inset 0 0 130px rgba(20,8,14,.7),inset 0 0 50px rgba(60,20,30,.35)}
.fx-vig.a-mess::before,.fx-vig.c-cum::before{opacity:1;box-shadow:inset 0 0 120px rgba(250,246,232,.42),inset 0 0 36px rgba(255,255,255,.2);animation:fxPulse .9s ease-in-out infinite}
.fx-vig.a-drip::before,.fx-vig.a-inflate::before{opacity:1;box-shadow:inset 0 0 110px rgba(245,240,225,.3)}
.fx-vig.a-shit::before{opacity:1;box-shadow:inset 0 0 110px rgba(110,80,40,.45)}
.fx-vig.climax::after{background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,120,190,.35) 50%,transparent 80%);animation:fxClimax 1.6s ease-out forwards}
.fx-vig.lv-subtle{opacity:.55}
.fx-vig.lv-off{display:none}
.fx-vig.lv-still::before,.fx-vig.lv-still::after{animation:none!important}

@keyframes fxFlash{0%{opacity:0}8%{opacity:1}20%{opacity:.2}30%{opacity:.8}100%{opacity:0}}

#pacer.pc-change .pc-cue{animation:pcCue .7s ease-out}
#pacer .pc-burst{position:absolute;left:50%;top:40%;width:60px;height:60px;margin:-30px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,245,225,.95),rgba(255,111,174,.5) 45%,transparent 70%)}
#chat.pacing #msgs{padding-right:58px}
#pacer .pc-burst.go{animation:pcBurst 1.2s ease-out}
@keyframes pcStroke{from{top:0}to{top:126px}}
@keyframes pcEdge{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes pcRing{50%{box-shadow:0 0 0 6px rgba(255,111,174,.15)}}
@keyframes pcCue{0%{transform:scale(1.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes pcBurst{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(4)}}
/* dice */
.dline{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--fg)}
.dchip b{font-weight:400;color:var(--muted)}
.dchip .die{width:26px;height:26px;flex:none}
.dchip.d-criticalfail{color:#ff8a80;border-color:#ff8a80}
.dchip.d-fail{color:#f2a08e}
.dchip.d-partial{color:#f5d06b}
.dchip.d-success{color:#8fe08a}
.dchip.d-criticalsuccess{color:#ffd76a;border-color:#ffd76a;box-shadow:0 0 10px rgba(255,215,106,.35)}
.dvs{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.dres{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.dres.r-them{background:rgba(226,118,111,.16);color:#ff9a90}
.dres.r-tie{background:var(--surface-2);color:var(--muted)}
.tn-dot{margin-left:4px;font-size:10px;color:var(--accent);opacity:.8}
#rollNow{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:8px 12px 0;font-size:13px}
#rollNow[hidden]{display:none}
#rubNow{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:8px 12px 0;font-size:13px}
#rubNow[hidden]{display:none}
#rubNow .hint{flex:1;color:var(--muted)}
#rubNow .rub-tell{font:inherit;font-size:12.5px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;min-height:30px;cursor:pointer}
#rubNow .rub-tell.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#rubNow svg,#btnRub svg{width:20px;height:20px;flex:none}
#btnRub{touch-action:none;color:var(--accent)}
#btnRub .rub-more{position:absolute;right:2px;bottom:2px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
#btnRub{position:relative}
#rubPad{position:fixed;z-index:60;width:220px;height:220px;border-radius:28px;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--accent) 16%,var(--surface-2)),var(--surface) 75%);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  box-shadow:0 14px 40px rgba(0,0,0,.55);color:var(--accent);transition:opacity .15s}
#rubPad canvas{width:220px;height:220px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
#rubPad .rub-lbl{position:absolute;bottom:14px;font-size:12px;color:var(--fg);opacity:.8}
.rub-line{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.rub-line svg{width:15px;height:15px;color:var(--accent)}
#rollNow .hint{flex:1;color:var(--muted)}
#btnDice.spent{opacity:.4}
.roll-stage{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px) saturate(.7);-webkit-backdrop-filter:blur(4px) saturate(.7);opacity:0;transition:opacity .4s ease}
.roll-stage.on{opacity:1}
.roll-stage.off{opacity:0;transition:opacity .5s ease}
.rs-dice{display:flex;gap:26px;align-items:flex-end;justify-content:center}
.rs-slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px}
.rs-die{width:116px;height:116px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));will-change:transform}
.rs-die .die{width:100%;height:100%}
.rs-slot:not(.landed):not(.rolling) .rs-die{opacity:0}
.rs-who{font:400 15px var(--f-display);color:var(--muted)}
.rs-out{font-weight:700;font-size:15px;min-height:20px;opacity:0;transform:translateY(4px);transition:all .3s}
.rs-slot.landed .rs-out{opacity:1;transform:none}
.rs-slot.landed .rs-die{animation:rsLand .5s ease-out}
.o-criticalfail .rs-out{color:#ff8a80}.o-fail .rs-out{color:#f2a08e}.o-partial .rs-out{color:#f5d06b}.o-success .rs-out{color:#8fe08a}.o-criticalsuccess .rs-out{color:#ffd76a}
.rs-slot.nat20 .rs-die{animation:rsCrit 1.4s ease-out;filter:drop-shadow(0 0 26px rgba(255,215,106,.95)) drop-shadow(0 10px 22px rgba(0,0,0,.5))}
.rs-slot.nat20::after{content:"";position:absolute;width:220px;height:220px;margin-top:-50px;border-radius:50%;background:radial-gradient(circle,rgba(255,225,140,.55),transparent 65%);animation:rsGlow 1.6s ease-out forwards;pointer-events:none}
.rs-slot{position:relative}
.rs-slot.nat1 .rs-die{animation:rsFumble .9s ease-out;filter:drop-shadow(0 0 22px rgba(255,60,60,.8)) grayscale(.4) brightness(.8)}
.rs-slot.nat1::after{content:"";position:absolute;inset:-30px;margin-top:-20px;background:radial-gradient(circle,rgba(200,20,20,.45),transparent 65%);animation:rsGlow 1.4s ease-out forwards;pointer-events:none}
.rs-res{font:400 26px var(--f-display);opacity:0;transform:scale(.85);transition:all .35s cubic-bezier(.2,1.4,.4,1);color:var(--accent);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.rs-res.show{opacity:1;transform:none}
.rs-res.r-them{color:#ff9a90}.rs-res.r-tie{color:var(--fg)}
.rs-res.crit{font-size:32px}
@keyframes rsLand{0%{transform:scale(1.1,.9)}40%{transform:scale(.96,1.04)}100%{transform:none}}
@keyframes rsCrit{0%{transform:scale(1)}25%{transform:scale(1.25) rotate(-6deg)}50%{transform:scale(1.15) rotate(4deg)}100%{transform:none}}
@keyframes rsFumble{0%{transform:none}15%{transform:translateX(-8px) rotate(-8deg)}30%{transform:translateX(8px) rotate(6deg)}45%{transform:translateX(-5px)}60%{transform:translateY(6px) rotate(14deg)}100%{transform:translateY(4px) rotate(10deg)}}
@keyframes rsGlow{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@media (max-width:420px){.rs-die{width:96px;height:96px}.rs-slot{min-width:100px}.rs-dice{gap:14px}}
.badge.br{color:#c49bff}
@media (prefers-reduced-motion: reduce){.fx-vig::before,.fx-vig::after,#pacer .pc-bead,#pacer .pc-track{animation:none!important}}
.tg-group{flex:none;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.tg-group>summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:700;list-style:none}
.tg-group>summary::-webkit-details-marker{display:none}
#tgQ,#tgGName{width:100%;padding:10px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);flex:1;min-width:0}
.tg-list{display:flex;flex-direction:column;padding:0 6px 6px}
.tg-row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);text-align:left;font:inherit;cursor:pointer}
.tg-row .grow{flex:1;min-width:0}
.tg-row .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.tg-row .ti .tsv{width:20px;height:20px}.ti-blank{display:inline-block;width:20px}
.tg-row.is-hidden{opacity:.55}
.tg-row[style*="--tc"] b{color:var(--tc)}
.te-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.te-ic{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;display:grid;place-items:center;cursor:pointer}
.te-ic .tsv{width:22px;height:22px}.te-ic.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.te-def{background:var(--surface)!important;color:var(--muted)}
.te-prev{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.te-prev .btag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg)}
.te-prev .btag .tsv{width:13px;height:13px}
.btag[style*="--tc"],.pf-tag[style*="--tc"],.chip[style*="--tc"]{border-color:color-mix(in srgb,var(--tc) 65%,var(--line))!important;background:color-mix(in srgb,var(--tc) 14%,var(--surface-2))!important}
.qz-top{display:flex;flex-direction:column;gap:6px}
.qz-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}.qz-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qz-step{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.qz-q{font-family:"Young Serif",serif;font-size:22px;font-weight:400;margin:6px 0 2px;line-height:1.25}
.qz-opts{display:flex;flex-wrap:wrap;gap:8px}
.qz-o{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background-color .15s,border-color .15s,transform .1s}
.qz-o:active{transform:scale(.96)}.qz-o.on{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:var(--accent);color:var(--fg)}
.qz-o .tsv{width:16px;height:16px}.qz-n{color:var(--accent);font-size:12px}
.qz-decide{align-self:flex-start;border-style:dashed}
.qz-nav{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--surface) 30%)}

.qz-row:first-child{border-top:0}.qz-rq{font-size:12px;color:var(--muted)}.qz-ra{font-weight:700}
</style>

<div id="app">

<script>
"use strict";
/* ---------- Display size ---------- */
// Phones stay at 100%. On computers the whole app is scaled up with the window (CSS zoom on <body>) and
// centred in a column, so it doesn't look tiny and stretched. Settings → Display size overrides it per device.
let UIZ = 1;
function applyScale() {
  const pick = (S && S.settings && S.settings.uiScale) || "auto";
  const desk = matchMedia("(pointer: fine)").matches && innerWidth >= 760;
  let z = pick === "auto" ? (desk ? Math.min(1.6, Math.max(1.15, innerHeight / 870)) : 1) : +pick || 1;
  z = Math.max(0.5, Math.min(z, innerWidth / 360)); // always leave room for the phone layout
  UIZ = Math.round(z * 100) / 100;
  document.body.style.zoom = UIZ;
  document.documentElement.style.setProperty("--z", UIZ);
  const was = document.documentElement.className;
  document.documentElement.classList.toggle("wide", innerWidth / UIZ >= 780);
  document.documentElement.classList.toggle("wider", innerWidth / UIZ >= 1180);
  if (was !== document.documentElement.className && typeof renderPanes === "function") renderPanes();
}

/* ---------- Storage (IndexedDB, falls back to localStorage) ---------- */
const Store = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("lanternroom", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  async get(k) {
    if (this.db) return new Promise(res => { const t = this.db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); });
    try { const v = localStorage.getItem("lr:" + k); return v ? JSON.parse(v) : undefined; } catch { return undefined; }
  },
  async set(k, v) {
    const txt = JSON.stringify(v);
    // saving the same thing again is not an edit: nothing is written or sent to other devices
    if (typeof Sync !== "undefined" && Sync.synced(k)) { const cur = await this.get(k); if (cur !== undefined && JSON.stringify(cur) === txt) return false; }
    if (typeof Sync !== "undefined") Sync.mark(k);
    if (this.db) { await new Promise(res => { const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").put(JSON.parse(txt), k); tx.oncomplete = res; tx.onerror = res; }); return true; }
    try { localStorage.setItem("lr:" + k, txt); } catch {}
    return true;
  },
  async setRaw(k, v) { // stores Blobs as-is (IndexedDB only)
    if (typeof Sync !== "undefined") Sync.mark(k);
    if (!this.db) throw new Error("This browser can't store sound files.");
    return new Promise((res, rej) => { const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  async del(k) {
    if (typeof Sync !== "undefined") Sync.mark(k);
    if (this.db) return new Promise(res => { const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = res; tx.onerror = res; });
    try { localStorage.removeItem("lr:" + k); } catch {}
  },
  async keys() {
    if (this.db) return new Promise(res => { const t = this.db.transaction("kv").objectStore("kv").getAllKeys(); t.onsuccess = () => res(t.result.map(String)); t.onerror = () => res([]); });
    try { return Object.keys(localStorage).filter(k => k.startsWith("lr:")).map(k => k.slice(3)); } catch { return []; }
  }
};

}

function findLoose(text, needle, from) {
  const words = needle.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").split(/\s+/).filter(Boolean).slice(0, 12);
  if (!words.length) return -1;
  const pat = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/"/g, '["“”]').replace(/'/g, "['‘’]")).join("\\s+");

    if (m) return m.index;

    if (/[\p{L}\p{N}]/u.test(ch)) { chars.push(ch); map.push(i); sp = false; }
    else if (!sp) { chars.push(" "); map.push(i); sp = true; }
  }
  const hay = chars.join("");

  for (let n = Math.min(nw.length, 10); n >= Math.min(3, nw.length); n--) {
    const q = nw.slice(0, n).join(" ");

    if (k < 0) k = hay.indexOf(q);
    if (k >= 0 && (k === 0 || hay[k - 1] === " ")) return map[k];
  }

}
async function splitListings(text, kind, w, onPart) {
  const LIMIT = 9000;

  const paras = text.split(/\n\s*\n/), chunks = [];
  let cur = "";
  for (const p of paras) {
    if (cur && (cur.length + p.length) > 7000) { chunks.push(cur); cur = ""; }
    if (p.length > LIMIT) { for (let i = 0; i < p.length; i += 7000) chunks.push(p.slice(i, i + 7000)); continue; }
    cur += (cur ? "\n\n" : "") + p;

  for (let i = 0; i < chunks.length; i++) {
    onPart && onPart(i + 1, chunks.length);
    const r = await splitChunk(chunks[i], kind, w);
    all.tried += r.tried || 0;
    if (r.remaining) all.remaining.push(r.remaining);
    for (const e of r.entries) {
      const same = all.entries.find(x => x.name.toLowerCase() === e.name.toLowerCase());

}
async function splitChunk(text, kind, w) {
  const forGroup = kind === "group";
  const types = forGroup ? '"character"' : '"character", "group" (faction, organization, family, guild), "species" (a race or kind of creature), "location" (city, region, building, landmark), "concept" (magic system, economy, technology, religion, law, history, setting rule)';
  const j = await dsJSON([
    { role: "system", content: `You divide text for an interactive fiction app. The text describes a ${forGroup ? "group of characters" : "world"} and mixes several separate subjects together. Break it into consecutive parts, in order. Each part is either one distinct subject with its own description (allowed types: ${types}) or "general" for text that is not about one specific subject.
For every part give its name, its type, and "start": the EXACT first 6 to 10 words where that part begins, copied character for character from the text. A part runs until the next part starts, so together the parts must cover the whole text.
Respond as JSON: {"parts": [{"name": "...", "type": "...", "start": "..."}]}` },
    { role: "user", content: text }
  ], { temperature: 0.1, maxTokens: 2000, plain: true });

  for (const p of parts) {
    const st = String(p.start || "").trim(); if (!st) continue;
    const idx = findLoose(text, st, from); if (idx < 0) continue;
    if (locs.some(l => l.idx === idx)) continue;
    locs.push({ name: String(p.name || "").trim(), type: String(p.type || "general").toLowerCase(), idx }); from = idx + 1;
  }
  locs.sort((a, b) => a.idx - b.idx);

  locs.forEach((p, i) => {
    const seg = text.slice(p.idx, i + 1 < locs.length ? locs[i + 1].idx : text.length).trim();
    const valid = forGroup ? p.type === "character" : WORLD_TYPES[p.type];
    if (!valid || !p.name || p.type === "general") { remaining.push(seg); return; }
    const same = entries.find(e => e.name.toLowerCase() === p.name.toLowerCase());
    if (same) same.details += "\n\n" + seg; else entries.push({ name: p.name, type: p.type, details: seg });
  });
  return { remaining: remaining.map(x => x.trim()).filter(Boolean).join("\n\n"), entries, tried: parts.length };
}

const PERSONA_COLS = ["#6fc3d8", "#8fe08a", "#c7a6ff", "#ff8fb8", "#ffd36b", "#ff9f6b", "#f2f2f2", "#7d9cff"];
function openPersonas() {

    for (const p of S.personas) {
      const row = document.createElement("div"); row.className = "listrow" + (p.id === S.personaId ? " on" : "");
      row.innerHTML = `<div class="grow"><div><span class="p-dot" style="background:${esc(personaColor(p))}"></span><b>${esc(p.name || "Unnamed")}</b>${p.id === S.personaId ? '<span class="badge">Active</span>' : ""}</div><div class="sub">${esc((p.description || "No description").slice(0, 90))}</div></div>${p.id === S.personaId ? "" : '<button class="btn small" data-use>Use</button>'}<button class="btn small" data-edit>Edit</button>`;
      row.querySelector("[data-use]")?.addEventListener("click", () => usePersona(p.id));

}
async function usePersona(id) {
  S.personaId = id; await savePersonas(); closeSheet();
  if (!$("chat").hidden && S.charId) await openChat(S.charId); else renderHome();
  if (!$("chat").hidden) toast(`Playing as ${personaName(id)}`);

function editPersona(p, isNew) {
  const work = { ...p };
  openSheet(isNew ? "New persona" : "Edit persona", b => {
    b.innerHTML = `
      ${field("Name", `<input id="peName" value="${esc(work.name)}" placeholder="Who you play">`)}
      ${field("Description", `<textarea id="peDesc" data-x="persona" style="min-height:140px" placeholder="Appearance, personality, background">${esc(work.description)}</textarea>`, "Characters see this, and it's used when illustrating scenes.")}
      ${field("Your colour", `<div class="pe-cols" id="peCols">${PERSONA_COLS.map(c => `<button type="button" data-c="${c}" style="background:${c}" class="${(work.color || PERSONA_COLS[0]) === c ? "on" : ""}" aria-label="Colour ${c}"></button>`).join("")}<input type="color" id="peCol" value="${esc(work.color || PERSONA_COLS[0])}" aria-label="Any colour"></div>`, "How you show up in pictures the app draws for you.")}
      <button class="btn primary" id="peSave">${isNew ? "Create and use" : "Save"}</button>
      ${!isNew && S.personas.length > 1 ? '<button class="btn danger" id="peDel">Delete persona</button>' : ""}`;

    b.querySelectorAll("#peCols button").forEach(x => x.onclick = () => pick(x.dataset.c)); $("peCol").oninput = e => pick(e.target.value);
    $("peSave").onclick = async () => {

    b.innerHTML = `
      ${field("Name", `<input id="bkName" value="${esc(work.name)}" placeholder="e.g. The Sallow Coast">`)}
      <div class="group"><h3>Entries</h3><div id="bkLore" class="stack"></div><button class="btn" id="bkAdd">Add entry</button></div>
      <div class="group"><h3>Use with</h3>
        <div class="row"><button class="btn small" id="bkAll">Select all</button><button class="btn small" id="bkNone">Select none</button></div>
        <div class="stack" id="bkUse"></div>
      </div>
      <button class="btn primary" id="bkSave">${isNew ? "Create lorebook" : "Save lorebook"}</button>
      ${isNew ? "" : '<button class="btn danger" id="bkDel">Delete lorebook</button>'}`;
    const redraw = loreEditor($("bkLore"), work.entries, () => `Lorebook: ${$("bkName").value}`);
    $("bkAdd").onclick = () => { work.entries.push({ keys: "", text: "" }); redraw(); };
    const drawUse = () => {
      const box = $("bkUse"); box.innerHTML = S.chars.length ? "" : '<p class="note">Create a character first.</p>';
      for (const c of S.chars) {
        const l = document.createElement("label"); l.className = "checkrow";
        l.innerHTML = `<input type="checkbox" ${chosen.has(c.id) ? "checked" : ""}><img alt=""><span>${esc(c.name)}${c.kind !== "character" ? ` <span class="badge">${KINDS[c.kind].label}</span>` : ""}</span>`;
        setImg(l.querySelector("img"), thumbURL(c), c);
        l.querySelector("input").onchange = e => { e.target.checked ? chosen.add(c.id) : chosen.delete(c.id); };
        box.appendChild(l);
      }
    };
    drawUse();
    $("bkAll").onclick = () => { S.chars.forEach(c => chosen.add(c.id)); drawUse(); };
    $("bkNone").onclick = () => { chosen.clear(); drawUse(); };
    $("bkSave").onclick = async () => {
      work.name = $("bkName").value.trim();
      if (!work.name) { $("bkName").focus(); $("bkName").placeholder = "A name is required"; return; }
      work.entries = work.entries.filter(e => e.text.trim());
      const i = S.books.findIndex(x => x.id === work.id);
      if (i < 0) S.books.push(work); else S.books[i] = work;
      for (const c of S.chars) {
        c.bookIds = (c.bookIds || []).filter(id => id !== work.id);
        if (chosen.has(c.id)) c.bookIds.push(work.id);
      }
      await saveBooks(); await saveChars();
      openBooks();
    };
    if ($("bkDel")) confirmBtn($("bkDel"), "Tap again to delete this lorebook", async () => {
      S.books = S.books.filter(x => x.id !== work.id);
      for (const c of S.chars) c.bookIds = (c.bookIds || []).filter(id => id !== work.id);
      await saveBooks(); await saveChars(); openBooks();
    });
  });
}

/* ---------- Character / world / group editor ---------- */
function editChar(c, isNew, fromDraft) {
  const work = JSON.parse(JSON.stringify(fromDraft ? fromDraft.work : c));
  work.kind = work.kind || "character"; work.lore = work.lore || []; work.bookIds = work.bookIds || []; work.members = work.members || []; work.cast = work.cast || [];
  const K = work.kind;
  const title = (isNew ? "New " : "Edit ") + KINDS[K].label.toLowerCase();
  openSheet(title, b => {
    const splitRow = `<div class="xrow"><button type="button" class="xbtn" data-split>⇆ Split into listings</button></div>`;
    let main = "";
    if (K === "character") {
      main = `
      ${field("Character type", `<select id="cArt">${[["auto", "Detect from the card"], ...Object.entries(ART).map(([k, v]) => [k, v.label])].map(([k, l]) => `<option value="${k}" ${(work.artType || "auto") === k ? "selected" : ""}>${l}${k === "auto" && work.artDetected ? ` (now: ${ART[work.artDetected].label})` : ""}</option>`).join("")}</select>`, "Tells the pictures whether to draw a person, an anthro character, or an animal.")}
      ${field("Appearance", `<textarea id="cLook" data-x="appearance" style="min-height:70px" placeholder="Hair or fur, eyes, build, clothing, notable features">${esc(work.appearance)}</textarea>`)}
      ${field("Personality & background", `<textarea id="cDesc" data-x="personality" style="min-height:140px">${esc(work.description)}</textarea>`)}
      ${field("Scenario", `<textarea id="cScen" data-x="scenario">${esc(work.scenario)}</textarea>`, "Where the story starts. {{user}} and {{char}} work here.")}
      ${field("First message", `<textarea id="cFirst" data-x="first" style="min-height:120px">${esc(work.firstMessage)}</textarea>`)}`;
    } else if (K === "world") {
      main = `
      ${field("World description", `<textarea id="cDesc" data-x="world" style="min-height:180px" placeholder="Geography, history, cultures, factions, magic or technology, tone…">${esc(work.description)}</textarea>${splitRow}`, "Pasted characters, factions, species, places or rules in here? Split into listings moves each into its own listing below.")}
      <div class="group"><h3>World listings</h3>
        <p class="hint" style="margin:0;color:var(--muted);font-size:13px">Characters, factions, species, locations and concepts (magic, economies, setting rules).</p>
        <div class="tabs" id="cCastCats"></div>
        <div class="tabs" id="cCastItems"></div>
        <div id="cCastEd" class="stack"></div>
      </div>
      ${field("Opening situation", `<textarea id="cScen" data-x="scenario">${esc(work.scenario)}</textarea>${splitRow}`, "Who {{user}} is in this world and where the story begins.")}
      ${field("First message", `<textarea id="cFirst" data-x="first" style="min-height:120px" placeholder="The narrator's opening">${esc(work.firstMessage)}</textarea>`)}`;
    } else {
      main = `
      <div class="group" style="border:0;padding:0"><h3>Members</h3>
        <div class="tabs" id="cMemTabs"></div>
        <div id="cMembers" class="stack"></div>
      </div>
      ${field("About this group", `<textarea id="cDesc" data-x="groupdesc" style="min-height:120px" placeholder="How they know each other, their dynamics. You can also paste several character descriptions here and split them.">${esc(work.description)}</textarea>${splitRow}`, "Split into listings turns each character described here into a real character and adds them to the group.")}
      ${field("Scenario", `<textarea id="cScen" data-x="scenario">${esc(work.scenario)}</textarea>${splitRow}`)}
      ${field("First message", `<textarea id="cFirst" data-x="first" style="min-height:120px" placeholder="Optional. Use **Name:** at the start of each character's part.">${esc(work.firstMessage)}</textarea>`)}`;
    }
    b.innerHTML = `
      ${field("Name", `<input id="cName" value="${esc(work.name)}" placeholder="${KINDS[K].label} name">`)}
      ${field("Tags", `<input id="cTags" value="${esc((work.tags || []).join(", "))}" placeholder="e.g. female, furry, fantasy"><div class="xrow"><button type="button" class="xbtn" id="cTagGen">✦ Suggest tags</button></div>`, "Comma separated. Used for searching and filtering on the home screen.")}
      ${main}
      ${field("Rules (special instructions)", `<textarea id="cInstr" style="min-height:70px" placeholder="Optional rules for this ${KINDS[K].label.toLowerCase()} only, e.g. write ${K === "group" ? "Mira's" : "their"} thoughts in [color=violet]purple[/color]">${esc(work.instructions || "")}</textarea>`, "Always followed in this chat. Colored text works anywhere with [color=red]text[/color].")}
      ${field("Starting location", `<input id="cPlace" value="${esc(work.startPlace || "")}" placeholder="e.g. rainy tavern, candlelit">`)}
      <div class="group"><h3>Lorebook</h3>
        <p class="note">Entries load into the AI's memory only when one of their keywords comes up.</p>
        <div id="cLore" class="stack"></div>
        <button class="btn" type="button" id="cAddLore">Add lore entry</button>
        <div class="lbl">Shared lorebooks</div>
        <div id="cBooks" class="stack"></div>
      </div>
      ${K === "group" ? "" : `<div class="group"><h3>${K === "world" ? "Cover image" : "Portrait"}</h3>
        ${work.customPortrait ? `<img class="big-portrait" src="${esc(work.customPortrait)}" alt="">` : `
        ${field("Look used for pictures", `<textarea id="cVis" style="min-height:80px" placeholder="Written automatically from the card. You can edit it.">${esc(work.visual || "")}</textarea>`, "This exact text drives every picture. Fix anything that looks wrong here.")}
        <button class="btn" type="button" id="cVisGen">Write it from the card</button>
        <div class="lbl">Pick a look</div>
        <div id="cPick"></div>`}
        <div class="row"><label class="btn" for="cPic">${work.customPortrait ? "Replace uploaded image" : "Upload my own image instead"}</label>${work.customPortrait ? '<button class="btn" type="button" id="cPicClear">Use generated pictures</button>' : ""}</div>
        <input type="file" id="cPic" accept="image/*" hidden>
      </div>`}
      <div class="group"><h3>Dice</h3>${field("Rolls allowed per message", `<select id="cRollLim">${[[0, "Unlimited rerolls"], [1, "1 (no rerolls)"], [2, "2"], [3, "3"], [5, "5"]].map(([v, l]) => `<option value="${v}" ${(+work.rollLimit || 0) === v ? "selected" : ""}>${l}</option>`).join("")}</select>`, "How many times you can roll 🎲 before sending one message, so you can't keep rolling for the number you want. With a limit, a roll can't be thrown away either.")}</div>
      <div class="group"><h3>Status gauges</h3><p class="hint" style="margin:0;color:var(--muted);font-size:13px">Bars at the top of the chat (fullness, arousal, health…) that the AI moves as the story goes.</p><div id="cGauges" class="stack"></div></div>
      <div class="group"><h3>Gold, inventory and quests</h3><p class="hint" style="margin:0;color:var(--muted);font-size:13px">For adventures: a gold counter, a bag and a quest log under the chat header. The AI keeps them up to date and you can edit them.</p><div id="cRpg" class="stack"></div></div>
      <div id="cMsg" class="hint"></div>
      <button class="btn primary" id="cSave">${isNew ? "Create " + KINDS[K].label.toLowerCase() : "Save changes"}</button>
      ${isNew ? "" : `<button class="btn danger" id="cDel">Delete ${KINDS[K].label.toLowerCase()}</button>`}`;

    ruleTabs($("cInstr"));
    gaugeEditor(work); rpgEditor(work);
    const greets = [work.firstMessage || "", ...(work.altGreetings || [])];
    let gi = 0;
    const grab = () => {
      if ($("cArt")) work.artType = $("cArt").value;
      work.name = $("cName").value.trim();
      if ($("cLook")) work.appearance = $("cLook").value.trim();
      work.description = $("cDesc").value.trim(); work.scenario = $("cScen").value.trim();
      greets[gi] = $("cFirst").value; work.firstMessage = (greets[0] || "").trim(); work.altGreetings = greets.slice(1);
      work.startPlace = $("cPlace").value.trim();
      if ($("cRollLim")) work.rollLimit = +$("cRollLim").value || 0;
      work.tags = parseTags($("cTags").value); work.instructions = $("cInstr").value.trim();
      if ($("cVis")) {
        const v = $("cVis").value.trim();
        if (v !== (work.visual || "")) { work.visual = v; work.visualManual = !!v; work.visualSrc = cardSig(work); }
      }
    };
    const ctx = () => { grab(); return cardContext(work); };
    wireExpand(b, ctx);
    {
      const ta = $("cFirst"), fl = ta.closest(".field");
      fl.querySelector("label").textContent = "Opening messages";
      fl.querySelector("label").insertAdjacentHTML("afterend", `<div class="tabs" id="cTabs"></div>`);
      fl.insertAdjacentHTML("beforeend", `<div class="hint">Tap + to add another opening. New chats let you swipe between them.</div>`);
      const swap = i => { greets[gi] = ta.value; gi = i; ta.value = greets[gi] || ""; ta.dispatchEvent(new Event("input")); drawTabs(); };
      const drawTabs = () => {
        const box = $("cTabs");
        box.innerHTML = greets.map((g, i) => `<button type="button" class="tab ${i === gi ? "on" : ""}" data-t="${i}" aria-label="Opening ${i + 1}">${i + 1}</button>`).join("")
          + `<button type="button" class="tab" data-t="add" aria-label="Add an opening">+</button>`
          + (greets.length > 1 ? `<button type="button" class="tab rm" data-t="rm">Remove #${gi + 1}</button>` : "");
        box.querySelectorAll("[data-t]").forEach(x => x.onclick = () => {
          const t = x.dataset.t;
          if (t === "add") { greets[gi] = ta.value; greets.push(""); swap(greets.length - 1); ta.focus(); }
          else if (t === "rm") { greets.splice(gi, 1); gi = Math.max(0, gi - 1); ta.value = greets[gi] || ""; ta.dispatchEvent(new Event("input")); drawTabs(); }
          else swap(+t);
        });
      };
      ta.addEventListener("input", () => { greets[gi] = ta.value; });
      drawTabs();
    }

    $("cTagGen").onclick = async () => {
      const b2 = $("cTagGen"); grab();
      if (!hasKey()) { b2.textContent = "Add your API key in Settings first"; return; }
      b2.disabled = true; b2.textContent = "Thinking…";
      try { const t = await suggestTags(work); $("cTags").value = [...new Set([...(work.tags || []), ...t])].join(", "); b2.textContent = "✦ Suggest tags"; }
      catch (e) { b2.textContent = e.message; }
      finally { b2.disabled = false; }
    };
    const redrawLore = loreEditor($("cLore"), work.lore, ctx);
    $("cAddLore").onclick = () => { work.lore.push({ keys: "", text: "" }); redrawLore(); };
    const drawBooks = () => {
      const box = $("cBooks");
      box.innerHTML = S.books.length ? "" : '<p class="note">No shared lorebooks yet. Create them from Lorebooks on the home screen.</p>';
      for (const bk of S.books) {
        const l = document.createElement("label"); l.className = "checkrow";
        l.innerHTML = `<input type="checkbox" ${work.bookIds.includes(bk.id) ? "checked" : ""}><span>${esc(bk.name)} · ${bk.entries.length} entr${bk.entries.length === 1 ? "y" : "ies"}</span>`;
        l.querySelector("input").onchange = e => { work.bookIds = work.bookIds.filter(x => x !== bk.id); if (e.target.checked) work.bookIds.push(bk.id); };
        box.appendChild(l);
      }
    };
    drawBooks();

    // World cast (category tabs, then one tab per listing)
    const CAT_LABEL = { character: "Characters", group: "Groups", species: "Species", location: "Locations", concept: "Concepts" };
    let castCat = (work.cast[0] && WORLD_TYPES[work.cast[0].type]) ? work.cast[0].type : "character", castSel = -1;
    let drawCast = () => {};
    if (K === "world") {
      const typeOf = x => WORLD_TYPES[x.type] ? x.type : "character";
      drawCast = () => {
        const counts = {}; work.cast.forEach(x => { counts[typeOf(x)] = (counts[typeOf(x)] || 0) + 1; });
        $("cCastCats").innerHTML = Object.keys(WORLD_TYPES).map(k => `<button type="button" class="tab ${k === castCat ? "on" : ""}" data-c="${k}">${CAT_LABEL[k]}${counts[k] ? ` · ${counts[k]}` : ""}</button>`).join("");
        $("cCastCats").querySelectorAll("[data-c]").forEach(x => x.onclick = () => { castCat = x.dataset.c; castSel = -1; drawCast(); });
        const items = work.cast.map((x, i) => [x, i]).filter(([x]) => typeOf(x) === castCat);
        if (!items.some(([, i]) => i === castSel)) castSel = items.length ? items[0][1] : -1;
        $("cCastItems").innerHTML = items.map(([x, i]) => `<button type="button" class="tab ${i === castSel ? "on" : ""}" data-i="${i}">${esc((x.name || "Untitled").slice(0, 18))}</button>`).join("") + `<button type="button" class="tab" data-i="add" aria-label="Add a ${CAT_LABEL[castCat].toLowerCase()} listing">+ New</button>`;
        $("cCastItems").querySelectorAll("[data-i]").forEach(x => x.onclick = () => {
          if (x.dataset.i === "add") { work.cast.push({ name: "", type: castCat, details: "" }); castSel = work.cast.length - 1; drawCast(); $("cCastEd").querySelector("input")?.focus(); }
          else { castSel = +x.dataset.i; drawCast(); }
        });
        const ed = $("cCastEd");
        if (castSel < 0) { ed.innerHTML = `<p class="note">No ${CAT_LABEL[castCat].toLowerCase()} yet. Tap + New, or paste them into the description and tap Split into listings.</p>`; return; }
        const x = work.cast[castSel], ty = typeOf(x);
        ed.innerHTML = `<div class="cast"><div class="row"><input data-k="name" placeholder="Name" value="${esc(x.name)}" style="flex:2;padding:10px 12px;border-radius:10px;border:1px solid var(--line)"><select data-k="type" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line)">${Object.entries(WORLD_TYPES).map(([k, v]) => `<option value="${k}" ${ty === k ? "selected" : ""}>${v}</option>`).join("")}</select></div><textarea data-k="details" data-x="cast" style="min-height:130px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)" placeholder="${WORLD_HINTS[ty]}">${esc(x.details)}</textarea><div class="xrow"><button type="button" class="btn small danger" data-rm>Remove listing</button></div></div>`;
        const nameIn = ed.querySelector('[data-k="name"]');
        nameIn.addEventListener("input", () => { x.name = nameIn.value; const t = $("cCastItems").querySelector(`[data-i="${castSel}"]`); if (t) t.textContent = (x.name || "Untitled").slice(0, 18); });
        ed.querySelector('[data-k="type"]').addEventListener("change", e => { x.type = e.target.value; castCat = x.type; drawCast(); });
        const det = ed.querySelector('[data-k="details"]'); det.addEventListener("input", () => { x.details = det.value; });
        ed.querySelector("[data-rm]").onclick = () => { work.cast.splice(castSel, 1); castSel = -1; drawCast(); };
        wireExpand(ed, () => ctx() + `\nThis listing: ${x.name} (${WORLD_TYPES[ty]})`);
      };
      drawCast();
    }

    // Group members (one tab per member, plus an Add tab)
    let memSel = work.members[0] || "add";
    const memEdits = fromDraft && fromDraft.memEdits ? JSON.parse(JSON.stringify(fromDraft.memEdits)) : {};
    let drawMembers = () => {};
    if (K === "group") {
      drawMembers = () => {
        const ms = work.members.map(id => memEdits[id] || byId(id)).filter(Boolean);
        if (memSel !== "add" && !work.members.includes(memSel)) memSel = work.members[0] || "add";
        $("cMemTabs").innerHTML = ms.map(m => `<button type="button" class="tab ${m.id === memSel ? "on" : ""}" data-m="${m.id}">${esc((m.name || "Unnamed").slice(0, 16))}</button>`).join("") + `<button type="button" class="tab ${memSel === "add" ? "on" : ""}" data-m="add">+ Add</button>`;
        $("cMemTabs").querySelectorAll("[data-m]").forEach(x => x.onclick = () => { memSel = x.dataset.m; drawMembers(); });
        const box = $("cMembers");
        if (memSel === "add") {
          const pool = S.chars.filter(x => x.kind === "character" && !work.members.includes(x.id));
          box.innerHTML = `<button type="button" class="btn small" id="cMemNew">+ Create a new character</button>` + (pool.length ? `<div class="lbl">Or add one you already have</div>` : "");
          for (const m of pool) {
            const l = document.createElement("button"); l.type = "button"; l.className = "checkrow"; l.style.textAlign = "left";
            l.innerHTML = `<img alt=""><span>${esc(m.name)}</span><span class="badge">Add</span>`;
            setImg(l.querySelector("img"), portraitURL(m), m);
            l.onclick = () => { work.members.push(m.id); memSel = m.id; drawMembers(); };
            box.appendChild(l);
          }
          $("cMemNew").onclick = async () => { const nc = { ...blankChar("character"), name: "New character" }; S.chars.push(nc); await saveChars(); work.members.push(nc.id); memSel = nc.id; drawMembers(); box.querySelector("input")?.select(); };
          return;
        }
        const m = memEdits[memSel] || (memEdits[memSel] = JSON.parse(JSON.stringify(byId(memSel))));
        box.innerHTML = `
          <div class="row" style="align-items:center"><img alt="" style="flex:none;width:44px;height:55px;min-width:0;object-fit:cover;border-radius:8px"><input data-k="name" value="${esc(m.name)}" placeholder="Name" style="padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)"></div>
          <div class="field"><label>Appearance</label><textarea data-k="appearance" data-x="appearance" style="min-height:70px">${esc(m.appearance)}</textarea></div>
          <div class="field"><label>Personality & background</label><textarea data-k="description" data-x="personality" style="min-height:130px">${esc(m.description)}</textarea></div>
          <div class="xrow"><button type="button" class="btn small danger" data-rm>Remove from group</button></div>`;
        setImg(box.querySelector("img"), portraitURL(byId(memSel) || m), m);
        box.querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => { m[el.dataset.k] = el.value; if (el.dataset.k === "name") { const t = $("cMemTabs").querySelector(`[data-m="${m.id}"]`); if (t) t.textContent = (m.name || "Unnamed").slice(0, 16); } }));
        box.querySelector("[data-rm]").onclick = () => { work.members = work.members.filter(x => x !== memSel); delete memEdits[memSel]; memSel = work.members[0] || "add"; drawMembers(); };
        wireExpand(box, () => `Character in the group "${$("cName").value}": ${m.name}\nAppearance: ${m.appearance || "-"}\nPersonality: ${(m.description || "-").slice(0, 1200)}\n${cardContext(work)}`);
      };
      drawMembers();
    }

    // Split into listings
    b.querySelectorAll("[data-split]").forEach(btn => {
      const ta = btn.closest(".field").querySelector("textarea");
      const note = document.createElement("div"); note.className = "xnote"; btn.parentElement.after(note);
      const say = (t, err) => { note.textContent = t; note.classList.toggle("err", !!err); };
      let undo = null;
      ta.addEventListener("input", () => { if (undo) { undo = null; btn.textContent = "⇆ Split into listings"; } });
      btn.onclick = async () => {
        if (undo) {
          ta.value = undo.text; ta.dispatchEvent(new Event("input"));
          if (K === "world") { work.cast.splice(work.cast.length - undo.added, undo.added); drawCast(); }
          else { work.members = work.members.filter(id => !undo.created.includes(id)); S.chars = S.chars.filter(x => !undo.created.includes(x.id)); await saveChars(); drawMembers(); }
          undo = null; btn.textContent = "⇆ Split into listings"; say("Split undone."); return;
        }
        if (!ta.value.trim()) { say("Paste or write some text in that box first.", true); return; }
        if (!hasKey()) { say("Add your API key in Settings first.", true); return; }
        grab();
        btn.disabled = true; btn.textContent = "Sorting…";
        say(ta.value.length > 9000 ? `That's a long description (${Math.round(ta.value.length / 1000)}k characters), so it's split in parts. This can take a minute or two…` : "Reading the text…");
        try {
          const prev = ta.value;
          const r = await splitListings(prev, K, work, (i, n) => { btn.textContent = `Sorting part ${i} of ${n}…`; });
          if (!r.entries.length) { say(r.tried ? "The AI's split didn't line up with your text. Try again." : `No separate ${K === "world" ? "listings" : "characters"} found in that text.`, true); btn.textContent = "⇆ Split into listings"; return; }
          ta.value = r.remaining; ta.dispatchEvent(new Event("input"));
          if (K === "world") {
            for (const e of r.entries) work.cast.push({ name: e.name, type: WORLD_TYPES[e.type] ? e.type : "character", details: e.details });
            castCat = WORLD_TYPES[r.entries[0].type] ? r.entries[0].type : "character"; castSel = work.cast.length - r.entries.length;
            drawCast();
            undo = { text: prev, added: r.entries.length };
            say(`Moved ${r.entries.length} listing${r.entries.length === 1 ? "" : "s"} into World listings: ${r.entries.map(e => e.name).join(", ")}.`);
          } else {
            const created = [];
            for (const e of r.entries) {
              const nc = { ...blankChar("character"), name: e.name, description: e.details };
              S.chars.push(nc); created.push(nc.id); work.members.push(nc.id);

async function shrinkImage(file, max = 768) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return cv.toDataURL("image/jpeg", 0.85);
}

function readPngCard(buf) {
  const dv = new DataView(buf); let p = 8, found = {};
  while (p + 8 <= dv.byteLength) {
    const len = dv.getUint32(p), type = String.fromCharCode(...new Uint8Array(buf, p + 4, 4));
    if (type === "tEXt") {
      const data = new Uint8Array(buf, p + 8, len), z = data.indexOf(0);
      const key = new TextDecoder("latin1").decode(data.slice(0, z));
      if (key === "chara" || key === "ccv3") {
        const bin = atob(new TextDecoder("latin1").decode(data.slice(z + 1)));
        found[key] = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
      }
    }
    if (type === "IEND") break;
    p += 12 + len;
  }
  return found.ccv3 || found.chara || null;
}

async function migrateChats() {
  for (const k of await Store.keys()) {
    if (!k.startsWith("chat:")) continue;
    const [, cid, pid] = k.split(":");
    const old = await Store.get(k);
    if (cid && old && old.messages && byId(cid)) {
      old.id = uid(); old.personaId = pid || S.personaId; old.created = old.created || Date.now();
      await Store.set("c2:" + old.id, old);
      await touchIndex(cid, old);

    await Store.del(k);

}
